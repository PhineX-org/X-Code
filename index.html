<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Code — Code Editor</title>
<meta name="description" content="X Code is a lightweight code editor, designed for free and simplicity. It features a modern interface, syntax highlighting, and essential development tools, making it perfect for quick edits and small projects.">
<meta name="keywords" content="X Code, code editor, lightweight, modern interface, syntax highlighting, development tools, free, simplicity, quick edits, small projects">
<meta name="author" content="PhineX Group">
<meta property="og:title" content="X Code — PhineX Group">
<meta property="og:description" content="X Code is a lightweight code editor, designed for free and simplicity. It features a modern interface, syntax highlighting, and essential development tools, making it perfect for quick edits and small projects.">
<meta property="og:type" content="website">
<meta name="image" property="og:image" content="https://example.com/X-Code.jpg">
<meta type="image/png" href="X-Code.png" style="width: 40px; height: 40px;">
<link rel="icon" href="X-Code.png">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d30;--bg4:#333333;
  --sidebar:#252526;--activity:#333333;--tab-bg:#2d2d30;--tab-active:#1e1e1e;
  --border:#3c3c3c;--text:#d4d4d4;--muted:#858585;--accent:#39ff14;
  --accent-dim:rgba(57,255,20,0.12);--accent-glow:rgba(57,255,20,0.3);
  --sel:rgba(57,255,20,0.18);
  --kw:#569cd6;--str:#ce9178;--cmt:#6a9955;--fn:#dcdcaa;--num:#b5cea8;
  --type:#4ec9b0;--prop:#9cdcfe;--op:#d4d4d4;--regex:#d16969;--sel-css:#d7ba7d;
  --ghost:#5a6272;--status-bg:#007acc;
  --err:#f44747;--warn:#cca700;--info:#3794ff;
  --font:'JetBrains Mono',monospace;
}
html,body,#app{height:100%;width:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);}
#app{display:flex;flex-direction:column;}

/* TITLE BAR */
.titlebar{height:30px;background:#3c3c3c;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-bottom:1px solid #111;position:relative;-webkit-app-region:drag;}
.titlebar-title{font-size:11px;color:var(--muted);letter-spacing:.5px;}
.titlebar-brand{position:absolute;left:10px;display:flex;align-items:center;gap:6px;-webkit-app-region:no-drag;}
.brand-logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),#00bb33);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#000;}
.brand-name{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;}

/* MAIN AREA */
.main-area{display:flex;flex:1;overflow:hidden;}

/* ACTIVITY BAR */
.activity-bar{width:48px;background:var(--activity);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;flex-shrink:0;border-right:1px solid #111;}
.act-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:var(--muted);border-radius:4px;transition:color .15s;position:relative;}
.act-btn:hover{color:var(--text);}
.act-btn.active{color:var(--text);border-left:2px solid var(--accent);}
.act-sep{width:28px;height:1px;background:var(--border);margin:4px 0;}
.act-bottom{margin-top:auto;}

/* SIDEBAR */
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid #111;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:width .15s;}
.sidebar.collapsed{width:0;}
.sidebar-head{height:32px;display:flex;align-items:center;padding:0 12px;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;flex-shrink:0;justify-content:space-between;}
.sidebar-acts{display:flex;gap:2px;}
.sact{width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:var(--muted);border-radius:3px;transition:all .15s;}
.sact:hover{color:var(--text);background:rgba(255,255,255,.08);}

/* FILE TREE */
.file-tree{flex:1;overflow-y:auto;overflow-x:hidden;}
.file-tree::-webkit-scrollbar{width:6px;}
.file-tree::-webkit-scrollbar-thumb{background:var(--border);}
.ftree-item{display:flex;align-items:center;height:22px;cursor:pointer;font-size:12.5px;color:var(--text);user-select:none;position:relative;}
.ftree-item:hover{background:rgba(255,255,255,.05);}
.ftree-item.active-file{background:var(--accent-dim);color:var(--accent);}
.ftree-inner{display:flex;align-items:center;gap:4px;width:100%;padding-right:6px;overflow:hidden;}
.ftree-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:12.5px;}
.ftree-chevron{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.ftree-chevron.open{transform:rotate(90deg);}
.ftree-actions{display:none;margin-left:auto;gap:2px;flex-shrink:0;}
.ftree-item:hover .ftree-actions{display:flex;}
.ftree-act{width:16px;height:16px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:2px;}
.ftree-act:hover{color:var(--text);background:rgba(255,255,255,.1);}
.inline-row{display:flex;align-items:center;height:22px;gap:4px;}
.inline-inp{background:var(--bg3);border:1px solid var(--accent);color:var(--text);font:12px var(--font);padding:1px 5px;outline:none;flex:1;height:18px;}

/* SEARCH PANEL */
.search-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.search-box{padding:8px;border-bottom:1px solid var(--border);}
.search-inp{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font:12px var(--font);padding:5px 8px;outline:none;}
.search-inp:focus{border-color:var(--accent);}
.search-info{padding:4px 12px;font-size:11px;color:var(--muted);}
.search-results{flex:1;overflow-y:auto;}
.search-results::-webkit-scrollbar{width:6px;}
.search-results::-webkit-scrollbar-thumb{background:var(--border);}
.sresult{padding:4px 12px;cursor:pointer;}
.sresult:hover{background:rgba(255,255,255,.04);}
.sresult.active-result{background:var(--accent-dim);}
.sresult-path{font-size:11px;color:var(--accent);margin-bottom:1px;}
.sresult-text{font-size:12px;color:var(--text);}
.s-match{background:rgba(255,220,0,.25);border-radius:2px;}

/* AI CHAT PANEL */
.ai-chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ai-chat-msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
.ai-chat-msgs::-webkit-scrollbar{width:6px;}
.ai-chat-msgs::-webkit-scrollbar-thumb{background:var(--border);}
.ai-msg{padding:8px 10px;border-radius:4px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.ai-msg.user{background:var(--bg3);color:var(--text);border-left:2px solid var(--accent);}
.ai-msg.assistant{background:rgba(86,156,214,.08);color:var(--text);border-left:2px solid var(--kw);}
.ai-msg.system{color:var(--muted);font-style:italic;font-size:11px;padding:2px 6px;}
.ai-chat-input-row{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0;}
.ai-chat-inp{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font:12px var(--font);padding:5px 8px;outline:none;resize:none;height:56px;}
.ai-chat-inp:focus{border-color:var(--accent);}
.ai-send-btn{width:32px;height:56px;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.ai-send-btn:hover{background:var(--accent);color:#000;}
.ai-chat-actions{padding:0 8px 6px;display:flex;gap:4px;flex-wrap:wrap;}
.ai-quick-btn{padding:2px 8px;background:transparent;border:1px solid var(--border);color:var(--muted);font:10px var(--font);cursor:pointer;border-radius:10px;transition:all .15s;}
.ai-quick-btn:hover{border-color:var(--accent);color:var(--accent);}

/* EDITOR CONTAINER */
.editor-container{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* TAB BAR */
.tab-bar{height:35px;background:var(--tab-bg);display:flex;overflow-x:auto;overflow-y:hidden;flex-shrink:0;border-bottom:1px solid #111;}
.tab-bar::-webkit-scrollbar{height:2px;}
.tab-bar::-webkit-scrollbar-thumb{background:var(--border);}
.tab{height:35px;min-width:100px;max-width:180px;display:flex;align-items:center;gap:5px;padding:0 10px;cursor:pointer;font-size:12px;color:var(--muted);border-right:1px solid var(--border);flex-shrink:0;background:var(--tab-bg);transition:background .1s;}
.tab:hover{background:rgba(255,255,255,.04);}
.tab.active-tab{background:var(--tab-active);color:var(--text);border-top:2px solid var(--accent);}
.tab-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.tab-close{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;opacity:0;flex-shrink:0;border:none;background:transparent;cursor:pointer;color:var(--muted);}
.tab:hover .tab-close,.tab.active-tab .tab-close{opacity:.7;}
.tab-close:hover{opacity:1!important;background:rgba(255,255,255,.15);color:var(--text);}
.tab-toolbar{margin-left:auto;display:flex;align-items:center;gap:4px;padding:0 8px;flex-shrink:0;}
.tb-btn{height:24px;padding:0 8px;background:transparent;border:1px solid var(--border);color:var(--muted);font:11px var(--font);cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);}
.tb-btn.active-btn{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

/* EDITOR PANELS */
.editor-panels{flex:1;display:flex;overflow:hidden;position:relative;}

/* CODE EDITOR */
.code-editor{flex:1;display:flex;overflow:hidden;background:var(--bg);position:relative;}
.gutter{width:52px;overflow:hidden;background:var(--bg);border-right:1px solid var(--border);flex-shrink:0;user-select:none;position:relative;}
.gutter-inner{padding:16px 8px 16px 0;text-align:right;font-size:14px;line-height:21px;color:var(--muted);font-family:var(--font);white-space:pre;}
.gutter-markers{position:absolute;top:0;left:0;width:100%;pointer-events:none;}
.err-marker{position:absolute;left:2px;width:8px;height:8px;border-radius:50%;cursor:pointer;pointer-events:all;z-index:10;}
.err-marker.error{background:var(--err);}
.err-marker.warning{background:var(--warn);}
.err-marker.info{background:var(--info);}
.err-tooltip{position:fixed;background:#1a1a2e;border:1px solid var(--err);color:var(--text);font:11px var(--font);padding:6px 10px;z-index:9999;max-width:320px;white-space:pre-wrap;pointer-events:none;border-radius:3px;box-shadow:0 4px 16px rgba(0,0,0,.7);}
.editor-scroll{flex:1;overflow:auto;position:relative;}
.editor-scroll::-webkit-scrollbar{width:10px;height:10px;}
.editor-scroll::-webkit-scrollbar-track{background:var(--bg2);}
.editor-scroll::-webkit-scrollbar-thumb{background:#4a4a4a;}
.editor-scroll::-webkit-scrollbar-thumb:hover{background:#666;}
.editor-scroll::-webkit-scrollbar-corner{background:var(--bg2);}
.editor-inner{position:relative;width:max-content;min-width:100%;}
.hl-layer{padding:16px;font-size:14px;line-height:21px;font-family:var(--font);white-space:pre;pointer-events:none;display:block;width:max-content;min-width:100%;min-height:300px;}
.ed-textarea{position:absolute;top:0;left:0;width:100%;height:100%;padding:16px;font-size:14px;line-height:21px;font-family:var(--font);background:transparent;color:transparent;caret-color:#fff;border:none;outline:none;resize:none;white-space:pre;word-wrap:normal;overflow:hidden;z-index:2;tab-size:2;spellcheck:false;}
.ghost-text{color:var(--ghost);font-style:normal;}

/* Error squiggles in highlight layer */
.err-squiggle{text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--err);}
.warn-squiggle{text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--warn);}

/* Quick Fix Panel */
.quick-fix-panel{position:absolute;background:var(--bg3);border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.7);z-index:5000;min-width:280px;border-radius:4px;overflow:hidden;}
.qf-head{padding:6px 10px;font-size:11px;color:var(--muted);background:var(--bg4);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.qf-error{padding:8px 10px;font-size:12px;color:var(--err);border-bottom:1px solid var(--border);white-space:pre-wrap;}
.qf-fix{padding:8px 10px;cursor:pointer;font-size:12px;color:var(--text);display:flex;align-items:center;gap:6px;transition:background .1s;}
.qf-fix:hover{background:var(--accent-dim);color:var(--accent);}
.qf-loading{padding:8px 10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}

/* Syntax token classes */
.tk-kw{color:var(--kw);}
.tk-str{color:var(--str);}
.tk-cmt{color:var(--cmt);font-style:italic;}
.tk-fn{color:var(--fn);}
.tk-num{color:var(--num);}
.tk-type{color:var(--type);}
.tk-prop{color:var(--prop);}
.tk-regex{color:var(--regex);}
.tk-sel{color:var(--sel-css);}
.tk-plain{color:var(--text);}
.tk-op{color:var(--op);}

/* Search highlights */
.hl-match{background:rgba(255,220,0,.22);border-radius:2px;}
.hl-match-active{background:rgba(255,130,0,.45);}

/* IMAGE PREVIEW */
.img-preview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:12px;overflow:auto;padding:20px;}
.img-preview img{max-width:90%;max-height:70vh;border:1px solid var(--border);}
.img-meta{font-size:11px;color:var(--muted);}

/* WELCOME */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:var(--muted);}
.welcome-logo{width:72px;height:72px;background:linear-gradient(135deg,var(--accent),#00bb33);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#000;box-shadow:0 0 40px var(--accent-glow);}
.welcome-title{font-size:28px;font-weight:700;color:var(--text);letter-spacing:2px;}
.welcome-sub{font-size:13px;color:var(--muted);}
.welcome-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.welcome-btn{padding:8px 18px;background:var(--bg3);border:1px solid var(--border);color:var(--text);cursor:pointer;font:12px var(--font);display:flex;align-items:center;gap:6px;transition:all .15s;}
.welcome-btn:hover{border-color:var(--accent);color:var(--accent);}
.welcome-keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:11px;margin-top:8px;}
.k{background:var(--bg3);border:1px solid var(--border);padding:1px 6px;font:11px var(--font);color:var(--text);white-space:nowrap;}

/* TERMINAL */
.terminal{background:var(--bg2);border-top:1px solid #111;display:flex;flex-direction:column;flex-shrink:0;}
.term-head{height:28px;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:11px;color:var(--muted);background:var(--bg3);border-bottom:1px solid var(--border);flex-shrink:0;justify-content:space-between;}
.term-tabs{display:flex;gap:1px;}
.term-tab{padding:0 12px;height:28px;display:flex;align-items:center;font-size:11px;cursor:pointer;color:var(--muted);}
.term-tab.active-term{color:var(--text);border-bottom:1px solid var(--accent);}
.term-out{flex:1;overflow-y:auto;padding:8px 12px;font-size:12px;line-height:1.5;}
.term-out::-webkit-scrollbar{width:6px;}
.term-out::-webkit-scrollbar-thumb{background:var(--border);}
.term-in-row{display:flex;align-items:center;padding:2px 12px;height:26px;border-top:1px solid var(--border);flex-shrink:0;}
.term-prompt{color:var(--accent);margin-right:8px;font-size:12px;flex-shrink:0;}
.term-inp{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:12px var(--font);}

/* STATUS BAR */
.statusbar{height:22px;background:var(--status-bg);display:flex;align-items:center;padding:0 8px;font-size:11px;color:rgba(255,255,255,.85);gap:0;flex-shrink:0;}
.status-item{padding:0 6px;height:22px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap;}
.status-item:hover{background:rgba(255,255,255,.12);}
.status-right{margin-left:auto;display:flex;}
.status-ai{background:rgba(57,255,20,.25);color:var(--accent);}
.status-errors{background:rgba(244,71,71,.2);color:#ff6b6b;}
.large-file-badge{background:rgba(255,180,0,.15);color:#ffb400;padding:0 6px;font-size:10px;letter-spacing:.5px;}

/* DRAWING */
.draw-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:900;cursor:crosshair;}
.draw-toolbar{position:fixed;top:60px;right:16px;background:var(--bg3);border:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:6px;z-index:901;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.6);min-width:130px;}
.draw-toolbar-drag{font-size:11px;color:var(--muted);text-align:center;margin-bottom:4px;cursor:move;padding:2px 0;}
.dtool-row{display:flex;gap:4px;}
.dtool{width:32px;height:32px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:4px;transition:all .15s;}
.dtool:hover{background:rgba(255,255,255,.08);color:var(--text);}
.dtool.active-tool{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.dtool-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.draw-color{width:100%;height:28px;border:1px solid var(--border);border-radius:3px;cursor:pointer;background:transparent;}
.draw-range{width:100%;accent-color:var(--accent);}
.draw-act{width:100%;padding:5px;background:transparent;border:1px solid var(--border);color:var(--text);font:11px var(--font);cursor:pointer;border-radius:3px;transition:all .15s;}
.draw-act:hover{border-color:var(--accent);color:var(--accent);}
.draw-exit{border-color:#cc2222;color:#ff5555;}
.draw-exit:hover{background:rgba(204,34,34,.15);}

/* CONTEXT MENU */
.ctx-menu{position:fixed;background:var(--bg3);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.7);z-index:8000;min-width:170px;padding:3px 0;}
.ctx-item{padding:6px 14px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);}
.ctx-item:hover{background:var(--accent-dim);color:var(--accent);}
.ctx-sep{height:1px;background:var(--border);margin:3px 0;}

/* SCROLLBARS */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:0;}
::-webkit-scrollbar-thumb:hover{background:#666;}
.resize-handle{width:4px;cursor:col-resize;background:transparent;flex-shrink:0;}
.resize-handle:hover{background:var(--accent);}

/* AI indicators */
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:ai-pulse 1.2s infinite;display:inline-block;}
@keyframes ai-pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.unsaved-dot{width:7px;height:7px;border-radius:50%;background:var(--text);flex-shrink:0;}
.unsaved-dot.modified{background:var(--muted);}

/* Error indicator button in gutter */
.gutter-err-btn{position:absolute;left:0;width:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ================================================================
   STATE
================================================================ */
const DEFAULT_STATE = {
  files:{},openTabs:[],activeTab:null,fileTree:[],
  expandedFolders:[],autoSave:true,
  activePanel:'explorer',showSidebar:true,showTerminal:false,
  searchQuery:'',searchResults:[],searchIdx:0,
  drawMode:false,drawTool:'pen',drawColor:'#39ff14',drawSize:3,
  editorZoom:1,splitView:1,
  terminalHistory:[{text:'X Code  —  type "help" for commands',cmd:false}],
  modified:{},
  theme:{bg:'#1e1e1e',accent:'#39ff14',status:'#007acc'},
  aiChatHistory:[],
  diagnostics:{} // path -> [{line,col,msg,severity}]
};

let state;
try {
  const saved=localStorage.getItem('xcode-v3');
  if(saved){
    const p=JSON.parse(saved);
    state={...DEFAULT_STATE,...p,expandedFolders:p.expandedFolders||[],diagnostics:p.diagnostics||{},aiChatHistory:p.aiChatHistory||[]};
  } else { state={...DEFAULT_STATE}; }
} catch(e){ state={...DEFAULT_STATE}; }

// Runtime-only state (not persisted)
state.contextMenu=null;
state.aiSuggestion='';
state.aiLoading=false;
state.aiCursorPos=0;
state.drawings=[];
state.previewWin=null;
state.terminalInput='';
state.creatingIn=null;
state.renamingPath=null;
state.newItemName='';
state.quickFixPanel=null; // {x,y,lineIdx,fixes:[],loading}
state.aiChatLoading=false;
state.aiChatInput='';
state.errTooltip=null;

function saveState(){
  try {

/* ================================================================
   SYNTAX HIGHLIGHTER
================================================================ */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function sp(cls,txt){ return `<span class="tk-${cls}">${txt}</span>`; }

/* ---- HTML TOKENIZER (raw input, handles quoted attrs correctly) ---- */
function hlHTML(raw){
  if(!raw) return '';
  let out='', i=0, N=raw.length;

  while(i<N){
    // Script block
    if(/^<script[\s>/]/i.test(raw.slice(i))){
      const r=processEmbeddedBlock(raw,i,'script','javascript');
      out+=r.html; i=r.end; continue;
    }
    // Style block
    if(/^<style[\s>/]/i.test(raw.slice(i))){
      const r=processEmbeddedBlock(raw,i,'style','css');
      out+=r.html; i=r.end; continue;
    }
    // Comment
    if(raw.slice(i,i+4)==='<!--'){
      const end=raw.indexOf('-->',i+4);
      const chunk=end<0?raw.slice(i):raw.slice(i,end+3);
      out+=sp('cmt',esc(chunk)); i+=chunk.length; continue;
    }
    // DOCTYPE / processing instruction
    if(raw[i]==='<'&&raw[i+1]==='!'){
      const end=raw.indexOf('>',i);
      const chunk=end<0?raw.slice(i):raw.slice(i,end+1);
      out+=sp('kw',esc(chunk)); i+=chunk.length; continue;
    }
    // HTML Tag
    if(raw[i]==='<'){
      const end=findTagClose(raw,i);
      out+=hlHTMLTag(raw.slice(i,end+1)); i=end+1; continue;
    }
    // Text node
    const next=raw.indexOf('<',i);
    const text=next<0?raw.slice(i):raw.slice(i,next);
    out+=esc(text); i+=text.length;
  }
  return out;
}

function findTagClose(code,start){
  let i=start+1, inStr=false, q='';
  while(i<code.length){
    const c=code[i];
    if(inStr){ if(c===q)inStr=false; }
    else if(c==='"'||c==="'"){ inStr=true; q=c; }
    else if(c==='>') return i;
    i++;
  }
  return code.length-1;
}

function processEmbeddedBlock(code,start,tagName,lang){
  const closeTag='</'+tagName+'>';
  const tagEnd=findTagClose(code,start);
  const contentStart=tagEnd+1;
  const closeIdx=code.toLowerCase().indexOf(closeTag.toLowerCase(),contentStart);
  if(closeIdx<0) return {html:esc(code.slice(start)),end:code.length};
  const openTag=code.slice(start,tagEnd+1);
  const content=code.slice(contentStart,closeIdx);
  const closeTagRaw=code.slice(closeIdx,closeIdx+closeTag.length);
  const highlightedContent = lang==='javascript'?hlJS(esc(content)):hlCSS(esc(content));
  return {
    html:hlHTMLTag(openTag)+sp('plain',highlightedContent)+hlHTMLTag(closeTagRaw),
    end:closeIdx+closeTag.length
  };
}

function hlHTMLTag(raw){
  // raw = complete tag string like <div class="foo" id="bar">
  let out='', i=0;
  if(!raw.startsWith('<')) return esc(raw);
  out+='&lt;'; i=1;
  if(raw[i]==='/'){ out+='/'; i++; }

  // Tag name
  let j=i;
  while(j<raw.length&&/[\w:-]/.test(raw[j]))j++;
  if(j>i) out+=sp('kw',esc(raw.slice(i,j)));
  i=j;

  // Attributes
  while(i<raw.length){
    const c=raw[i];
    if(c==='>'){out+='&gt;';break;}
    if(c==='/'&&raw[i+1]==='>'){out+='/&gt;';break;}
    if(/\s/.test(c)){out+=c;i++;continue;}
    // Attribute name
    let k=i;
    while(k<raw.length&&raw[k]!=='='&&raw[k]!=='>'&&!/\s/.test(raw[k]))k++;
    if(k>i){out+=sp('prop',esc(raw.slice(i,k)));i=k;}
    if(raw[i]==='='){
      out+='='; i++;
      if(i<raw.length&&(raw[i]==='"'||raw[i]==="'")){
        const q=raw[i];
        let end=raw.indexOf(q,i+1);
        if(end<0)end=raw.length-1;
        out+=sp('str',esc(raw.slice(i,end+1)));
        i=end+1;
      } else {
        // Unquoted value
        let k=i;
        while(k<raw.length&&raw[k]!=='>'&&!/\s/.test(raw[k]))k++;
        out+=sp('str',esc(raw.slice(i,k))); i=k;
      }
    }
  }
  return out;
}

/* ---- JS/TS HIGHLIGHTER ---- */
function hlJS(h){
  // h is pre-escaped HTML
  const P=[]; const p=s=>{P.push(s);return`\x01${P.length-1}\x01`;};
  // Template literals (backtick)
  h=h.replace(/`[\s\S]*?`/g,m=>p(sp('str',m)));
  // Multi-line comments
  h=h.replace(/\/\*[\s\S]*?\*\//g,m=>p(sp('cmt',m)));
  // Single-line comments
  h=h.replace(/\/\/.*/g,m=>p(sp('cmt',m)));
  // Strings
  h=h.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,m=>p(sp('str',m)));
  // Keywords
  h=h.replace(/\b(const|let|var|function|class|if|else|for|while|do|switch|case|break|continue|return|import|export|default|from|as|new|this|super|extends|typeof|instanceof|in|of|async|await|try|catch|finally|throw|delete|void|null|undefined|true|false|static|get|set|yield|interface|type|enum|implements|abstract|declare|readonly|namespace|module)\b/g,
    m=>sp('kw',m));
  // Built-in types/globals
  h=h.replace(/\b(string|number|boolean|object|any|void|never|unknown|Array|Promise|Map|Set|Object|Function|Date|RegExp|Error|Symbol|BigInt|console|window|document|Math|JSON|parseInt|parseFloat|isNaN|isFinite|NaN|Infinity|fetch|setTimeout|setInterval|clearTimeout|clearInterval|localStorage|sessionStorage)\b/g,
    m=>sp('type',m));
  // Numbers
  h=h.replace(/\b(0x[\da-fA-F]+|0b[01]+|0o[0-7]+|\d+\.?\d*(?:[eE][+-]?\d+)?n?)\b/g,
    m=>sp('num',m));
  // Decorators
  h=h.replace(/@[\w.]+/g,m=>sp('fn',m));
  // Function names (before parens)
  h=h.replace(/\b([A-Za-z_$][\w$]*)(?=\s*\()/g,m=>sp('fn',m));
  // Property access (after dot, not before paren — avoid double-span)
  h=h.replace(/(?<=\.)([A-Za-z_$][\w$]*)(?!\s*\()/g,m=>sp('prop',m));
  return h.replace(/\x01(\d+)\x01/g,(_,i)=>P[+i]);
}

/* ---- CSS HIGHLIGHTER ---- */
function hlCSS(h){
  const P=[]; const p=s=>{P.push(s);return`\x01${P.length-1}\x01`;};
  h=h.replace(/\/\*[\s\S]*?\*\//g,m=>p(sp('cmt',m)));
  h=h.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,m=>p(sp('str',m)));
  h=h.replace(/@[\w-]+/g,m=>sp('kw',m));
  h=h.replace(/([^{};,\n]+)(?=\s*\{)/g,m=>{ if(m.trim().startsWith('//'))return m; return sp('sel',m); });
  h=h.replace(/\b([\w-]+)\s*(?=:)/g,m=>sp('prop',m));
  h=h.replace(/:\s*([^;{}\n]+)/g,(_,v)=>': '+sp('str',v));
  h=h.replace(/\b(\d+(?:\.\d+)?)(px|em|rem|vh|vw|%|s|ms|deg|fr|ch|ex|dvh|svh|cqw)?\b/g,
    (_,n,u)=>sp('num',n)+(u?sp('type',u):''));
  return h.replace(/\x01(\d+)\x01/g,(_,i)=>P[+i]);
}

/* ---- PYTHON HIGHLIGHTER ---- */
function hlPY(h){
  const P=[]; const p=s=>{P.push(s);return`\x01${P.length-1}\x01`;};
  h=h.replace(/("""[\s\S]*?"""|'''[\s\S]*?''')/g,m=>p(sp('str',m)));
  h=h.replace(/#.*/g,m=>p(sp('cmt',m)));
  h=h.replace(/(?:r|b|f)?("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/gi,m=>p(sp('str',m)));
  h=h.replace(/\b(def|class|if|elif|else|for|while|with|return|import|from|as|try|except|finally|raise|pass|break|continue|global|nonlocal|lambda|yield|del|assert|and|or|not|in|is|async|await|None|True|False)\b/g,
    m=>sp('kw',m));
  h=h.replace(/\b(print|len|range|list|dict|set|tuple|int|float|str|bool|type|isinstance|issubclass|hasattr|getattr|setattr|input|open|super|property|staticmethod|classmethod|enumerate|zip|map|filter|sorted|reversed|sum|min|max|abs|round|format)\b/g,
    m=>sp('type',m));
  h=h.replace(/@[\w.]+/g,m=>sp('fn',m));
  h=h.replace(/\b(\d+\.?\d*(?:[eE][+-]?\d+)?|0x[\da-fA-F]+|0b[01]+|0o[0-7]+)\b/g,
    m=>sp('num',m));
  h=h.replace(/\b(def)\s+([A-Za-z_]\w*)/g,(_,k,n)=>sp('kw',k)+' '+sp('fn',n));
  h=h.replace(/\b(class)\s+([A-Za-z_]\w*)/g,(_,k,n)=>sp('kw',k)+' '+sp('type',n));
  h=h.replace(/\b([A-Za-z_]\w*)(?=\s*\()/g,m=>sp('fn',m));
  return h.replace(/\x01(\d+)\x01/g,(_,i)=>P[+i]);
}

/* ---- JSON HIGHLIGHTER ---- */
function hlJSON(h){
  const P=[]; const p=s=>{P.push(s);return`\x01${P.length-1}\x01`;};
  h=h.replace(/("(?:[^"\\]|\\.)*")\s*(?=:)/g,m=>p(sp('prop',m)));
  h=h.replace(/("(?:[^"\\]|\\.)*")/g,m=>p(sp('str',m)));
  h=h.replace(/\b(-?\d+\.?\d*(?:[eE][+-]?\d+)?)\b/g,m=>p(sp('num',m)));
  h=h.replace(/\b(true|false|null)\b/g,m=>p(sp('kw',m)));
  return h.replace(/\x01(\d+)\x01/g,(_,i)=>P[+i]);
}

/* ---- DISPATCH ---- */
function highlight(code,lang){
  if(!code)return '';
  try {
    switch(lang){
      case 'javascript':case 'typescript': return hlJS(esc(code));
      case 'html':case 'htm': return hlHTML(code); // raw input!
      case 'css':case 'scss': return hlCSS(esc(code));
      case 'python': return hlPY(esc(code));
      case 'json': return hlJSON(esc(code));
      default: return esc(code);
    }
  } catch(e){ return esc(code); }
}

/* ---- GHOST TEXT ---- */
function buildHighlight(content,language,aiSuggestion,cursorPos){
  if(!aiSuggestion) return highlight(content,language);
  const before=content.substring(0,cursorPos);
  const after=content.substring(cursorPos);
  const lines=before.split('\n');
  const curLine=lines.length-1;
  const curCol=lines[curLine].length;
  const allLines=content.split('\n');
  if(curCol<allLines[curLine].length) return highlight(content,language);
  const ghostFirstLine=aiSuggestion.split('\n')[0];
  const ghostRest=aiSuggestion.split('\n').slice(1,3).join('\n'); // up to 3 ghost lines
  const hlBefore=highlight(before,language);
  const hlAfter=highlight(after,language);
  let ghost=`<span class="ghost-text">${esc(ghostFirstLine)}</span>`;
  if(ghostRest) ghost+=`<span class="ghost-text">${esc('\n'+ghostRest)}</span>`;
  return hlBefore+ghost+hlAfter;
}

/* ================================================================
   FILE LANGUAGE / ICONS
================================================================ */
function getLang(name){
  const e=(name.split('.').pop()||'').toLowerCase();
  const m={js:'javascript',jsx:'javascript',ts:'typescript',tsx:'typescript',
    html:'html',htm:'html',css:'css',scss:'css',less:'css',
    py:'python',json:'json',md:'markdown',
    java:'java',cpp:'cpp',c:'c',rs:'rust',go:'go',rb:'ruby',php:'php',
    sh:'shell',bash:'shell',yml:'yaml',yaml:'yaml',sql:'sql',
    svg:'image',png:'image',jpg:'image',jpeg:'image',gif:'image',webp:'image'};
  return m[e]||'plaintext';
}

function getIcon(name,isFolder=false,open=false){
  if(isFolder){
    return open
      ?`<svg width="15" height="15" viewBox="0 0 24 24" fill="#e8a87c"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M2 10h20" stroke="#000" stroke-width="2"/></svg>`
      :`<svg width="15" height="15" viewBox="0 0 24 24" fill="#e8a87c"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
  }
  const e=(name.split('.').pop()||'').toLowerCase();
  const colors={js:'#f1e05a',jsx:'#61dafb',ts:'#3178c6',tsx:'#61dafb',
    html:'#e44d26',css:'#264de4',scss:'#c6538c',
    py:'#3572A5',json:'#292929',md:'#083fa1',
    png:'#89d185',jpg:'#89d185',jpeg:'#89d185',gif:'#89d185',webp:'#89d185',svg:'#89d185'};
  const c=colors[e]||'var(--muted)';
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="${c}"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6m4 18H6V4h7v5h5v11z"/></svg>`;
}

function isImageFile(name){ return /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(name); }

/* ================================================================
   FILE OPERATIONS
================================================================ */
function openFile(path){
  if(!state.files[path])return;
  if(!state.openTabs.find(t=>t.path===path))
    state.openTabs.push({path,name:state.files[path].name});
  state.activeTab=path; state.aiSuggestion='';
  saveState(); render();
  setTimeout(()=>{ restoreScroll(path); setupEditorListeners(); },50);
}

function closeTab(path){
  const idx=state.openTabs.findIndex(t=>t.path===path);
  if(idx<0)return;
  state.openTabs.splice(idx,1);
  if(state.activeTab===path)
    state.activeTab=state.openTabs[idx]?.path||state.openTabs[idx-1]?.path||null;
  saveState(); render(); setTimeout(setupEditorListeners,50);
}

function deleteFilePath(path){
  if(!confirm(`Delete "${path}"?`))return;
  delete state.files[path]; delete (state.diagnostics||{})[path];
  closeTab(path); rebuildTree(); saveState(); render();
}

function startCreate(type,parent=''){
  state.creatingIn={type,parent}; state.newItemName='';
  render(); setTimeout(()=>document.getElementById('new-item-inp')?.focus(),50);
}
function confirmCreate(){
  const name=state.newItemName.trim();
  if(!name){cancelCreate();return;}
  const{type,parent}=state.creatingIn;
  const fullPath=parent?`${parent}/${name}`:name;
  if(type==='file'){
    state.files[fullPath]={name,content:'',language:getLang(name),path:fullPath};
    rebuildTree(); openFile(fullPath);
  } else {
    state.files[`${fullPath}/.keep`]={name:'.keep',content:'',language:'plaintext',path:`${fullPath}/.keep`};
    rebuildTree();
    if(!state.expandedFolders.includes(fullPath)) state.expandedFolders.push(fullPath);
  }
  cancelCreate(); saveState();
}
function cancelCreate(){ state.creatingIn=null; state.newItemName=''; render(); }

function startRename(path){
  state.renamingPath=path;
  state.newItemName=state.files[path]?.name||path.split('/').pop();
  hideCtx(); render();
  setTimeout(()=>{ const el=document.getElementById('rename-inp'); if(el){el.focus();el.select();} },50);
}
function confirmRename(){
  const newName=state.newItemName.trim();
  if(!newName||!state.renamingPath){cancelRename();return;}
  const oldPath=state.renamingPath;
  const parts=oldPath.split('/'); parts[parts.length-1]=newName;
  const newPath=parts.join('/');
  if(newPath!==oldPath){
    state.files[newPath]={...state.files[oldPath],name:newName,path:newPath,language:getLang(newName)};
    delete state.files[oldPath];
    const ti=state.openTabs.findIndex(t=>t.path===oldPath);
    if(ti>=0) state.openTabs[ti]={path:newPath,name:newName};
    if(state.activeTab===oldPath) state.activeTab=newPath;
    rebuildTree(); saveState();
  }
  cancelRename();
}
function cancelRename(){ state.renamingPath=null; state.newItemName=''; render(); }

function rebuildTree(){
  const tree=[];
  Object.values(state.files).forEach(f=>{
    const parts=f.path.split('/'); let cur=tree; let cp='';
    parts.forEach((part,i)=>{
      cp=cp?`${cp}/${part}`:part;
      if(i===parts.length-1){
        cur.push({name:part,path:f.path,type:'file',language:f.language});
      } else {
        let folder=cur.find(x=>x.name===part&&x.type==='folder');
        if(!folder){folder={name:part,path:cp,type:'folder',children:[]};cur.push(folder);}
        cur=folder.children;
      }
    });
  });
  function sortTree(arr){
    arr.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==='folder'?-1:1);
    arr.forEach(x=>x.children&&sortTree(x.children));
    return arr;
  }
  state.fileTree=sortTree(tree);
}

async function uploadFolder(){
  try {
    if('showDirectoryPicker' in window){
      const dir=await window.showDirectoryPicker();
      await readDir(dir,''); rebuildTree(); saveState(); render();
    } else {
      const inp=document.createElement('input');
      inp.type='file'; inp.multiple=true; inp.webkitdirectory=true;
      inp.onchange=async e=>{
        for(const f of e.target.files){
          const content=await f.text();
          const path=f.webkitRelativePath||f.name;
          state.files[path]={name:f.name,content,language:getLang(f.name),path};
        }
        rebuildTree(); saveState(); render();
      };
      inp.click();
    }
  } catch(e){ if(e.name!=='AbortError') console.error(e); }
}

async function readDir(handle,prefix){
  for await(const entry of handle.values()){
    const path=prefix?`${prefix}/${entry.name}`:entry.name;
    if(entry.kind==='file'){
      const f=await entry.getFile();
      const content=isImageFile(entry.name)?await readAsDataURL(f):await f.text();
      state.files[path]={name:entry.name,content,language:getLang(entry.name),path};
    } else { await readDir(entry,path); }
  }
}

async function uploadFiles(){
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=async e=>{
    for(const f of e.target.files){
      const content=isImageFile(f.name)?await readAsDataURL(f):await f.text();
      state.files[f.name]={name:f.name,content,language:getLang(f.name),path:f.name};
    }
    rebuildTree(); saveState(); render();
  };
  inp.click();
}

function readAsDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file); });
}

async function saveFileToDisk(path){
  const file=state.files[path]; if(!file)return;
  try {
    const handle=await window.showSaveFilePicker({suggestedName:file.name});
    const w=await handle.createWritable();
    await w.write(file.content); await w.close();
    if(state.modified) state.modified[path]=false;
    addTermLine(`Saved: ${file.name}`); render();
  } catch(e){ if(e.name!=='AbortError') addTermLine(`Error saving: ${e.message}`); }
}

function handleFileUpload(){ uploadFiles(); }

/* ================================================================
   AI INLINE COMPLETIONS (smarter with workspace context)
================================================================ */
let aiTimer=null, aiController=null;
const AI_ENDPOINT='https://super-paper-1cd0.ahmedelgoharymessi.workers.dev/';

function getWorkspaceContext(){
  // Pass brief context of other files so AI understands the project
  const entries=Object.entries(state.files)
    .filter(([p,f])=>!isImageFile(f.name)&&p!==state.activeTab&&f.content.trim())
    .map(([p,f])=>`// === ${p} ===\n${f.content.slice(0,300)}`)
    .join('\n\n').slice(0,1200);
  return entries;
}

function scheduleAI(content,lang,cursorPos){
  clearTimeout(aiTimer);
  if(aiController)aiController.abort();
  state.aiSuggestion='';
  // Adaptive delay based on file size
  const lineCount=content.split('\n').length;
  const delay=lineCount<100?600:lineCount<500?900:1200;
  aiTimer=setTimeout(()=>fetchAI(content,lang,cursorPos),delay);
}

async function fetchAI(content,lang,cursorPos){
  if(!content.trim())return;
  aiController=new AbortController();
  state.aiLoading=true; updateStatusBar();

  const textBefore=content.substring(Math.max(0,cursorPos-800),cursorPos);
  const workspaceCtx=getWorkspaceContext();

  const systemPrompt=`You are an expert ${lang} code completion AI assistant (like GitHub Copilot). Your ONLY job is to complete the code at the cursor. Rules:
- Output ONLY the raw completion text — no explanation, no markdown, no code fences
- Complete just the current expression/statement (1-2 lines max)
- Be syntactically correct for ${lang}
- Consider the workspace context provided
${workspaceCtx?`\nWorkspace context:\n${workspaceCtx}\n`:''}`;

  try {
    const res=await fetch(AI_ENDPOINT,{
      method:'POST',headers:{'Content-Type':'application/json'},signal:aiController.signal,
      body:JSON.stringify({
        contents:[{parts:[{
          text:`${systemPrompt}\n\nComplete this ${lang} code at the cursor position (marked with [CURSOR]):\n\n${textBefore}[CURSOR]`
        }]}]
      })
    });
    const data=await res.json();
    let s=data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||'';
    // Strip markdown fences and [CURSOR] artifacts
    s=s.replace(/```[\w]*\n?/g,'').replace(/```/g,'').replace(/\[CURSOR\]/g,'').trim();
    // Limit to 3 lines
    const lines=s.split('\n');
    s=lines.slice(0,3).join('\n');
    state.aiSuggestion=s;
    state.aiCursorPos=cursorPos;
  } catch(e){ /* aborted */ }
  state.aiLoading=false; updateStatusBar(); updateHighlight();
}

function acceptAI(){
  if(!state.aiSuggestion||!state.activeTab)return;
  const ta=document.getElementById('main-textarea'); if(!ta)return;
  const pos=ta.selectionStart;
  const suggestion=state.aiSuggestion;
  const content=state.files[state.activeTab].content;
  const newContent=content.substring(0,pos)+suggestion+content.substring(pos);
  state.files[state.activeTab].content=newContent;
  ta.value=newContent;
  state.aiSuggestion='';
  const newPos=pos+suggestion.length;
  updateHighlight();
  setTimeout(()=>ta.setSelectionRange(newPos,newPos),10);
  scheduleAutoSave();
}

/* ================================================================
   ERROR DETECTION — AI code analysis
================================================================ */
let diagTimer=null;

function scheduleDiagnostics(content,lang,path){
  clearTimeout(diagTimer);
  // Only run for supported languages, debounced 3s
  if(!['javascript','typescript','html','css','python'].includes(lang))return;
  diagTimer=setTimeout(()=>fetchDiagnostics(content,lang,path),3000);
}

async function fetchDiagnostics(content,lang,path){
  if(!content.trim()||content.length>50000)return; // skip huge files
  try {
    const res=await fetch(AI_ENDPOINT,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[{
          text:`Analyze this ${lang} code for errors, bugs, and issues. 
Return ONLY a JSON array (no markdown, no explanation) with objects like:
[{"line":1,"severity":"error","msg":"description"},{"line":5,"severity":"warning","msg":"description"}]
severity can be: "error", "warning", "info"
Only include real issues, max 8. If no issues return [].
Return ONLY the JSON array, nothing else.

Code:
${content.slice(0,4000)}`
        }]}]
      })
    });
    const data=await res.json();
    let txt=data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||'[]';
    txt=txt.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    let diags=[];
    try { diags=JSON.parse(txt); if(!Array.isArray(diags))diags=[]; } catch(e){ diags=[]; }
    if(!state.diagnostics)state.diagnostics={};
    state.diagnostics[path]=diags.filter(d=>d.line&&d.msg).slice(0,8);
    renderGutterMarkers();
    updateStatusBar();
    saveState();
  } catch(e){}
}

function renderGutterMarkers(){
  const gutter=document.getElementById('gutter-wrap');
  if(!gutter||!state.activeTab)return;
  // Remove old markers
  gutter.querySelectorAll('.err-marker').forEach(el=>el.remove());
  const diags=(state.diagnostics||{})[state.activeTab]||[];
  if(!diags.length)return;
  const lineH=Math.round(21*state.editorZoom);
  const sc=document.getElementById('editor-scroll-main');
  const scrollTop=sc?sc.scrollTop:0;
  diags.forEach(d=>{
    const marker=document.createElement('div');
    marker.className=`err-marker ${d.severity||'error'}`;
    marker.style.top=`${16+(d.line-1)*lineH-scrollTop}px`;
    marker.title=d.msg;
    marker.onmouseenter=e=>showErrTooltip(e,d);
    marker.onmouseleave=()=>hideErrTooltip();
    marker.onclick=()=>jumpToLine(d.line);
    gutter.appendChild(marker);
  });
}

function showErrTooltip(e,d){
  let tt=document.getElementById('err-tt');
  if(!tt){tt=document.createElement('div');tt.id='err-tt';tt.className='err-tooltip';document.body.appendChild(tt);}
  tt.style.cssText=`display:block;left:${e.clientX+16}px;top:${e.clientY-8}px;border-color:var(--${d.severity==='error'?'err':d.severity==='warning'?'warn':'info'});`;
  tt.textContent=`${d.severity?.toUpperCase()||'ERROR'} (line ${d.line}): ${d.msg}`;
}
function hideErrTooltip(){
  const tt=document.getElementById('err-tt'); if(tt)tt.style.display='none';
}

function jumpToLine(line){
  const ta=document.getElementById('main-textarea'); if(!ta)return;
  const content=state.files[state.activeTab]?.content||'';
  const lines=content.split('\n');
  let pos=0; for(let i=0;i<line-1&&i<lines.length;i++)pos+=lines[i].length+1;
  ta.focus(); ta.setSelectionRange(pos,pos+lines[line-1]?.length||0);
  const sc=document.getElementById('editor-scroll-main');
  if(sc) sc.scrollTop=Math.max(0,(line-5)*Math.round(21*state.editorZoom));
}

function showQuickFix(lineNum){
  const diags=(state.diagnostics||{})[state.activeTab]||[];
  const d=diags.find(x=>x.line===lineNum)||diags.find(x=>Math.abs(x.line-lineNum)<=2);
  if(!d)return;
  const ta=document.getElementById('main-textarea'); if(!ta)return;
  const lineH=Math.round(21*state.editorZoom);
  const sc=document.getElementById('editor-scroll-main');
  const y=16+(d.line-1)*lineH-(sc?.scrollTop||0)+lineH+52;
  const x=60;
  state.quickFixPanel={x,y,lineNum:d.line,diag:d,fixes:[],loading:true};
  render();
  // Fetch fix suggestions
  fetchQuickFixes(d);
}

async function fetchQuickFixes(d){
  const file=state.files[state.activeTab]; if(!file)return;
  const lines=file.content.split('\n');
  const context=lines.slice(Math.max(0,d.line-4),d.line+3).join('\n');
  try {
    const res=await fetch(AI_ENDPOINT,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[{
          text:`Fix this ${file.language} error. Return ONLY JSON array of fixes, no explanation:
[{"label":"Fix description","code":"corrected line content"},...]
Max 3 fixes. Return ONLY the JSON array.

Error at line ${d.line}: ${d.msg}
Code context:
${context}`
        }]}]
      })
    });
    const data=await res.json();
    let txt=data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||'[]';
    txt=txt.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    let fixes=[]; try{fixes=JSON.parse(txt);if(!Array.isArray(fixes))fixes=[];}catch(e){fixes=[];}
    if(state.quickFixPanel){
      state.quickFixPanel.fixes=fixes.slice(0,3);
      state.quickFixPanel.loading=false;
      render();
    }
  } catch(e){ if(state.quickFixPanel){state.quickFixPanel.loading=false;render();} }
}

function applyQuickFix(fixCode,lineNum){
  const file=state.files[state.activeTab]; if(!file)return;
  const lines=file.content.split('\n');
  const indent=lines[lineNum-1]?.match(/^\s*/)?.[0]||'';
  lines[lineNum-1]=indent+fixCode.trimStart();
  const newContent=lines.join('\n');
  state.files[state.activeTab].content=newContent;
  const ta=document.getElementById('main-textarea');
  if(ta) ta.value=newContent;
  state.quickFixPanel=null;
  // Clear this diagnostic
  if(state.diagnostics?.[state.activeTab]){
    state.diagnostics[state.activeTab]=state.diagnostics[state.activeTab].filter(d=>d.line!==lineNum);
  }
  updateHighlight(); updateStatusBar(); scheduleAutoSave(); render();
}

function closeQuickFix(){ state.quickFixPanel=null; render(); }

function performSearch(q){
  state.searchQuery=q;
  if(!q){state.searchResults=[];render();return;}
  const results=[];
  Object.entries(state.files).forEach(([path,f])=>{
    if(isImageFile(f.name))return;
    const lines=f.content.split('\n');
    lines.forEach((line,i)=>{
      let idx=0; const lq=q.toLowerCase(); const ll=line.toLowerCase();
      while((idx=ll.indexOf(lq,idx))!==-1){
        results.push({path,lineNum:i,col:idx,line:line.trim()});
        idx+=q.length; break;
      }
    });
  });
  state.searchResults=results; state.searchIdx=0; render();
}

function jumpToResult(idx){
  if(idx<0||idx>=state.searchResults.length)return;
  state.searchIdx=idx;
  const r=state.searchResults[idx];
  openFile(r.path);
  setTimeout(()=>{
    const ta=document.getElementById('main-textarea'); if(!ta)return;
    const content=state.files[r.path]?.content||'';
    const lines=content.split('\n');
    let charIdx=0; for(let i=0;i<r.lineNum;i++) charIdx+=lines[i].length+1;
    charIdx+=r.col;
    ta.focus(); ta.setSelectionRange(charIdx,charIdx+state.searchQuery.length);
    const sc=document.getElementById('editor-scroll-main');
    if(sc) sc.scrollTop=Math.max(0,r.lineNum*Math.round(21*state.editorZoom)-100);
    updateHighlight();
  },100);
}

/* ================================================================
   DRAWING MODE
================================================================ */
let drawCanvas=null,drawCtx=null,isDrawing=false;

function initDraw(){
  if(drawCanvas){drawCanvas.remove();drawCanvas=null;drawCtx=null;}
  if(!state.drawMode)return;
  drawCanvas=document.createElement('canvas');
  drawCanvas.className='draw-canvas';
  drawCanvas.width=window.innerWidth; drawCanvas.height=window.innerHeight;
  drawCtx=drawCanvas.getContext('2d'); document.body.appendChild(drawCanvas);
  replayDraw();
  drawCanvas.addEventListener('mousedown',onDrawStart);
  drawCanvas.addEventListener('mousemove',onDrawMove);
  drawCanvas.addEventListener('mouseup',onDrawEnd);
  drawCanvas.addEventListener('mouseleave',onDrawEnd);
  drawCanvas.addEventListener('touchstart',e=>{e.preventDefault();onDrawStart(e.touches[0]);},{passive:false});
  drawCanvas.addEventListener('touchmove',e=>{e.preventDefault();onDrawMove(e.touches[0]);},{passive:false});
  drawCanvas.addEventListener('touchend',onDrawEnd);
}

function replayDraw(){
  if(!drawCtx||!state.drawings)return;
  drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  state.drawings.forEach(d=>{
    if(!d.points||d.points.length<2)return;
    drawCtx.save();
    if(d.tool==='eraser') drawCtx.globalCompositeOperation='destination-out';
    else if(d.tool==='highlighter'){drawCtx.globalAlpha=0.4;drawCtx.globalCompositeOperation='source-over';}
    else{drawCtx.globalAlpha=1;drawCtx.globalCompositeOperation='source-over';}
    drawCtx.strokeStyle=d.color; drawCtx.lineWidth=d.size; drawCtx.lineCap='round'; drawCtx.lineJoin='round';
    drawCtx.beginPath(); drawCtx.moveTo(d.points[0].x,d.points[0].y);
    d.points.forEach(pt=>drawCtx.lineTo(pt.x,pt.y)); drawCtx.stroke(); drawCtx.restore();
  });
}

function onDrawStart(e){
  const toolbar=document.querySelector('.draw-toolbar');
  if(toolbar&&toolbar.contains(e.target))return;
  isDrawing=true; const r=drawCanvas.getBoundingClientRect();
  state.drawings.push({tool:state.drawTool,color:state.drawColor,size:state.drawTool==='highlighter'?state.drawSize*4:state.drawSize,points:[{x:e.clientX-r.left,y:e.clientY-r.top}]});
}
function onDrawMove(e){
  if(!isDrawing||!state.drawings.length)return;
  const r=drawCanvas.getBoundingClientRect();
  const cur=state.drawings[state.drawings.length-1];
  const pt={x:e.clientX-r.left,y:e.clientY-r.top}; cur.points.push(pt);
  if(!drawCtx)return;
  const prev=cur.points[cur.points.length-2]; drawCtx.save();
  if(cur.tool==='eraser'){drawCtx.globalCompositeOperation='destination-out';drawCtx.globalAlpha=1;}
  else if(cur.tool==='highlighter'){drawCtx.globalAlpha=0.4;drawCtx.globalCompositeOperation='source-over';}
  else{drawCtx.globalAlpha=1;drawCtx.globalCompositeOperation='source-over';}
  drawCtx.strokeStyle=cur.color; drawCtx.lineWidth=cur.size; drawCtx.lineCap='round'; drawCtx.lineJoin='round';
  drawCtx.beginPath(); drawCtx.moveTo(prev.x,prev.y); drawCtx.lineTo(pt.x,pt.y); drawCtx.stroke(); drawCtx.restore();
}
function onDrawEnd(){isDrawing=false;}

================================================================ */
function addTermLine(text,isCmd=false){
  if(!state.terminalHistory) state.terminalHistory=[];
  state.terminalHistory.push({text,cmd:isCmd,time:new Date().toLocaleTimeString()});
  const out=document.getElementById('term-out');
  if(out){ out.innerHTML+=`<div style="color:${isCmd?'var(--accent)':'var(--text)'}">${esc(text)}</div>`; out.scrollTop=out.scrollHeight; }
}

function runCommand(cmd){
  addTermLine(`$ ${cmd}`,true);
  const parts=cmd.trim().split(/\s+/); const c=parts[0]; const args=parts.slice(1);
  switch(c){
    case 'clear': state.terminalHistory=[]; const out=document.getElementById('term-out'); if(out)out.innerHTML=''; break;
    case 'ls': addTermLine(Object.keys(state.files).join('  ')||'(empty)'); break;
    case 'help': addTermLine('Commands: clear  ls  stats  save  echo  theme [color]  diag'); break;
    case 'stats':{
      const n=Object.keys(state.files).length;
      const l=Object.values(state.files).reduce((a,f)=>a+f.content.split('\n').length,0);
      addTermLine(`${n} files  •  ${l} total lines`); break;
    }
    case 'save': saveState(); addTermLine('Workspace saved'); break;
    case 'echo': addTermLine(args.join(' ')); break;
    case 'theme': if(args[0]){state.theme.accent=args[0];applyTheme();saveState();addTermLine(`Accent: ${args[0]}`);} else addTermLine(`Accent: ${state.theme.accent}`); break;
    case 'diag':{
      if(state.activeTab){
        const d=(state.diagnostics||{})[state.activeTab]||[];
        addTermLine(d.length?d.map(x=>`L${x.line} [${x.severity}] ${x.msg}`).join('\n'):'No diagnostics for current file.');
      } else addTermLine('No file open.'); break;
    }
    default: addTermLine(`Command not found: ${c}`);
  }
  state.terminalInput='';
}

function applyTheme(){
  document.documentElement.style.setProperty('--accent',state.theme.accent);
  document.documentElement.style.setProperty('--accent-dim',hexToRgba(state.theme.accent,0.12));
  document.documentElement.style.setProperty('--accent-glow',hexToRgba(state.theme.accent,0.3));
  document.documentElement.style.setProperty('--sel',hexToRgba(state.theme.accent,0.18));
  if(state.theme.status){
    document.documentElement.style.setProperty('--status-bg',state.theme.status);
  }
}
function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16)||57;const g=parseInt(hex.slice(3,5),16)||255;const b=parseInt(hex.slice(5,7),16)||20;
  return `rgba(${r},${g},${b},${a})`;
}
applyTheme();

/* ================================================================
   HIGHLIGHT UPDATES (performance-optimized)
================================================================ */
let hlRafId=null, lastHighlightedContent=null, lastHighlightedLang=null;

function highlightWithSearch(content,lang,q,activeIdx,results,activePath){
  let h=highlight(content,lang); if(!q||!results.length)return h;
  const activeResult=results[activeIdx];
  const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`(${escaped})`,'gi');
  let matchCount=0;
  h=h.replace(re,(_,m)=>{
    const isActive=(activeResult&&activeResult.path===activePath&&matchCount===0);
    matchCount++;
    return `<span class="${isActive?'hl-match-active':'hl-match'}">${m}</span>`;
  });
  return h;
}

function updateHighlight(){
  if(!state.activeTab)return;
  const file=state.files[state.activeTab];
  if(!file||isImageFile(file.name))return;
  const hl=document.getElementById('hl-main');
  const ta=document.getElementById('main-textarea');
  const gutter=document.getElementById('gutter-main');
  if(!hl||!ta||!gutter)return;

  const content=file.content;
  const lang=file.language;
  const cursorPos=ta.selectionStart;

  // Skip re-highlighting if content hasn't changed (only cursor moved)
  const contentChanged = content!==lastHighlightedContent || lang!==lastHighlightedLang;

  if(contentChanged||state.aiSuggestion){
    let highlighted;
    if(state.searchQuery&&state.activePanel==='search'){
      highlighted=highlightWithSearch(content,lang,state.searchQuery,state.searchIdx,state.searchResults,state.activeTab);
    } else {
      highlighted=buildHighlight(content,lang,state.aiSuggestion,cursorPos);
    }
    hl.innerHTML=highlighted;
    lastHighlightedContent=content;
    lastHighlightedLang=lang;
  }

  // Update line numbers
  const lineCount=content.split('\n').length;
  const gutterContent=Array.from({length:lineCount},(_,i)=>i+1).join('\n');
  gutter.innerHTML=gutterContent;

  // Resize inner and textarea to match highlight layer
  const sc=document.getElementById('editor-scroll-main');
  const inner=document.getElementById('editor-inner-main');
  requestAnimationFrame(()=>{
    const h_px=Math.max(hl.scrollHeight,300);
    const w_px=Math.max(hl.scrollWidth,100);
    if(inner){ inner.style.height=h_px+'px'; inner.style.width=w_px+'px'; }
    if(ta){ ta.style.height=h_px+'px'; ta.style.width=w_px+'px'; }
    // Sync gutter scroll
    if(sc) gutter.scrollTop=sc.scrollTop;
  });
  renderGutterMarkers();
}

function scheduleHighlight(content,lang,cursorPos){
  if(hlRafId) cancelAnimationFrame(hlRafId);
  const lineCount=content.split('\n').length;
  if(lineCount>1500){
    // Large file — debounce more aggressively
    clearTimeout(window._hlTimer);
    window._hlTimer=setTimeout(updateHighlight, lineCount>3000?500:250);
  } else {
    hlRafId=requestAnimationFrame(()=>{ hlRafId=null; updateHighlight(); });
  }
}

function updateStatusBar(){
  const bar=document.getElementById('status-bar'); if(!bar)return;
  const file=state.activeTab?state.files[state.activeTab]:null;
  const lang=file?file.language:'plaintext';
  const ta=document.getElementById('main-textarea');
  let line=1,col=1;
  if(ta){ const txt=ta.value.substring(0,ta.selectionStart); const lines=txt.split('\n'); line=lines.length; col=lines[lines.length-1].length+1; }
  const diags=(state.diagnostics||{})[state.activeTab||'']||[];
  const errCount=diags.filter(d=>d.severity==='error').length;
  const warnCount=diags.filter(d=>d.severity==='warning').length;
  const lineCount=file?file.content.split('\n').length:0;
  bar.innerHTML=`
    <span class="status-item" onclick="handleFileUpload()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      ${file?esc(file.path):'No file'}
    </span>
    <span class="status-item status-ai" title="AI: ${state.aiLoading?'Thinking...':'Ready — Tab to accept'}">
      ${state.aiLoading?`<span class="ai-dot"></span>`:'⚡'} AI${state.aiLoading?' ...':''}
    </span>
    ${errCount>0?`<span class="status-item status-errors" title="${errCount} error(s)" onclick="togglePanel('ai')">⊘ ${errCount} error${errCount>1?'s':''}</span>`:''}
    ${warnCount>0?`<span class="status-item" style="color:#cca700" title="${warnCount} warning(s)">⚠ ${warnCount}</span>`:''}
    ${lineCount>1500?`<span class="large-file-badge">LARGE FILE</span>`:''}
    <span class="status-right">

/* ================================================================
   EDITOR LISTENERS
================================================================ */
function setupEditorListeners(){
  const ta=document.getElementById('main-textarea');
  const sc=document.getElementById('editor-scroll-main');
  const gutter=document.getElementById('gutter-main');
  if(!ta||!sc)return;

  ta.addEventListener('input',()=>{
    if(!state.activeTab)return;
    const content=ta.value;
    const file=state.files[state.activeTab];
    if(!file)return;
    file.content=content;
    if(!state.modified)state.modified={};
    state.modified[state.activeTab]=true;
    state.aiSuggestion='';
    scheduleHighlight(content,file.language,ta.selectionStart);
    updateStatusBar();
    scheduleAutoSave();
    updatePreview();
    scheduleAI(content,file.language,ta.selectionStart);
    scheduleDiagnostics(content,file.language,state.activeTab);
  },{passive:true});

  ta.addEventListener('keydown',(e)=>{
    if(e.key==='Tab'){
      e.preventDefault();
      if(state.aiSuggestion){ acceptAI(); return; }
      const start=ta.selectionStart,end=ta.selectionEnd;
      ta.value=ta.value.substring(0,start)+'  '+ta.value.substring(end);
      ta.setSelectionRange(start+2,start+2);
      ta.dispatchEvent(new Event('input'));
    }
    if(e.key==='Escape'){
      state.aiSuggestion='';
      if(state.quickFixPanel){state.quickFixPanel=null;render();}
      else updateHighlight();
    }
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){
      e.preventDefault();
      // Trigger diagnostics on save
      const file=state.files[state.activeTab];
      if(file) fetchDiagnostics(file.content,file.language,state.activeTab);
      saveFileToDisk(state.activeTab);
    }
    if((e.ctrlKey||e.metaKey)&&e.key==='='){e.preventDefault();state.editorZoom=Math.min(state.editorZoom+0.1,3);applyZoom();}
    if((e.ctrlKey||e.metaKey)&&e.key==='-'){e.preventDefault();state.editorZoom=Math.max(state.editorZoom-0.1,0.5);applyZoom();}
    // Ctrl+. to show quick fix
    if((e.ctrlKey||e.metaKey)&&e.key==='.'){
      e.preventDefault();
      const txt=ta.value.substring(0,ta.selectionStart);
      const lineNum=txt.split('\n').length;
      showQuickFix(lineNum);
    }
    updateStatusBar();
  });

  ta.addEventListener('click',()=>{ state.aiSuggestion=''; updateHighlight(); updateStatusBar(); });
  ta.addEventListener('keyup',()=>updateStatusBar());

  sc.addEventListener('scroll',()=>{
    if(gutter) gutter.scrollTop=sc.scrollTop;
    renderGutterMarkers();
    if(state.activeTab) saveScroll(state.activeTab);
  },{passive:true});
}

function applyZoom(){
  const sc=document.getElementById('editor-scroll-main');
  const hl=document.getElementById('hl-main');
  const ta=document.getElementById('main-textarea');
  const gutter=document.getElementById('gutter-main');
  const z=state.editorZoom;
  const fs=`${Math.round(14*z)}px`;
  const lh=`${Math.round(21*z)}px`;
  if(hl){hl.style.fontSize=fs;hl.style.lineHeight=lh;}
  if(ta){ta.style.fontSize=fs;ta.style.lineHeight=lh;}
  if(gutter){gutter.style.fontSize=fs;gutter.style.lineHeight=lh;}
  updateStatusBar(); saveState();
}

function toggleTerminal(){state.showTerminal=!state.showTerminal;render();}

/* ================================================================
   SPLIT EDITOR
================================================================ */
function onSplitInput(ta,path){
  state.files[path].content=ta.value;
  const hl=ta.previousElementSibling;
  if(hl) hl.innerHTML=highlight(ta.value,state.files[path].language);
  scheduleAutoSave(); updatePreview();
}
function onSplitKey(e,path){
  if(e.key==='Tab'){
    e.preventDefault();
    const ta=e.target; const s=ta.selectionStart;
    ta.value=ta.value.substring(0,s)+'  '+ta.value.substring(ta.selectionEnd);
    ta.setSelectionRange(s+2,s+2); onSplitInput(ta,path);
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveFileToDisk(path);}
}

/* ================================================================
   SIDEBAR RESIZE
================================================================ */
function initSidebarResize(e){
  const start=e.clientX; const sidebar=document.querySelector('.sidebar'); const startW=sidebar?sidebar.offsetWidth:260;
  const move=ev=>{const w=Math.max(160,Math.min(600,startW+(ev.clientX-start)));if(sidebar)sidebar.style.width=w+'px';};
  const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

/* ================================================================
   DRAW TOOLBAR DRAG
================================================================ */
function setupDrawToolbarDrag(){
  const toolbar=document.getElementById('draw-toolbar'); const handle=document.getElementById('draw-drag');
  if(!toolbar||!handle)return;
  let ox=0,oy=0;
  handle.addEventListener('mousedown',e=>{
    e.preventDefault(); ox=e.clientX-toolbar.offsetLeft; oy=e.clientY-toolbar.offsetTop;
    const move=ev=>{toolbar.style.left=(ev.clientX-ox)+'px';toolbar.style.top=(ev.clientY-oy)+'px';toolbar.style.right='auto';};
    const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}

/* ================================================================
   KEYBOARD SHORTCUTS
================================================================ */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();state.showSidebar=!state.showSidebar;saveState();render();}
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();togglePanel('search');}
  if((e.ctrlKey||e.metaKey)&&e.key==='`'){e.preventDefault();toggleTerminal();}
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();startCreate('file','');}
  if((e.ctrlKey||e.metaKey)&&e.key==='w'){e.preventDefault();if(state.activeTab)closeTab(state.activeTab);}
  if(e.key==='Escape'){if(state.contextMenu)hideCtx();if(state.quickFixPanel){state.quickFixPanel=null;render();}}
});
window.addEventListener('resize',()=>{if(drawCanvas){drawCanvas.width=window.innerWidth;drawCanvas.height=window.innerHeight;replayDraw();}});

/* ================================================================

================================================================ */
function renderTree(items,level=0){
  if(!items||!items.length)return '';
  return items.map(item=>{
    const pl=`${level*14+6}px`;
    const isExpanded=state.expandedFolders&&state.expandedFolders.includes(item.path);
    if(item.type==='folder'){
      const isCreatingHere=state.creatingIn&&state.creatingIn.parent===item.path;
      return `<div class="ftree-item" style="padding-left:${pl}" onclick="toggleFolder('${item.path}')" oncontextmenu="showCtx(event,'${item.path}')">
        <div class="ftree-inner">
          <span class="ftree-chevron ${isExpanded?'open':''}"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7"/></svg></span>
          ${getIcon(item.name,true,isExpanded)}
          ${item.name===state.renamingPath?`<input id="rename-inp" class="inline-inp" value="${esc(state.newItemName)}" oninput="state.newItemName=this.value" onkeydown="if(event.key==='Enter')confirmRename();else if(event.key==='Escape')cancelRename()" onblur="confirmRename()" />`:`<span class="ftree-name">${esc(item.name)}</span>`}
          <span class="ftree-actions" onclick="event.stopPropagation()">
            <button class="ftree-act" title="New File" onclick="startCreate('file','${item.path}')"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6m0 0v5h5"/><line x1="12" y1="13" x2="12" y2="19"/><line x1="9" y1="16" x2="15" y2="16"/></svg></button>
            <button class="ftree-act" title="New Folder" onclick="startCreate('folder','${item.path}')"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></button>
          </span>
        </div>
      </div>
      ${isExpanded?`<div>${isCreatingHere?renderInlineCreate(level+1):''}${renderTree(item.children,level+1)}</div>`:''}`;
    } else {
      const isActive=state.activeTab===item.path;
      const isRenaming=state.renamingPath===item.path;
      const diagCount=((state.diagnostics||{})[item.path]||[]).length;
      return `<div class="ftree-item ${isActive?'active-file':''}" style="padding-left:${pl}" onclick="openFile('${item.path}')" oncontextmenu="showCtx(event,'${item.path}')">
        <div class="ftree-inner">
          <span style="width:16px;flex-shrink:0"></span>
          ${getIcon(item.name)}
          ${isRenaming?`<input id="rename-inp" class="inline-inp" value="${esc(state.newItemName)}" oninput="state.newItemName=this.value" onkeydown="if(event.key==='Enter')confirmRename();else if(event.key==='Escape')cancelRename()" onblur="confirmRename()" />`:`<span class="ftree-name">${esc(item.name)}</span>`}
          ${diagCount?`<span style="color:var(--err);font-size:10px;margin-left:auto;padding-right:4px;" title="${diagCount} issue(s)">●</span>`:''}
          <span class="ftree-actions" onclick="event.stopPropagation()">
            <button class="ftree-act" title="Rename" onclick="startRename('${item.path}')"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="ftree-act" title="Delete" onclick="deleteFilePath('${item.path}')"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
          </span>
        </div>
      </div>`;
    }
  }).join('');
}

function renderInlineCreate(level){
  const pl=`${level*14+6}px`;
  const icon=state.creatingIn?.type==='file'
    ?`<svg width="13" height="13" viewBox="0 0 24 24" fill="var(--prop)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6m0 0v5h5"/></svg>`
    :`<svg width="13" height="13" viewBox="0 0 24 24" fill="#e8a87c"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
  return `<div class="inline-row" style="padding-left:${pl}">
    ${icon}
    <input id="new-item-inp" class="inline-inp" placeholder="${state.creatingIn?.type==='file'?'filename.ext':'folder name'}" value="${esc(state.newItemName)}" oninput="state.newItemName=this.value" onkeydown="if(event.key==='Enter')confirmCreate();else if(event.key==='Escape')cancelCreate()" onblur="cancelCreate()" />
  </div>`;
}

function highlightMatch(text,q){
  if(!q)return text;
  const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
  return text.replace(re,'<span class="s-match">$1</span>');
}

================================================================ */
function togglePanel(panel){
  if(state.activePanel===panel&&state.showSidebar){state.showSidebar=false;}
  else{state.activePanel=panel;state.showSidebar=true;}
  saveState(); render();
  if(panel==='search') setTimeout(()=>document.getElementById('search-inp')?.focus(),50);
}

function toggleFolder(path){
  if(!state.expandedFolders) state.expandedFolders=[];
  const i=state.expandedFolders.indexOf(path);
  if(i>=0) state.expandedFolders.splice(i,1); else state.expandedFolders.push(path);
  saveState(); render(); setTimeout(setupEditorListeners,0);
}

function collapseAll(){ state.expandedFolders=[]; saveState(); render(); }

function switchTab(path){
  if(state.activeTab) saveScroll(state.activeTab);
  state.activeTab=path; state.aiSuggestion=''; lastHighlightedContent=null;
  saveState(); render();
  setTimeout(()=>{restoreScroll(path);setupEditorListeners();},50);
}

function toggleSplit(){
  state.splitView=state.splitView===2?1:2;
  saveState(); render(); setTimeout(setupEditorListeners,50);
}

function toggleDraw(){ state.drawMode=!state.drawMode; render(); setTimeout(()=>initDraw(),50); }

  state.files={};state.openTabs=[];state.activeTab=null;state.fileTree=[];

}
