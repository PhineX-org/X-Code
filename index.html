              <span style="opacity:.7;">Ctrl+. for quick fix at cursor</span>
            </div>
            <button onclick="clearWorkspace()" style="padding:6px;background:transparent;border:1px solid #662222;color:#ff5555;font:11px var(--font);cursor:pointer;">Clear Workspace</button>
            <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:auto;padding-top:12px;">X Code by <span style="color:var(--accent)">PhineX Group</span><br><span style="opacity:.6;">AMG · v3.0</span></div>
          </div>
        `:''}
      </div>
      <div class="resize-handle" onmousedown="initSidebarResize(event)"></div>`:''}

      <!-- EDITOR CONTAINER -->
      <div class="editor-container">

        <!-- TAB BAR -->
        <div class="tab-bar">
          ${state.openTabs.map(t=>{
            const d=(state.diagnostics||{})[t.path]||[];
            const hasErr=d.some(x=>x.severity==='error');
            return `<div class="tab ${state.activeTab===t.path?'active-tab':''}" onclick="switchTab('${t.path}')">
              ${getIcon(t.name)}
              <span class="tab-name" style="${hasErr?'color:var(--err)':''}">${esc(t.name)}</span>
              ${(state.modified&&state.modified[t.path])?`<span class="unsaved-dot modified" title="Unsaved changes"></span>`:''}
              <button class="tab-close" onclick="event.stopPropagation();closeTab('${t.path}')" title="Close"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>`;
          }).join('')}
          ${state.openTabs.length>0?`<div class="tab-toolbar">
            <button class="tb-btn" onclick="toggleSplit()" title="Split view"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v18H3V3m2 2v14h6V5H5m8 0v14h6V5h-6z"/></svg>${state.splitView===2?'1':'2'}</button>
            <button class="tb-btn" onclick="openPreview()" title="Live preview"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Preview</button>
            <button class="tb-btn" onclick="saveFileToDisk('${state.activeTab}')" title="Save (Ctrl+S)"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save</button>
          </div>`:''}
        </div>

        <!-- EDITOR PANELS -->
        <div class="editor-panels">
          ${!file?`<div class="welcome">
            <div class="welcome-logo">X</div>
            <div class="welcome-title">X CODE</div>
            <div class="welcome-sub">Advanced Code Editor — PhineX Group</div>
            <div class="welcome-actions">
              <button class="welcome-btn" onclick="startCreate('file','')"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6m0 0v5h5"/></svg>New File</button>
              <button class="welcome-btn" onclick="uploadFolder()"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Open Folder</button>
              <button class="welcome-btn" onclick="uploadFiles()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload Files</button>
            </div>
            <div class="welcome-keys">
              <span class="k">Ctrl+B</span><span style="font-size:11px;color:var(--muted)">Toggle Sidebar</span>
              <span class="k">Tab</span><span style="font-size:11px;color:var(--muted)">Accept AI suggestion (up to 3 lines)</span>
              <span class="k">Ctrl+.</span><span style="font-size:11px;color:var(--muted)">Quick Fix at cursor</span>
              <span class="k">Ctrl+S</span><span style="font-size:11px;color:var(--muted)">Save + run diagnostics</span>
              <span class="k">Ctrl+=/-</span><span style="font-size:11px;color:var(--muted)">Zoom in/out</span>
            </div>
          </div>`
          :isImg?`<div class="img-preview"><img src="${file.content}" alt="${esc(file.name)}" /><div class="img-meta">${esc(file.name)}</div></div>`
          :state.splitView===2?`${[state.activeTab,state.openTabs.find(t=>t.path!==state.activeTab)?.path||state.activeTab].map((tabPath,i)=>{
            const f=state.files[tabPath]; if(!f)return '';
            return `<div class="code-editor" style="flex:1;border-${i===0?'right':'left'}:1px solid var(--border);">
              <div class="gutter"><div class="gutter-inner" id="gutter-${i}">${Array.from({length:f.content.split('\n').length},(_,j)=>j+1).join('\n')}</div></div>
              <div class="editor-scroll" id="editor-scroll-${i}" onscroll="document.getElementById('gutter-${i}').scrollTop=this.scrollTop">
                <div style="position:relative;width:max-content;min-width:100%;" id="editor-inner-${i}">
                  <pre class="hl-layer" id="hl-${i}">${highlight(f.content,f.language)}</pre>
                  <textarea class="ed-textarea" id="ed-ta-${i}" spellcheck="false" oninput="onSplitInput(this,'${tabPath}')" onkeydown="onSplitKey(event,'${tabPath}')">${esc(f.content)}</textarea>
                </div>
              </div>
            </div>`;
          }).join('')}`
          :`<div class="code-editor">
            <div class="gutter" id="gutter-wrap">
              <div class="gutter-inner" id="gutter-main" style="font-size:${Math.round(14*state.editorZoom)}px;line-height:${Math.round(21*state.editorZoom)}px;">${Array.from({length:lineCount},(_,i)=>i+1).join('\n')}</div>
            </div>
            <div class="editor-scroll" id="editor-scroll-main">
              <div id="editor-inner-main" style="position:relative;width:max-content;min-width:100%;">
                <pre class="hl-layer" id="hl-main" style="font-size:${Math.round(14*state.editorZoom)}px;line-height:${Math.round(21*state.editorZoom)}px;">${buildHighlight(file.content,file.language,state.aiSuggestion,state.aiCursorPos)}</pre>
                <textarea class="ed-textarea" id="main-textarea" spellcheck="false" style="font-size:${Math.round(14*state.editorZoom)}px;line-height:${Math.round(21*state.editorZoom)}px;"></textarea>
              </div>
            </div>
          </div>`}

          <!-- QUICK FIX PANEL -->
          ${state.quickFixPanel?`<div class="quick-fix-panel" style="top:${state.quickFixPanel.y}px;left:${state.quickFixPanel.x}px;">
            <div class="qf-head"><span>⚡ Quick Fix — Line ${state.quickFixPanel.lineNum}</span><button onclick="closeQuickFix()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;">×</button></div>
            ${state.quickFixPanel.diag?`<div class="qf-error">${esc(state.quickFixPanel.diag.msg)}</div>`:''}
            ${state.quickFixPanel.loading?`<div class="qf-loading"><span class="ai-dot"></span> AI is analyzing...</div>`:''}
            ${(state.quickFixPanel.fixes||[]).map((f,i)=>`<div class="qf-fix" onclick="applyQuickFix('${esc(f.code||'')}',${state.quickFixPanel.lineNum})"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712zM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32L19.513 8.2z"/></svg>${esc(f.label||'Apply fix')}</div>`).join('')}
            ${!state.quickFixPanel.loading&&!(state.quickFixPanel.fixes||[]).length?`<div class="qf-loading" style="color:var(--muted)">No automated fixes available — check the AI Chat panel.</div>`:''}
          </div>`:''}
        </div>

        <!-- TERMINAL -->
        ${state.showTerminal?`<div class="terminal" style="height:200px;">
          <div class="term-head">
            <div class="term-tabs"><div class="term-tab active-term">Terminal</div></div>
            <button onclick="toggleTerminal()" style="background:transparent;border:none;cursor:pointer;color:var(--muted);">×</button>
          </div>
          <div class="term-out" id="term-out">
            ${(state.terminalHistory||[]).map(l=>`<div style="color:${l.cmd?'var(--accent)':'var(--text)'}">${esc(l.text)}</div>`).join('')}
          </div>
          <div class="term-in-row">
            <span class="term-prompt">$</span>
            <input class="term-inp" id="term-inp" type="text" spellcheck="false" value="${esc(state.terminalInput)}" oninput="state.terminalInput=this.value" onkeydown="if(event.key==='Enter'){runCommand(this.value);this.value='';}" placeholder="Enter command..." />
          </div>
        </div>`:''}
      </div>
    </div>

    <!-- STATUS BAR -->
    <div class="statusbar" id="status-bar"></div>

    <!-- CONTEXT MENU -->
    ${state.contextMenu?`<div class="ctx-menu" id="ctx-menu" style="top:${state.contextMenu.y}px;left:${state.contextMenu.x}px">
      <div class="ctx-item" onclick="startRename('${state.contextMenu.path}');hideCtx()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Rename</div>
      <div class="ctx-item" onclick="startCreate('file','${state.contextMenu.path}');hideCtx()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6m0 0v5h5"/></svg>New File</div>
      <div class="ctx-item" onclick="startCreate('folder','${state.contextMenu.path}');hideCtx()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>New Folder</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" onclick="openFile('${state.contextMenu.path}');togglePanel('ai');setTimeout(()=>sendAIChatQuick('Explain this file: ${state.contextMenu.path}'),200);hideCtx()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>Explain with AI</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" style="color:#ff5555;" onclick="deleteFilePath('${state.contextMenu.path}');hideCtx()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>Delete</div>
    </div>`:''}

    <!-- DRAW TOOLBAR -->
    ${state.drawMode?`<div class="draw-toolbar" id="draw-toolbar">
      <div class="draw-toolbar-drag" id="draw-drag"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="5" r="1" fill="currentColor"/><circle cx="15" cy="5" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="19" r="1" fill="currentColor"/><circle cx="15" cy="19" r="1" fill="currentColor"/></svg></div>
      <div class="dtool-row">
        <button class="dtool ${state.drawTool==='pen'?'active-tool':''}" title="Pen" onclick="state.drawTool='pen';render()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></button>
        <button class="dtool ${state.drawTool==='highlighter'?'active-tool':''}" title="Highlighter" onclick="state.drawTool='highlighter';render()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3l-6 6 10.5 10.5 6-6z"/></svg></button>
        <button class="dtool ${state.drawTool==='eraser'?'active-tool':''}" title="Eraser" onclick="state.drawTool='eraser';render()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l10-10 7 7"/></svg></button>
      </div>
      <div class="dtool-label">Color</div>
      <input type="color" class="draw-color" value="${state.drawColor}" oninput="state.drawColor=this.value" />
      <div class="dtool-label">Size: ${state.drawSize}px</div>
      <input type="range" class="draw-range" min="1" max="30" value="${state.drawSize}" oninput="state.drawSize=parseInt(this.value);this.previousElementSibling.textContent='Size: '+state.drawSize+'px'" />
      <button class="draw-act" onclick="state.drawings=[];replayDraw()">Clear</button>
      <button class="draw-act draw-exit" onclick="toggleDraw()">Exit Draw</button>
    </div>`:''}`;

  // Post-render setup
  updateStatusBar();
  setTimeout(()=>{
    setupEditorListeners();
    setupDrawToolbarDrag();
    const ta=document.getElementById('main-textarea');
    const hl=document.getElementById('hl-main');
    if(ta&&file&&!isImg){
      ta.value=file.content; // Set raw content (not escaped)
      if(hl){
        ta.style.height=Math.max(hl.scrollHeight,300)+'px';
        ta.style.width=Math.max(hl.scrollWidth,100)+'%';
      }
    }
    restoreScroll(state.activeTab);
    if(state.activePanel==='search') document.getElementById('search-inp')?.focus();
    if(state.activePanel==='ai') scrollChatToBottom();
    renderGutterMarkers();
  },0);

  document.addEventListener('click',hideCtxOnce,{once:true});
}

function hideCtxOnce(){ if(state.contextMenu){state.contextMenu=null;render();} }

/* ================================================================
   EXPOSE GLOBALS
================================================================ */
Object.assign(window,{
  openFile,closeTab,switchTab,toggleFolder,collapseAll,
  startCreate,confirmCreate,cancelCreate,
  startRename,confirmRename,cancelRename,
  deleteFilePath,uploadFiles,uploadFolder,
  saveFileToDisk,handleFileUpload,
  performSearch,jumpToResult,
  togglePanel,toggleDraw,toggleSplit,toggleTerminal,
  openPreview,updatePreview,addTermLine,runCommand,
  showCtx,hideCtx,
  applyTheme,applyZoom,
  initSidebarResize,clearWorkspace,
  onSplitInput,onSplitKey,
  acceptAI,replayDraw,
  sendAIChat,sendAIChatQuick,clearAIChat,
  showQuickFix,applyQuickFix,closeQuickFix,
  jumpToLine,state
});

/* ================================================================
   INIT
================================================================ */
render();
setTimeout(setupEditorListeners,100);
setInterval(()=>{ if(Object.keys(state.files).length) saveState(); },30000);
</script>
</body>
</html>
