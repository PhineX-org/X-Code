/* ════════════════════════════════════════════════════════════
   AI — INLINE GHOST-TEXT COMPLETIONS (path-keyed, so every open
   file/pane tracks its own suggestion independently)
════════════════════════════════════════════════════════════ */
let aiTimer = null, aiCtrl = null;

function getWorkspaceCtx(excludePath) {
  return Object.entries(state.files)
    .filter(([p, f]) => !isImg(f.name) && p !== excludePath && f.content.trim())
    .map(([p, f]) => `// ${p}\n${f.content.slice(0, 250)}`)
    .join('\n\n')
    .slice(0, 1000);
}

function scheduleAI(path, content, lang, cursorPos) {
  clearTimeout(aiTimer);
  delete state.aiSuggestions[path];
  const lines = content.split('\n').length;
  aiTimer = setTimeout(
    () => fetchAI(path, content, lang, cursorPos),
    lines < 200 ? 600 : lines < 800 ? 900 : 1400
  );
}

async function fetchAI(path, content, lang, cursorPos) {
  if (!content.trim()) return;
  if (aiCtrl) aiCtrl.abort();
  aiCtrl = new AbortController();
  state.aiLoadingPaths[path] = true;
  renderStatusBarOnly();
  const before = content.substring(Math.max(0, cursorPos - 1000), cursorPos);
  const wCtx = getWorkspaceCtx(path);
  try {
    const res = await fetch(AI_EP, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      signal: aiCtrl.signal,
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `You are an expert ${lang} inline code completion AI (like GitHub Copilot).
Output ONLY the raw completion — no markdown, no explanation, no code fences.
Complete at most 3 lines. Be syntactically correct for ${lang}.
${wCtx ? `\nProject context:\n${wCtx}\n` : ''}
${lang} code (complete after the cursor):
${before}`
          }]
        }]
      })
    });
    const data = await res.json();
    let s = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
    s = s.replace(/```[\w]*\n?/g, '').replace(/```/g, '').trim();
    const suggestion = s.split('\n').slice(0, 3).join('\n');
    if (suggestion) state.aiSuggestions[path] = {text: suggestion, pos: cursorPos};
  } catch (e) { /* aborted or offline — no suggestion, fail quietly */ }
  state.aiLoadingPaths[path] = false;
  renderStatusBarOnly();
  refreshPaneHighlight(path);
}

function acceptAI(paneId) {
  const path = paneIdToPath(paneId);
  const sug = path && state.aiSuggestions[path];
  if (!sug) return false;
  const ta = paneTextareaEl(paneId);
  if (!ta) return false;
  const pos = ta.selectionStart;
  insertAtCaret(ta, sug.text);
  const np = pos + sug.text.length;
  delete state.aiSuggestions[path];
  refreshPaneHighlight(path);
  ta.setSelectionRange(np, np);
  markModified(path);
  scheduleAutoSave();
  return true;
}

/* Re-render just one pane's highlight layer + gutter, without a full app re-render
   (keeps focus/selection/scroll intact — the same discipline the original app used
   for the primary editor, now shared by every pane). */
function refreshPaneHighlight(path) {
  for (const id of getAllPaneIds()) {
    if (paneIdToPath(id) !== path) continue;
    const ta = paneTextareaEl(id);
    const hl = document.getElementById(paneHlId(id));
    const gutter = document.getElementById(paneGutterId(id));
    const file = state.files[path];
    if (!ta || !hl || !file) continue;
    const sug = state.aiSuggestions[path];
    hl.innerHTML = buildHighlight(file.content, file.language, sug?.text, sug?.pos);
    if (gutter) {
      const n = file.content.split('\n').length;
      gutter.innerHTML = Array.from({length: n}, (_, i) => `<div class="gutter-line">${i + 1}</div>`).join('');
    }
    renderDecorationLayer(id);
  }
}

/* ════════════════════════════════════════════════════════════
   DIAGNOSTICS — AI-assisted error detection, per file path
════════════════════════════════════════════════════════════ */
let diagTimers = {};

function scheduleDiagnostics(path) {
  const file = state.files[path];
  if (!file || !DIAGNOSTIC_LANGS.has(file.language)) return;
  clearTimeout(diagTimers[path]);
  diagTimers[path] = setTimeout(() => runDiagnostics(path), 1800);
}

async function runDiagnostics(path) {
  const file = state.files[path];
  if (!file) return;
  const content = file.content, lang = file.language;
  if (!content.trim() || content.length > 60000) return;

  state.diagRunning[path] = true;
  renderStatusBarOnly();

  try {
    const res = await fetch(AI_EP, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `Analyze this ${lang} code for errors, warnings, and issues. Be precise.
Return ONLY a valid JSON array. No markdown, no explanation, no code fences.
Format: [{"line":1,"col":1,"length":5,"msg":"error description","severity":"error"}]
- line: 1-indexed line number
- col: 1-indexed column where the issue starts
- length: number of characters to underline (estimate if unsure, minimum 1)
- severity: "error" | "warning" | "info"
- msg: brief, helpful description
Max 10 items. Return [] if no issues.

Code:
${content.slice(0, 5000)}`
          }]
        }]
      })
    });
    const data = await res.json();
    let txt = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '[]';
    txt = txt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
    const match = txt.match(/\[[\s\S]*\]/);
    txt = match ? match[0] : '[]';
    let diags = [];
    try {
      diags = JSON.parse(txt);
      if (!Array.isArray(diags)) diags = [];
    } catch (e) { diags = []; }
    diags = diags
      .filter(d => d.line && d.msg && d.severity)
      .slice(0, 10)
      .map(d => ({
        line: Math.max(1, parseInt(d.line) || 1),
        col: Math.max(1, parseInt(d.col) || 1),
        length: Math.max(1, parseInt(d.length) || 6),
        msg: String(d.msg).slice(0, 200),
        severity: ['error', 'warning', 'info'].includes(d.severity) ? d.severity : 'warning'
      }));
    state.diagnostics[path] = diags;
  } catch (e) { /* offline or blocked — leave existing diagnostics as-is */ }

  state.diagRunning[path] = false;
  for (const id of getAllPaneIds()) if (paneIdToPath(id) === path) renderDecorationLayer(id);
  renderFileTreeOnly();
  updateProblemsPanel();
  saveState();
}

/* ── Measurement helpers (shared by every pane's decoration math) ── */
let cachedCharW = null;
function getCharW() {
  if (cachedCharW && cachedCharW.zoom === state.editorZoom) return cachedCharW.w;
  const sp = document.createElement('span');
  sp.style.cssText = `font:${Math.round(14 * state.editorZoom)}px/1 ${getComputedStyle(document.documentElement).getPropertyValue('--font')};position:fixed;visibility:hidden;white-space:pre;left:-9999px;top:0;`;
  sp.textContent = 'x'.repeat(10);
  document.body.appendChild(sp);
  const w = sp.getBoundingClientRect().width / 10;
  sp.remove();
  cachedCharW = {zoom: state.editorZoom, w};
  return w;
}
function getLineH() { return Math.round(21 * state.editorZoom); }
function getPad() { return 16; }

/* ── Decoration layer: wavy squiggle underlines, per pane ── */
function renderDecorationLayer(paneId) {
  const decEl = document.getElementById(paneDecId(paneId));
  const path = paneIdToPath(paneId);
  if (!decEl || !path) return;
  const diags = state.diagnostics[path] || [];
  decEl.innerHTML = '';
  const file = state.files[path];
  if (!diags.length || !file) return;

  const charW = getCharW();
  const lineH = getLineH();
  const pad = getPad();
  const lines = file.content.split('\n');

  diags.forEach(d => {
    const lineContent = lines[d.line - 1] || '';
    const col = Math.max(1, Math.min(d.col, lineContent.length + 1));
    const len = Math.min(d.length, lineContent.length - col + 2) || 6;
    const top = pad + (d.line - 1) * lineH + lineH - 3;
    const left = pad + (col - 1) * charW;
    const width = Math.max(len * charW, 8);

    const el = document.createElement('div');
    el.className = `dec-squiggle sev-${d.severity}`;
    el.style.cssText = `top:${top}px;left:${left}px;width:${width}px;`;
    el.title = `[${d.severity.toUpperCase()}] ${d.msg}`;
    el.addEventListener('mouseenter', e => showErrTooltip(e, d));
    el.addEventListener('mouseleave', hideErrTooltip);
    el.addEventListener('click', () => showQuickFix(paneId, d.line, d));
    decEl.appendChild(el);
  });

  const col = document.getElementById(paneId === 'main' ? 'gutter-err-col' : `gutter-err-col-${paneId}`);
  if (col) {
    col.innerHTML = '';
    diags.forEach(d => {
      const el = document.createElement('div');
      el.className = `gutter-err-mark sev-${d.severity}`;
      el.style.cssText = `top:${pad + (d.line - 1) * lineH}px;height:${lineH}px;`;
      el.title = d.msg;
      el.addEventListener('mouseenter', e => showErrTooltip(e, d));
      el.addEventListener('mouseleave', hideErrTooltip);
      el.addEventListener('click', () => { jumpToLine(paneId, d.line); showQuickFix(paneId, d.line, d); });
      col.appendChild(el);
    });
  }
}
function renderAllDecorations() {
  for (const id of getAllPaneIds()) renderDecorationLayer(id);
}

/* The textarea sits visually on top of .dec-layer (it has to, to receive typing and
   text selection), which means the squiggle elements' own mouseenter/click listeners
   above never actually fire in a real browser — the textarea intercepts the pointer
   event first. Hover/click-to-quick-fix on a squiggle has to be driven from the
   textarea's own mouse events instead, by mapping the cursor position back to a
   line/column and checking it against the diagnostics list. */
function charPosFromMouseEvent(e) {
  const charW = getCharW(), lineH = getLineH(), pad = getPad();
  const line = Math.floor((e.offsetY - pad) / lineH) + 1;
  const col = Math.round((e.offsetX - pad) / charW) + 1;
  return {line: Math.max(1, line), col: Math.max(1, col)};
}
function diagnosticAtCharPos(path, line, col) {
  const diags = state.diagnostics[path] || [];
  return diags.find(d => d.line === line && col >= d.col && col < d.col + Math.max(d.length, 1));
}
let _hoveredDiagKey = null;
function handlePaneMouseMove(paneId, e) {
  const path = paneIdToPath(paneId);
  if (!path || !(state.diagnostics[path] || []).length) return;
  const {line, col} = charPosFromMouseEvent(e);
  const d = diagnosticAtCharPos(path, line, col);
  const key = d ? `${path}:${d.line}:${d.col}` : null;
  if (key === _hoveredDiagKey) {
    if (d) { // keep the tooltip following the cursor while hovering the same squiggle
      const tt = document.getElementById('err-tt');
      if (tt) tt.style.cssText = `display:block;left:${e.clientX + 18}px;top:${e.clientY - 8}px;`;
    }
    return;
  }
  _hoveredDiagKey = key;
  e.target.style.cursor = d ? 'pointer' : 'text';
  if (d) showErrTooltip(e, d); else hideErrTooltip();
}
function handlePaneMouseLeave() {
  _hoveredDiagKey = null;
  hideErrTooltip();
}
function handlePaneMouseClick(paneId, e) {
  const path = paneIdToPath(paneId);
  if (!path || !(state.diagnostics[path] || []).length) return;
  const {line, col} = charPosFromMouseEvent(e);
  const d = diagnosticAtCharPos(path, line, col);
  if (d) showQuickFix(paneId, d.line, d);
}

function showErrTooltip(e, d) {
  let tt = document.getElementById('err-tt');
  if (!tt) { tt = document.createElement('div'); tt.id = 'err-tt'; document.body.appendChild(tt); }
  tt.className = `err-tooltip sev-${d.severity}`;
  tt.style.cssText = `display:block;left:${e.clientX + 18}px;top:${e.clientY - 8}px;`;
  tt.innerHTML = `<div class="err-tooltip-head">${d.severity.toUpperCase()}  Line ${d.line}, Col ${d.col}</div>${esc(d.msg)}`;
}
function hideErrTooltip() {
  const tt = document.getElementById('err-tt');
  if (tt) tt.style.display = 'none';
}

function jumpToLine(paneId, line) {
  const ta = paneTextareaEl(paneId);
  const path = paneIdToPath(paneId);
  const file = state.files[path];
  if (!ta || !file) return;
  const lines = file.content.split('\n');
  let pos = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
  ta.focus();
  ta.setSelectionRange(pos, pos);
  const lineH = getLineH();
  const sc = document.getElementById(paneScrollId(paneId));
  if (sc) sc.scrollTop = Math.max(0, (line - 4) * lineH);
}

/* ── Quick Fix (AI-suggested correction for a single diagnostic) ── */
function showQuickFix(paneId, line, diag) {
  state.quickFixPanel = {paneId, line, diag, loading: true, suggestion: null};
  render();
  fetchQuickFix(paneId, line, diag);
}
async function fetchQuickFix(paneId, line, diag) {
  const path = paneIdToPath(paneId);
  const file = state.files[path];
  if (!file) return;
  try {
    const res = await fetch(AI_EP, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `Fix this ${file.language} issue: "${diag.msg}" on line ${line}.
Return ONLY a JSON object: {"explanation":"one short sentence","fixedLine":"the corrected full line of code, no line number"}
No markdown, no code fences.

Full file for context:
${file.content.slice(0, 4000)}`
          }]
        }]
      })
    });
    const data = await res.json();
    let txt = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '{}';
    txt = txt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
    const match = txt.match(/\{[\s\S]*\}/);
    let obj = {};
    try { obj = JSON.parse(match ? match[0] : '{}'); } catch (e) { obj = {}; }
    if (state.quickFixPanel && state.quickFixPanel.paneId === paneId && state.quickFixPanel.line === line) {
      state.quickFixPanel.loading = false;
      state.quickFixPanel.suggestion = obj.fixedLine ? obj : null;
      state.quickFixPanel.explanation = obj.explanation || '';
    }
  } catch (e) {
    if (state.quickFixPanel) { state.quickFixPanel.loading = false; state.quickFixPanel.suggestion = null; }
  }
  render();
}
function applyQuickFix() {
  const qf = state.quickFixPanel;
  if (!qf || !qf.suggestion) return;
  const path = paneIdToPath(qf.paneId);
  const file = state.files[path];
  const ta = paneTextareaEl(qf.paneId);
  if (!file || !ta) return;
  const lines = file.content.split('\n');
  if (qf.line - 1 >= lines.length) return;
  let from = 0;
  for (let i = 0; i < qf.line - 1; i++) from += lines[i].length + 1;
  const to = from + lines[qf.line - 1].length;
  replaceRange(ta, from, to, qf.suggestion.fixedLine);
  markModified(path);
  state.files[path].content = ta.value;
  refreshPaneHighlight(path);
  state.quickFixPanel = null;
  scheduleDiagnostics(path);
  scheduleAutoSave();
  render();
}
function dismissQuickFix() { state.quickFixPanel = null; render(); }

function markModified(path) {
  state.modified[path] = true;
}

/* ════════════════════════════════════════════════════════════
   PROBLEMS PANEL
════════════════════════════════════════════════════════════ */
function allDiagnosticsFlat() {
  const out = [];
  for (const [path, diags] of Object.entries(state.diagnostics)) {
    if (!state.files[path]) continue;
    for (const d of diags) out.push({path, ...d});
  }
  const filt = (state.problemsFilter || '').toLowerCase();
  return filt ? out.filter(d => d.msg.toLowerCase().includes(filt) || d.path.toLowerCase().includes(filt)) : out;
}
function updateProblemsPanel() { renderProblemsListOnly(); }

/* ════════════════════════════════════════════════════════════
   AI CHAT PANEL
════════════════════════════════════════════════════════════ */

function renderTree(nodes, depth) {
  depth = depth || 0;
  return nodes.map(node => {
    if (node.name === '.keep') return '';
    const indent = depth * 14 + 8;
    if (node.type === 'folder') {
      const open = state.expandedFolders.includes(node.path);
      if (state.renamingPath === node.path) {
        return `<div class="ftree-row" style="padding-left:${indent}px">
          ${getIcon('', true, open)}
          <input id="rename-input" class="ftree-rename-input" value="${escAttr(state.newItemName)}"
            oninput="state.newItemName=this.value"
            onkeydown="if(event.key==='Enter'){event.preventDefault();confirmRename();}if(event.key==='Escape'){event.preventDefault();cancelRename();}event.stopPropagation()"
            onblur="confirmRename()" onclick="event.stopPropagation()" />
        </div>`;
      }
      const errInfo = folderDiagSummary(node.path);
      return `
      <div class="ftree-row ftree-folder" style="padding-left:${indent}px"
        onclick="toggleFolder('${escAttr(node.path)}')"
        oncontextmenu="showContextMenu(event,'${escAttr(node.path)}',true)">
        <span class="ftree-chevron ${open ? 'open' : ''}">${svgChevron()}</span>
        ${getIcon('', true, open)}
        <span class="ftree-name">${esc(node.name)}</span>
        ${errInfo}
        <span class="ftree-hover-acts">
          <button onclick="event.stopPropagation();startCreate('file','${escAttr(node.path)}')" title="New File">${svgFilePlus()}</button>
          <button onclick="event.stopPropagation();startCreate('folder','${escAttr(node.path)}')" title="New Folder">${svgFolderPlus()}</button>
        </span>
      </div>
      ${open ? renderCreatingRow(node.path, depth + 1) : ''}
      ${open ? renderTree(node.children, depth + 1) : ''}`;
    }
    const active = state.activeTab === node.path;
    const modified = state.modified[node.path];
    const diags = state.diagnostics[node.path] || [];
    const hasErr = diags.some(d => d.severity === 'error');
    const hasWarn = diags.some(d => d.severity === 'warning');
    if (state.renamingPath === node.path) {
      return `<div class="ftree-row" style="padding-left:${indent + 16}px">
        ${getIcon(node.name)}
        <input id="rename-input" class="ftree-rename-input" value="${escAttr(state.newItemName)}"
          oninput="state.newItemName=this.value"
          onkeydown="if(event.key==='Enter'){event.preventDefault();confirmRename();}if(event.key==='Escape'){event.preventDefault();cancelRename();}event.stopPropagation()"
          onblur="confirmRename()" onclick="event.stopPropagation()" />
      </div>`;
    }
    return `
      <div class="ftree-row ftree-file ${active ? 'active' : ''}" style="padding-left:${indent + 16}px"
        onclick="openFile('${escAttr(node.path)}')"
        oncontextmenu="showContextMenu(event,'${escAttr(node.path)}',false)">
        ${getIcon(node.name)}
        <span class="ftree-name">${esc(node.name)}</span>
        ${hasErr ? '<span class="ftree-err-dot"></span>' : hasWarn ? '<span class="ftree-warn-dot"></span>' : ''}
        ${modified ? '<span class="ftree-dot"></span>' : ''}
      </div>`;
  }).join('');
}
function folderDiagSummary(folderPath) {
  const under = allPathsUnder(folderPath);
  let err = 0, warn = 0;
  for (const p of under) for (const d of (state.diagnostics[p] || [])) { if (d.severity === 'error') err++; else if (d.severity === 'warning') warn++; }
  if (err) return '<span class="ftree-err-dot"></span>';
  if (warn) return '<span class="ftree-warn-dot"></span>';
  return '';
}
function renderCreatingRow(parent, depth) {

function highlightMatch(text, query) {
  if (!query) return esc(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx < 0) return esc(text);
  return esc(text.slice(0, idx)) + '<mark>' + esc(text.slice(idx, idx + query.length)) + '</mark>' + esc(text.slice(idx + query.length));
}
function performSearch(q) {
  state.searchQuery = q;
  if (!q.trim()) { state.searchResults = []; renderSidebarOnly(); return; }
  const out = [];
  for (const [path, f] of Object.entries(state.files)) {
    if (pathBase(path) === '.keep' || isImg(f.name)) continue;
    const matches = [];
    f.content.split('\n').forEach((line, i) => {
      if (line.toLowerCase().includes(q.toLowerCase())) matches.push({line: i + 1, text: line.trim().slice(0, 120)});
    });
    if (matches.length) out.push({path, name: f.name, matches});
  }
  state.searchResults = out;
  renderSidebarOnly();
}

/* ════════════════════════════════════════════════════════════
   EDITOR PANE — the single shared template for the primary editor
   AND every split pane. One function, one code path: whatever the
   primary editor can show (gutter, live line numbers, squiggles,
   AI ghost text, find widget, correct zoom), every pane shows,
   because they're all built here.
════════════════════════════════════════════════════════════ */
function renderPane(paneId) {
  const path = paneIdToPath(paneId);
  const isSplit = paneId !== 'main';
  const flex = isSplit ? (state.splitPanes[paneId].flex || 1) : (state.mainPaneFlex || 1);

  if (!path || !state.files[path]) {
    return `<div class="editor-pane" style="flex:${flex} 1 0">
      ${isSplit ? renderPaneHeader(paneId, null) : ''}
      <div class="editor-empty">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1"><path d="M8 3L4 12l4 9M16 3l4 9-4 9"/></svg>
        <div>No file open</div>
      </div>
    </div>`;
  }
  const file = state.files[path];

  if (isImg(file.name)) {
    return `<div class="editor-pane" style="flex:${flex} 1 0">
      ${isSplit ? renderPaneHeader(paneId, path) : ''}
      <div class="image-viewer-wrap"><img src="${escAttr(file.content)}" class="image-viewer" alt="${escAttr(file.name)}" /></div>
    </div>`;
  }

  const fz = (14 * state.editorZoom).toFixed(1) + 'px';
  const lh = Math.round(21 * state.editorZoom) + 'px';
  const sug = state.aiSuggestions[path];
  const lineCount = file.content.split('\n').length;
  const gutterId = paneGutterId(paneId);
  const hlId = paneHlId(paneId);
  const taId = paneTextareaId(paneId);
  const decId = paneDecId(paneId);
  const scrollId = paneScrollId(paneId);
  const errColId = paneId === 'main' ? 'gutter-err-col' : `gutter-err-col-${paneId}`;

  return `<div class="editor-pane" style="flex:${flex} 1 0" data-pane="${paneId}">
    ${isSplit ? renderPaneHeader(paneId, path) : ''}
    <div class="editor-body">
      <div class="gutter" id="${gutterId}" style="font-size:${fz};line-height:${lh}">
        <div class="gutter-err-col" id="${errColId}"></div>
        <div class="gutter-inner">
          ${Array.from({length: lineCount}, (_, i) => `<div class="gutter-line">${i + 1}</div>`).join('')}
        </div>
      </div>
      <div class="editor-scroll" id="${scrollId}">
        <div class="editor-inner" id="editor-inner-${paneId}">
          <pre class="hl-layer" id="${hlId}" style="font-size:${fz};line-height:${lh}">${buildHighlight(file.content, file.language, sug?.text, sug?.pos)}</pre>
          <div class="dec-layer" id="${decId}"></div>
          <div class="bracket-match-layer" id="bracket-match-${paneId}"></div>
          <textarea class="ed-textarea" id="${taId}" spellcheck="false" autocapitalize="off" autocomplete="off"
            style="font-size:${fz};line-height:${lh}" data-pane="${paneId}">${esc(file.content)}</textarea>
        </div>
      </div>
      ${renderFindWidget(paneId)}
    </div>
  </div>`;
}

function renderPaneHeader(paneId, path) {
  const openable = state.openTabs.length ? state.openTabs : (path ? [{path, name: pathBase(path)}] : []);
  return `<div class="pane-header">
    <select class="pane-file-select" onchange="setSplitPanePath(${paneId}, this.value)">
      ${!path ? '<option value="">— choose a file —</option>' : ''}
      ${openable.map(t => `<option value="${escAttr(t.path)}" ${t.path === path ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
    </select>

}

/* ── Multi-pane editor area: lays out the primary pane + N split panes,
      with a draggable divider between every adjacent pair. ── */
function renderEditorArea() {
  const paneIds = getAllPaneIds();
  const orientationClass = state.splitOrientation === 'column' ? 'split-column' : 'split-row';
  const panesHtml = paneIds.map((id, i) => {
    const divider = i > 0 ? `<div class="pane-divider ${orientationClass}" data-left="${paneIds[i - 1]}" data-right="${id}"></div>` : '';
    return divider + renderPane(id);
  }).join('');
  return `<div class="editor-area ${orientationClass}" id="editor-area">${panesHtml}</div>`;
}

function splitPane(orientation) {
  if (!state.activeTab) { showToast('Open a file first', 'info'); return; }
  if (state.splitPanes.length >= MAX_SPLIT_PANES) { showToast(`Up to ${MAX_SPLIT_PANES + 1} panes at once`, 'info'); return; }
  if (state.splitPanes.length === 0) state.splitOrientation = orientation;
  state.splitPanes.push({path: state.activeTab, flex: 1});
  const newId = state.splitPanes.length - 1;
  state.focusedPaneId = newId;
  render();
}
function toggleSplitOrientation() {
  state.splitOrientation = state.splitOrientation === 'row' ? 'column' : 'row';
  render();
}
function closeSplitPane(idx) {
  state.splitPanes.splice(idx, 1);
  if (typeof state.focusedPaneId === 'number') {
    if (state.focusedPaneId === idx) state.focusedPaneId = 'main';
    else if (state.focusedPaneId > idx) state.focusedPaneId--;
  }
  render();
}
function setSplitPanePath(idx, path) {
  if (!path) return;
  state.splitPanes[idx].path = path;
  render();
}

function setupPaneDividers() {
  document.querySelectorAll('.pane-divider').forEach(div => {
    div.addEventListener('mousedown', e => {
      e.preventDefault();
      const leftId = div.dataset.left === 'main' ? 'main' : parseInt(div.dataset.left);
      const rightId = div.dataset.right === 'main' ? 'main' : parseInt(div.dataset.right);
      const leftEl = document.querySelector(`.editor-pane[data-pane="${leftId}"]`);
      const rightEl = document.querySelector(`.editor-pane[data-pane="${rightId}"]`);
      if (!leftEl || !rightEl) return;
      const vertical = state.splitOrientation === 'row';
      const startPos = vertical ? e.clientX : e.clientY;
      const startLeftSize = vertical ? leftEl.getBoundingClientRect().width : leftEl.getBoundingClientRect().height;
      const startRightSize = vertical ? rightEl.getBoundingClientRect().width : rightEl.getBoundingClientRect().height;
      const total = startLeftSize + startRightSize;
      function mv(ev) {
        const pos = vertical ? ev.clientX : ev.clientY;
        const delta = pos - startPos;
        const newLeft = clamp(startLeftSize + delta, 80, total - 80);
        const leftFlex = newLeft / (total - newLeft);
        setPaneFlex(leftId, leftFlex);
        setPaneFlex(rightId, 1);
      }
      function up() {
        document.removeEventListener('mousemove', mv);
        document.removeEventListener('mouseup', up);
      }
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    });
  });
}
function setPaneFlex(paneId, flex) {
  if (paneId === 'main') state.mainPaneFlex = flex;
  else if (state.splitPanes[paneId]) state.splitPanes[paneId].flex = flex;
  const el = document.querySelector(`.editor-pane[data-pane="${paneId}"]`);
  if (el) el.style.flex = `${flex} 1 0`;
}

/* ════════════════════════════════════════════════════════════
   FIND & REPLACE WIDGET (per pane, Ctrl+F / Ctrl+H)
════════════════════════════════════════════════════════════ */
function renderFindWidget(paneId) {
  const fw = state.findWidget;
  if (!fw || fw.paneId !== paneId) return '';
  const count = fw.matches.length;
  const pos = count ? fw.idx + 1 : 0;
  return `<div class="find-widget">
    <div class="find-row">
      <input id="find-input-${paneId}" class="find-input" placeholder="Find" value="${escAttr(fw.query)}"
        oninput="updateFindQuery(${paneId === 'main' ? "'main'" : paneId}, this.value)"
        onkeydown="handleFindInputKey(event, ${paneId === 'main' ? "'main'" : paneId})" />
      <span class="find-count">${count ? pos + ' of ' + count : 'No results'}</span>
      <button onclick="findNav(${paneId === 'main' ? "'main'" : paneId}, -1)" title="Previous (Shift+Enter)">${svgChevronUp()}</button>
      <button onclick="findNav(${paneId === 'main' ? "'main'" : paneId}, 1)" title="Next (Enter)">${svgChevronDown()}</button>
      <button class="${fw.matchCase ? 'active' : ''}" onclick="toggleFindOpt(${paneId === 'main' ? "'main'" : paneId},'matchCase')" title="Match Case">Aa</button>
      <button class="${fw.wholeWord ? 'active' : ''}" onclick="toggleFindOpt(${paneId === 'main' ? "'main'" : paneId},'wholeWord')" title="Whole Word">ab</button>
      <button class="${fw.showReplace ? 'active' : ''}" onclick="toggleReplaceRow(${paneId === 'main' ? "'main'" : paneId})" title="Toggle Replace">${svgReplaceToggle()}</button>
      <button onclick="closeFindWidget()" title="Close (Esc)">${svgClose()}</button>
    </div>
    ${fw.showReplace ? `
    <div class="find-row">
      <input class="find-input" placeholder="Replace" value="${escAttr(fw.replace)}"
        oninput="state.findWidget.replace=this.value" />
      <button onclick="findReplaceOne(${paneId === 'main' ? "'main'" : paneId})">Replace</button>
      <button onclick="findReplaceAll(${paneId === 'main' ? "'main'" : paneId})">Replace All</button>
    </div>` : ''}
  </div>`;
}
function svgChevronUp() { return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 15l-6-6-6 6"/></svg>`; }
function svgChevronDown() { return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>`; }
function svgReplaceToggle() { return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>`; }

function openFindWidget(paneId, withReplace) {
  const path = paneIdToPath(paneId);
  if (!path) return;
  const ta = paneTextareaEl(paneId);
  const selected = ta && ta.selectionStart !== ta.selectionEnd ? ta.value.slice(ta.selectionStart, ta.selectionEnd) : (state.findWidget?.query || '');
  state.findWidget = {
    paneId, query: selected, replace: '', showReplace: !!withReplace,
    matchCase: false, wholeWord: false, matches: [], idx: 0
  };
  recomputeFindMatches(paneId);
  render();
  const findEl = document.getElementById(`find-input-${paneId}`);
  if (findEl) { findEl.focus(); findEl.select(); }
}
function closeFindWidget() {
  state.findWidget = null;
  render();
}
function recomputeFindMatches(paneId) {
  const fw = state.findWidget;
  if (!fw) return;
  const path = paneIdToPath(paneId);
  const file = state.files[path];
  if (!file) { fw.matches = []; return; }
  fw.matches = computeFindMatches(file.content, fw.query, fw.matchCase, fw.wholeWord, false);
  fw.idx = 0;
}
function updateFindQuery(paneId, q) {
  if (!state.findWidget) return;
  state.findWidget.query = q;
  recomputeFindMatches(paneId);
  renderFindWidgetOnly(paneId);
  if (state.findWidget.matches.length) selectFindMatch(paneId);
}
function toggleFindOpt(paneId, opt) {
  if (!state.findWidget) return;
  state.findWidget[opt] = !state.findWidget[opt];
  recomputeFindMatches(paneId);
  render();
}
function toggleReplaceRow(paneId) {
  if (!state.findWidget) return;
  state.findWidget.showReplace = !state.findWidget.showReplace;
  render();
  document.getElementById(`find-input-${paneId}`)?.focus();
}
function renderFindWidgetOnly(paneId) {
  const pane = document.querySelector(`.editor-pane[data-pane="${paneId}"] .editor-body`);
  if (!pane) return;
  let widget = pane.querySelector('.find-widget');
  const html = renderFindWidget(paneId);
  if (!html) { if (widget) widget.remove(); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  if (widget) widget.replaceWith(tmp.firstElementChild);
  else pane.appendChild(tmp.firstElementChild);
  const input = document.getElementById(`find-input-${paneId}`);
  if (input && document.activeElement !== input) { /* leave focus alone if user is elsewhere */ }
}
function findNav(paneId, dir) {
  const fw = state.findWidget;
  if (!fw || !fw.matches.length) return;
  fw.idx = (fw.idx + dir + fw.matches.length) % fw.matches.length;
  selectFindMatch(paneId);
  renderFindWidgetOnly(paneId);
}
function selectFindMatch(paneId) {
  const fw = state.findWidget;
  const ta = paneTextareaEl(paneId);
  if (!fw || !ta || !fw.matches.length) return;
  const m = fw.matches[fw.idx];
  ta.focus();
  ta.setSelectionRange(m.from, m.to);
  const lineH = getLineH();
  const before = ta.value.slice(0, m.from);
  const line = before.split('\n').length;
  const sc = document.getElementById(paneScrollId(paneId));
  if (sc) sc.scrollTop = Math.max(0, (line - 5) * lineH);
}
function findReplaceOne(paneId) {
  const fw = state.findWidget;
  const path = paneIdToPath(paneId);
  const ta = paneTextareaEl(paneId);
  if (!fw || !ta || !fw.matches.length) return;
  const m = fw.matches[fw.idx];
  replaceRange(ta, m.from, m.to, fw.replace);
  state.files[path].content = ta.value;
  markModified(path);
  recomputeFindMatches(paneId);
  refreshPaneHighlight(path);
  if (fw.matches.length) selectFindMatch(paneId);
  renderFindWidgetOnly(paneId);
  scheduleAutoSave();
}
function findReplaceAll(paneId) {
  const fw = state.findWidget;
  const path = paneIdToPath(paneId);
  const ta = paneTextareaEl(paneId);
  if (!fw || !ta || !fw.matches.length) return;
  let content = state.files[path].content;
  const sorted = [...fw.matches].sort((a, b) => b.from - a.from);
  for (const m of sorted) content = content.slice(0, m.from) + fw.replace + content.slice(m.to);
  const count = fw.matches.length;
  state.files[path].content = content;
  ta.value = content;
  markModified(path);
  refreshPaneHighlight(path);
  recomputeFindMatches(paneId);
  renderFindWidgetOnly(paneId);
  showToast(`Replaced ${count} occurrence${count === 1 ? '' : 's'}`, 'success');
  scheduleAutoSave();
}
function handleFindInputKey(e, paneId) {
  if (e.key === 'Enter') { e.preventDefault(); findNav(paneId, e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape') { e.preventDefault(); closeFindWidget(); }
}

/* ════════════════════════════════════════════════════════════
   CONTEXT MENU
════════════════════════════════════════════════════════════ */
function showContextMenu(e, path, isFolder) {
  e.preventDefault();
  e.stopPropagation();
  state.contextMenu = {x: e.clientX, y: e.clientY, path, isFolder};
  render();
}
function renderContextMenu() {
  const cm = state.contextMenu;
  if (!cm) return '';
  const items = [];
  if (!cm.isFolder) items.push(['Open', `openFile('${escAttr(cm.path)}')`]);
  items.push(['New File Here', `startCreate('file','${escAttr(cm.isFolder ? cm.path : pathDir(cm.path))}')`]);
  items.push(['New Folder Here', `startCreate('folder','${escAttr(cm.isFolder ? cm.path : pathDir(cm.path))}')`]);
  items.push(['Rename', `startRename('${escAttr(cm.path)}')`]);
  items.push(['Delete', `deleteFilePath('${escAttr(cm.path)}')`, 'danger']);
  if (!cm.isFolder) {
    items.push(['Copy Path', `copyToClipboard('${escAttr(cm.path)}')`]);
    items.push(['Reveal in New Split', `revealInSplit('${escAttr(cm.path)}')`]);
  }
  const vw = window.innerWidth, vh = window.innerHeight;
  const left = Math.min(cm.x, vw - 200);
  const top = Math.min(cm.y, vh - items.length * 32 - 16);
  return `<div class="ctx-menu" style="left:${left}px;top:${top}px" onclick="event.stopPropagation()">
    ${items.map(([label, action, cls]) => `<div class="ctx-item ${cls || ''}" onclick="${action};state.contextMenu=null;render()">${esc(label)}</div>`).join('')}
  </div>`;
}
function copyToClipboard(text) {
  navigator.clipboard?.writeText(text).then(() => showToast('Copied', 'success')).catch(() => {});
}
function revealInSplit(path) {
  if (state.splitPanes.length >= MAX_SPLIT_PANES) { showToast(`Up to ${MAX_SPLIT_PANES + 1} panes at once`, 'info'); return; }
  if (state.splitPanes.length === 0) state.splitOrientation = 'row';
  state.splitPanes.push({path, flex: 1});
  render();
}

function renderQuickOpen() {

  if (!qo) return '';
  return `<div class="modal-backdrop" onclick="closeQuickOpen()">
    <div class="quick-open" onclick="event.stopPropagation()">
      <input id="quick-open-input" class="quick-open-input" placeholder="Go to file…" value="${escAttr(qo.query)}"
        oninput="updateQuickOpenQuery(this.value)"
        onkeydown="handleQuickOpenKey(event)" />
      <div class="quick-open-results" id="quick-open-results">${renderQuickOpenResults()}</div>
    </div>
  </div>`;
}
function renderQuickOpenResults() {
  const qo = state.quickOpen;
  if (!qo) return '';
  if (!qo.results.length) return `<div class="ftree-empty">No matching files</div>`;
  return qo.results.map((p, i) => `
    <div class="quick-open-item ${i === qo.idx ? 'active' : ''}" onmousemove="state.quickOpen.idx=${i};renderQuickOpenResultsOnly()" onclick="openFile('${escAttr(p)}');closeQuickOpen()">
      ${getIcon(pathBase(p))}<span>${esc(pathBase(p))}</span><span class="quick-open-dir">${esc(pathDir(p))}</span>
    </div>`).join('');
}
function renderQuickOpenResultsOnly() {
  const el = document.getElementById('quick-open-results');
  if (el) el.innerHTML = renderQuickOpenResults();
}
function handleQuickOpenKey(e) {
  const qo = state.quickOpen;
  if (!qo) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); qo.idx = Math.min(qo.idx + 1, qo.results.length - 1); renderQuickOpenResultsOnly(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); qo.idx = Math.max(qo.idx - 1, 0); renderQuickOpenResultsOnly(); }
  else if (e.key === 'Enter') { e.preventDefault(); confirmQuickOpen(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeQuickOpen(); }
}

/* ════════════════════════════════════════════════════════════
   DRAW / ANNOTATE MODE
════════════════════════════════════════════════════════════ */
function toggleDraw() {
  state.drawMode = !state.drawMode;
  render();
  if (state.drawMode) setupDrawCanvas();
}
function renderDrawToolbar() {
  if (!state.drawMode) return '';
  return `<div class="draw-toolbar" id="draw-toolbar">
    <button class="draw-act ${state.drawTool === 'pen' ? 'active-tool' : ''}" onclick="state.drawTool='pen';render()">${svgPen()}</button>
    <button class="draw-act ${state.drawTool === 'eraser' ? 'active-tool' : ''}" onclick="state.drawTool='eraser';render()">Eraser</button>
    <input type="color" value="${state.drawColor}" onchange="state.drawColor=this.value" />
    <input type="range" min="1" max="20" value="${state.drawSize}"
      oninput="state.drawSize=parseInt(this.value);this.previousElementSibling.nextElementSibling.textContent='Size: '+state.drawSize+'px'" />
    <span>Size: ${state.drawSize}px</span>
    <button class="draw-act" onclick="state.drawings=[];replayDraw()">Clear</button>
    <button class="draw-act draw-exit" onclick="toggleDraw()">Exit Draw</button>
  </div>`;
}
function setupDrawCanvas() {
  let canvas = document.getElementById('draw-canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'draw-canvas';
    canvas.className = 'draw-canvas';
    document.querySelector('.editor-area')?.appendChild(canvas);
  }
  const resize = () => {
    const area = document.querySelector('.editor-area');
    if (!area) return;
    canvas.width = area.clientWidth;
    canvas.height = area.clientHeight;
    replayDraw();
  };
  resize();
  window.addEventListener('resize', resize);
  const ctx = canvas.getContext('2d');
  let drawing = false;
  canvas.addEventListener('mousedown', e => {
    drawing = true;
    state.drawings.push({tool: state.drawTool, color: state.drawColor, size: state.drawSize, points: [[e.offsetX, e.offsetY]]});
  });
  canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    state.drawings[state.drawings.length - 1].points.push([e.offsetX, e.offsetY]);
    replayDraw();
  });
  window.addEventListener('mouseup', () => { drawing = false; });
}
function replayDraw() {
  const canvas = document.getElementById('draw-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const stroke of state.drawings) {
    ctx.strokeStyle = stroke.tool === 'eraser' ? 'rgba(0,0,0,1)' : stroke.color;
    ctx.globalCompositeOperation = stroke.tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.lineWidth = stroke.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    stroke.points.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ════════════════════════════════════════════════════════════
   STATUS BAR
════════════════════════════════════════════════════════════ */
function renderStatusBar() {
  const path = activePanePath();
  const file = path ? state.files[path] : null;
  const ta = activePaneTextarea();
  let line = 1, col = 1;
  if (ta && file) {
    const before = ta.value.slice(0, ta.selectionStart);
    const lines = before.split('\n');
    line = lines.length;
    col = lines[lines.length - 1].length + 1;
  }
  const diagCount = path ? (state.diagnostics[path] || []).length : 0;
  const errCount = path ? (state.diagnostics[path] || []).filter(d => d.severity === 'error').length : 0;
  const aiLoading = path && state.aiLoadingPaths[path];
  const diagRunning = path && state.diagRunning[path];
  return `
    <span class="ss-item">${state.connectedDirName ? '📁 ' + esc(state.connectedDirName) : (FS_ACCESS_SUPPORTED ? 'No folder connected' : 'Import-only browser')}</span>
    ${file ? `<span class="ss-item">Ln ${line}, Col ${col}</span>` : ''}
    ${file ? `<span class="ss-item ss-clickable" onclick="state.langPicker=true;render()">${esc(file.language)}</span>` : ''}
    ${errCount ? `<span class="ss-item ss-err">● ${errCount}</span>` : (diagCount ? `<span class="ss-item ss-warn">● ${diagCount}</span>` : '')}
    ${diagRunning ? `<span class="ss-item">Analyzing…</span>` : ''}
    ${aiLoading ? `<span class="ss-item">AI…</span>` : ''}
    <span class="ss-spacer"></span>
    <span class="ss-item" id="ss-time">${new Date().toLocaleTimeString()}</span>
    <span class="ss-item ss-clickable" onclick="state.editorZoom=1;applyZoom()" title="Reset Zoom">${Math.round(state.editorZoom * 100)}%</span>
  `;
}
function renderStatusBarOnly() {
  const el = document.getElementById('status-bar');
  if (el) el.innerHTML = renderStatusBar();
}
/* ════════════════════════════════════════════════════════════
   TOP-LEVEL RENDER
   Every piece is a single-level `${renderX()}` call — see the
   note at the top of 07a-render-shell.js for why that matters.
════════════════════════════════════════════════════════════ */
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = `
    ${renderTitleBar()}
    <div class="main-body">
      ${renderActivityBar()}
      ${renderSidebar()}
      <div class="editor-column">
        ${renderTabBar()}
        ${renderEditorArea()}
        ${renderQuickFixPanel()}
      </div>
    </div>
    ${renderBottomPanel()}
    <div class="statusbar" id="status-bar">${renderStatusBar()}</div>
    ${renderContextMenu()}
    ${renderDrawToolbar()}
    ${renderQuickOpen()}
    ${renderLangPicker()}
  `;
  // Synchronous, deliberately: `innerHTML =` above has already updated the DOM by
  // the time this line runs (it is not asynchronous), so every element created by
  // this render is queryable right now. Deferring this setup via setTimeout(...,0)
  // used to open a real race: a caller who focuses/types into a freshly-rendered
  // element (e.g. the new-file-name input) immediately after calling render() could
  // do so before the deferred callback ran, losing keystrokes sent before focus
  // landed. Running synchronously closes that window entirely.
  attachAllPanes();
  setupSidebarResize();
  setupBottomResize();
  if (state.showBottom && state.activeBottomPanel === 'terminal') setupTerminalInput();
  if (state.drawMode) setupDrawCanvas();
  if (state.contextMenu) {
    document.addEventListener('click', () => { if (state.contextMenu) { state.contextMenu = null; render(); } }, {once: true});
  }
}

/* ════════════════════════════════════════════════════════════
   PANE ATTACHMENT — every textarea, one code path
════════════════════════════════════════════════════════════ */
function attachAllPanes() {
  for (const id of getAllPaneIds()) attachPane(id);
  setupPaneDividers();
}
function attachPane(paneId) {
  const ta = paneTextareaEl(paneId);
  if (!ta) return;
  ta.addEventListener('focus', () => { state.focusedPaneId = paneId; renderStatusBarOnly(); });
  ta.addEventListener('input', () => updateHighlight(paneId));
  ta.addEventListener('keydown', e => handlePaneKeydown(e, paneId));
  ta.addEventListener('keyup', e => { if (e.key !== 'Tab') handlePaneCursorActivity(paneId); });
  ta.addEventListener('click', e => { handlePaneCursorActivity(paneId); handlePaneMouseClick(paneId, e); });
  ta.addEventListener('mousemove', e => handlePaneMouseMove(paneId, e));
  ta.addEventListener('mouseleave', handlePaneMouseLeave);
  const sc = document.getElementById(paneScrollId(paneId));
  const gutter = document.getElementById(paneGutterId(paneId));
  if (sc && gutter) sc.addEventListener('scroll', () => { gutter.scrollTop = sc.scrollTop; });
  updateBracketMatch(paneId);
}
function handlePaneCursorActivity(paneId) {
  updateBracketMatch(paneId);
  if (state.focusedPaneId === paneId) renderStatusBarOnly();
}

/* The one place a keystroke's *content* change gets applied to state and
   propagated — every pane funnels through here, whether the change came
   from real typing or from a programmatic insertAtCaret/replaceRange call
   (both dispatch a real 'input' event, so this fires either way). */
function updateHighlight(paneId) {
  const path = paneIdToPath(paneId);
  const ta = paneTextareaEl(paneId);
  if (!path || !ta || !state.files[path]) return;
  const file = state.files[path];
  file.content = ta.value;
  markModified(path);

  const hl = document.getElementById(paneHlId(paneId));
  const gutter = document.getElementById(paneGutterId(paneId));
  const sug = state.aiSuggestions[path];
  if (hl) hl.innerHTML = buildHighlight(file.content, file.language, sug?.text, sug?.pos);
  if (gutter) {
    const inner = gutter.querySelector('.gutter-inner');
    if (inner) {
      const n = file.content.split('\n').length;
      inner.innerHTML = Array.from({length: n}, (_, i) => `<div class="gutter-line">${i + 1}</div>`).join('');
    }
  }
  updateBracketMatch(paneId);
  renderDecorationLayer(paneId);
  renderStatusBarOnly();
  scheduleAutoSave();
  scheduleDiagnostics(path);
  scheduleAI(path, file.content, file.language, ta.selectionStart);
  updatePreview();
  if (state.findWidget && state.findWidget.paneId === paneId) {
    recomputeFindMatches(paneId);
    renderFindWidgetOnly(paneId);
  }
}

function scheduleAutoSave() {
  if (!state.autoSave) return;
  clearTimeout(scheduleAutoSave._t);
  scheduleAutoSave._t = setTimeout(() => saveState(), 1200);
}

/* ── Bracket-match decoration ── */
function updateBracketMatch(paneId) {
  const ta = paneTextareaEl(paneId);
  const path = paneIdToPath(paneId);
  const layer = document.getElementById(`bracket-match-${paneId}`);
  if (!layer) return;
  layer.innerHTML = '';
  if (!ta || !path || !state.files[path]) return;
  const m = findMatchingBracket(ta.value, ta.selectionStart);
  if (!m) return;
  const charW = getCharW(), lineH = getLineH(), pad = getPad();
  for (const pos of [m.from, m.to]) {
    const before = ta.value.slice(0, pos);
    const lines = before.split('\n');
    const line = lines.length - 1;
    const col = lines[lines.length - 1].length;
    const el = document.createElement('div');
    el.className = 'bracket-match-box';
    el.style.cssText = `top:${pad + line * lineH}px;left:${pad + col * charW}px;width:${charW}px;height:${lineH}px;`;
    layer.appendChild(el);
  }
}

/* ════════════════════════════════════════════════════════════
   PANE KEYDOWN — Tab/Enter/comment/find/save/zoom/brackets, all
   funneled through the tested editor-core functions.
════════════════════════════════════════════════════════════ */
function handlePaneKeydown(e, paneId) {
  const ta = e.target;
  const path = paneIdToPath(paneId);
  if (!path || !state.files[path]) return;
  const file = state.files[path];
  const mod = e.ctrlKey || e.metaKey;

  if (e.key === 'Escape') {
    if (state.aiSuggestions[path]) { delete state.aiSuggestions[path]; refreshPaneHighlight(path); e.preventDefault(); return; }
    if (state.findWidget && state.findWidget.paneId === paneId) { e.preventDefault(); closeFindWidget(); return; }
    return;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!e.shiftKey && state.aiSuggestions[path]) { acceptAI(paneId); return; }
    handleTabKey(ta, e.shiftKey);
    return;
  }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(path); return; }
  if (mod && e.key === '/') { e.preventDefault(); handleCommentToggle(ta, file.language); return; }
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); openFindWidget(paneId, false); return; }
  if (mod && e.key.toLowerCase() === 'h') { e.preventDefault(); openFindWidget(paneId, true); return; }
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); selectNextOccurrence(ta); updateBracketMatch(paneId); return; }
  if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomStep(0.1); return; }
  if (mod && e.key === '-') { e.preventDefault(); zoomStep(-0.1); return; }
  if (mod && e.key === '0') { e.preventDefault(); state.editorZoom = 1; applyZoom(); return; }
  if (mod && e.key === '.') {
    e.preventDefault();
    const diags = state.diagnostics[path] || [];
    if (diags.length) {
      const before = ta.value.slice(0, ta.selectionStart);
      const curLine = before.split('\n').length;
      const nearest = diags.slice().sort((a, b) => Math.abs(a.line - curLine) - Math.abs(b.line - curLine))[0];
      showQuickFix(paneId, nearest.line, nearest);
    }
    return;
  }
  if (e.key === 'Enter' && !mod) { e.preventDefault(); handleEnterKey(ta, file.language); return; }
  if (e.key === 'Home') { e.preventDefault(); handleHomeKey(ta, e.shiftKey); return; }
  if (e.key === 'Backspace' && !mod) {
    if (handlePairedBackspace(ta)) { e.preventDefault(); return; }
    return;
  }
  if (!mod && !e.altKey && e.key.length === 1 && (BRACKET_PAIRS[e.key] || CLOSERS.has(e.key) || QUOTE_CHARS.has(e.key))) {
    if (handleAutoClose(ta, e.key)) { e.preventDefault(); return; }
    return;
  }
}

/* ════════════════════════════════════════════════════════════
   ZOOM — direct DOM patch, no full re-render (keeps focus/scroll)
════════════════════════════════════════════════════════════ */
function zoomStep(delta) {
  state.editorZoom = clamp(Math.round((state.editorZoom + delta) * 10) / 10, 0.5, 2.5);
  applyZoom();
}
function applyZoom() {
  cachedCharW = null;
  const fz = (14 * state.editorZoom).toFixed(1) + 'px';
  const lh = Math.round(21 * state.editorZoom) + 'px';
  for (const id of getAllPaneIds()) {
    [document.getElementById(paneGutterId(id)), document.getElementById(paneHlId(id)), paneTextareaEl(id)].forEach(el => {
      if (el) { el.style.fontSize = fz; el.style.lineHeight = lh; }
    });
    renderDecorationLayer(id);
    updateBracketMatch(id);
  }
  renderStatusBarOnly();
  saveState();
}

/* ════════════════════════════════════════════════════════════
   RESIZE HANDLES — sidebar width, bottom panel height
════════════════════════════════════════════════════════════ */
function setupSidebarResize() {
  const handle = document.getElementById('sidebar-resize');
  const sidebar = document.getElementById('sidebar-el');
  if (!handle || !sidebar) return;
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = sidebar.getBoundingClientRect().width;
    function mv(ev) {
      const w = clamp(startW + (ev.clientX - startX), 160, 500);
      state.sidebarWidth = w;
      sidebar.style.width = w + 'px';
    }
    function up() {
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
      saveState();
    }
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
}
function setupBottomResize() {
  const handle = document.getElementById('bottom-resize');
  const panel = document.getElementById('bottom-panel');
  if (!handle || !panel) return;
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    const startY = e.clientY;
    const startH = panel.getBoundingClientRect().height;
    function mv(ev) {
      const h = clamp(startH - (ev.clientY - startY), 120, Math.round(window.innerHeight * 0.75));
      state.bottomHeight = h;
      panel.style.height = h + 'px';
    }
    function up() {
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
      saveState();
    }
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
}

/* ════════════════════════════════════════════════════════════
   TERMINAL INPUT WIRING — history (Up/Down), Tab-complete, Enter
════════════════════════════════════════════════════════════ */
function setupTerminalInput() {
  const input = document.getElementById('terminal-input');
  if (!input) return;
  input.value = state.terminalInput;
  input.focus();
  input.addEventListener('input', () => { state.terminalInput = input.value; });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      runCommand(input.value);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const hist = state.terminalCmdHistory;
      if (!hist.length) return;
      state.terminalHistIdx = state.terminalHistIdx === null ? hist.length - 1 : Math.max(0, state.terminalHistIdx - 1);
      input.value = hist[state.terminalHistIdx];
      state.terminalInput = input.value;
      requestAnimationFrame(() => input.setSelectionRange(input.value.length, input.value.length));
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      const hist = state.terminalCmdHistory;
      if (state.terminalHistIdx === null) return;
      state.terminalHistIdx++;
      if (state.terminalHistIdx >= hist.length) { state.terminalHistIdx = null; input.value = ''; }
      else input.value = hist[state.terminalHistIdx];
      state.terminalInput = input.value;
    } else if (e.key === 'Tab') {
      e.preventDefault();
      input.value = completeTerminalInput(input.value);
      state.terminalInput = input.value;
      requestAnimationFrame(() => input.setSelectionRange(input.value.length, input.value.length));
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault();
      state.terminalHistory = [];
      render();
    }
  });
}

/* ════════════════════════════════════════════════════════════
   GLOBAL SHORTCUTS
   Only binds keys browsers actually let a page override. Ctrl+N /
   Ctrl+W / Ctrl+T are hard-reserved by Chrome, Safari and Edge —
   the keydown event for them isn't even delivered to page JS, so
   binding "New File" to Ctrl+N would silently open a new browser
   window instead. Those actions live on toolbar/sidebar buttons
   only. Ctrl+P is inconsistently reserved (blocked in some
   browsers, like Edge, for Print); Ctrl+K is the reliable
   Quick Open trigger, with Ctrl+P wired too since it works in
   enough browsers to be worth it.
════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key.toLowerCase() === 'k' || e.key.toLowerCase() === 'p')) {
    e.preventDefault();
    if (state.quickOpen) closeQuickOpen(); else openQuickOpen();
    return;
  }
  if (mod && e.key.toLowerCase() === 'b' && !e.shiftKey) {
    e.preventDefault();
    state.showSidebar = !state.showSidebar;
    render();
    return;
  }
  if (mod && e.key === '`') {
    e.preventDefault();
    if (state.showBottom && state.activeBottomPanel === 'terminal') {
      state.showBottom = false;
    } else {
      state.showBottom = true;
      state.activeBottomPanel = 'terminal';
    }
    render(); // synchronous — already focuses the terminal input itself when it becomes the visible tab
    return;
  }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    setActivePanel('search');
    return;
  }
  if (e.key === 'Escape') {
    if (state.quickOpen) { closeQuickOpen(); return; }
    if (state.langPicker) { state.langPicker = false; render(); return; }
    if (state.contextMenu) { state.contextMenu = null; render(); return; }
    if (state.quickFixPanel) { dismissQuickFix(); return; }
  }
});
window.addEventListener('resize', () => { cachedCharW = null; });

/* ════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════ */
(async function init() {
  await loadState();
  render();
  setTimeout(() => {
    if (state.connectedDirName && !state.dirHandle) {
      showToast(`Click "Reconnect" to resume saving to "${state.connectedDirName}"`, 'info');
    }
  }, 800);
})();
</script>
</body>
</html>
