<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Code — PhineX Group</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=Orbitron:wght@700;900&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d30;--bg4:#333333;
  --sidebar:#252526;--activity:#333333;--tab-bg:#2d2d30;--tab-active:#1e1e1e;
  --border:#3c3c3c;--text:#d4d4d4;--muted:#858585;--accent:#39ff14;
  --accent-dim:rgba(57,255,20,0.12);--accent-glow:rgba(57,255,20,0.35);
  --sel:rgba(57,255,20,0.18);
  --kw:#569cd6;--str:#ce9178;--cmt:#6a9955;--fn:#dcdcaa;--num:#b5cea8;
  --type:#4ec9b0;--prop:#9cdcfe;--regex:#d16969;--interp:#e8b339;
  --ghost:#6a7387;
  --status-bg:#007acc;
  --err:#f44747;--warn:#cca700;--info:#3794ff;
  --font:'JetBrains Mono','Fira Code',monospace;
  --display-font:'Orbitron','Exo 2',sans-serif;
}
html,body{height:100%;width:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;}
#app{height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#4a4a4a;border-radius:5px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:#5a5a5a;}

/* ── Title bar ── */
.titlebar{height:38px;flex-shrink:0;background:var(--bg4);border-bottom:1px solid #111;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:12px;}
.tb-left{display:flex;align-items:center;gap:14px;min-width:0;}
.tb-logo{display:flex;align-items:center;gap:6px;font-family:var(--display-font);font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.5px;flex-shrink:0;text-shadow:0 0 8px var(--accent-glow);}
.tb-menu{display:flex;align-items:center;gap:6px;}
.tb-btn{background:transparent;border:1px solid transparent;color:var(--text);font-size:11.5px;padding:5px 9px;border-radius:4px;}
.tb-btn:hover{background:rgba(255,255,255,.08);}
.tb-reconnect{border-color:var(--accent);color:var(--accent);}
.tb-conn{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.tb-center{font-size:11.5px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.tb-right{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.tb-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);border-radius:4px;}
.tb-icon:hover{background:rgba(255,255,255,.1);color:var(--accent);}

/* ── Main body layout ── */
.main-body{flex:1;display:flex;overflow:hidden;min-height:0;}

/* ── Activity bar ── */
.activitybar{width:46px;flex-shrink:0;background:var(--activity);border-right:1px solid #111;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;}
.ab-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);border-radius:6px;position:relative;}
.ab-btn:hover{color:var(--text);}
.ab-btn.active{color:var(--accent);background:var(--accent-dim);}
.ab-badge{position:absolute;top:2px;right:2px;background:var(--err);color:#fff;font-size:9px;line-height:1;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700;}
.ab-spacer{flex:1;}

/* ── Sidebar ── */
.sidebar{flex-shrink:0;background:var(--sidebar);border-right:1px solid #111;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.sidebar-resize-handle{position:absolute;top:0;right:-2px;width:5px;height:100%;cursor:col-resize;z-index:5;}
.sidebar-resize-handle:hover{background:var(--accent-dim);}
.sidebar-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.sidebar-head{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;}
.sidebar-head-acts{display:flex;gap:2px;}
.sidebar-head-acts button{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);border-radius:4px;}
.sidebar-head-acts button:hover{color:var(--text);background:rgba(255,255,255,.08);}

/* ── File tree ── */
.file-tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0;}
.ftree-row{display:flex;align-items:center;height:23px;gap:5px;padding-right:6px;cursor:pointer;font-size:12.5px;white-space:nowrap;position:relative;}
.ftree-row:hover{background:rgba(255,255,255,.06);}
.ftree-row:hover .ftree-hover-acts{display:flex;}
.ftree-file.active{background:var(--accent-dim);color:var(--accent);}
.ftree-folder{font-weight:500;}
.ftree-name{overflow:hidden;text-overflow:ellipsis;flex:1;}
.ftree-chevron{display:flex;color:var(--muted);flex-shrink:0;transition:transform .12s;}
.ftree-chevron.open{transform:rotate(90deg);}
.ftree-dot{width:6px;height:6px;border-radius:50%;background:var(--text);opacity:.6;flex-shrink:0;}
.ftree-err-dot{width:6px;height:6px;border-radius:50%;background:var(--err);flex-shrink:0;}
.ftree-warn-dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex-shrink:0;}
.ftree-hover-acts{display:none;gap:2px;position:absolute;right:4px;background:var(--sidebar);}
.ftree-hover-acts button{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);border-radius:3px;}
.ftree-hover-acts button:hover{color:var(--accent);}
.ftree-rename-input{flex:1;background:var(--bg);border:1px solid var(--accent);color:var(--text);font-size:12.5px;font-family:inherit;padding:1px 4px;border-radius:2px;outline:none;}
.ftree-empty{padding:16px 14px;color:var(--muted);font-size:12px;line-height:1.6;}

/* ── Search panel ── */
.search-box{padding:8px 10px;flex-shrink:0;}
.search-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12.5px;padding:6px 8px;border-radius:4px;outline:none;}
.search-input:focus{border-color:var(--accent);}
.search-results{flex:1;overflow-y:auto;padding:0 4px;}
.search-result-file{margin-bottom:4px;}
.search-result-path{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);padding:4px 6px;font-weight:600;}
.search-count{color:var(--muted);font-weight:400;margin-left:auto;}
.search-match{display:flex;gap:8px;padding:2px 6px 2px 24px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-match:hover{background:rgba(255,255,255,.06);color:var(--text);}
.search-line-no{color:var(--muted);flex-shrink:0;min-width:18px;}
mark{background:var(--accent-dim);color:var(--accent);border-radius:2px;}

/* ── AI Chat panel ── */
.ai-chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:12px;}
.ai-msg{display:flex;flex-direction:column;}
.ai-msg-assistant{padding:8px 10px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid var(--border);}
.ai-msg-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px;}
.ai-msg-user .ai-msg-role{color:var(--accent);}
.ai-msg-text{font-size:12.5px;line-height:1.55;color:var(--text);word-wrap:break-word;}
.ai-code-block{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px;margin:6px 0;overflow-x:auto;font-size:12px;white-space:pre;}
.ai-msg-text code{background:var(--bg);padding:1px 4px;border-radius:3px;font-size:12px;}
.ai-typing{color:var(--accent);letter-spacing:2px;}
.ai-chat-input-row{flex-shrink:0;display:flex;gap:6px;padding:8px;border-top:1px solid var(--border);}
.ai-chat-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12.5px;padding:8px;border-radius:6px;outline:none;resize:none;height:60px;font-family:inherit;}
.ai-chat-input:focus{border-color:var(--accent);}
.ai-chat-input-row button{width:32px;background:var(--accent-dim);border:none;color:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.ai-chat-input-row button:hover{background:var(--accent);color:#000;}

/* ── Problems ── */
.prob-file-group{margin-bottom:2px;}
.prob-file-head{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.prob-file-head:hover{background:rgba(255,255,255,.05);}
.prob-item{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 26px;cursor:pointer;font-size:12px;}
.prob-item:hover{background:rgba(255,255,255,.06);}
.prob-msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.prob-loc{color:var(--muted);flex-shrink:0;font-size:11px;}
.bottom-problems{overflow-y:auto;height:100%;padding:4px 0;}

/* ── Tab bar ── */
.tabbar{flex-shrink:0;display:flex;background:var(--tab-bg);border-bottom:1px solid #111;overflow-x:auto;overflow-y:hidden;}
.tabbar::-webkit-scrollbar{height:3px;}
.tab{display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;height:34px;font-size:12px;color:var(--muted);border-right:1px solid #111;cursor:pointer;white-space:nowrap;flex-shrink:0;position:relative;}
.tab:hover{color:var(--text);}
.tab.active{background:var(--tab-active);color:var(--text);}
.tab.active::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);}
.tab-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;}
.tab-dot{width:7px;height:7px;border-radius:50%;background:var(--text);opacity:.7;flex-shrink:0;}
.tab-close{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);border-radius:3px;flex-shrink:0;}
.tab-close:hover{background:rgba(255,255,255,.15);color:var(--text);}

/* ── Editor column / area / panes ── */
.editor-column{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.editor-area{flex:1;display:flex;overflow:hidden;min-height:0;}
.editor-area.split-column{flex-direction:column;}
.editor-area.split-row{flex-direction:row;}
.editor-pane{display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0;position:relative;background:var(--bg);}
.pane-divider{flex-shrink:0;background:var(--border);position:relative;z-index:4;}
.split-row .pane-divider{width:1px;cursor:col-resize;}
.split-row .pane-divider:hover{background:var(--accent);width:1px;box-shadow:0 0 0 2px var(--accent-dim);}
.split-column .pane-divider{height:1px;cursor:row-resize;}
.split-column .pane-divider:hover{background:var(--accent);box-shadow:0 0 0 2px var(--accent-dim);}
.pane-header{flex-shrink:0;height:28px;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--tab-bg);border-bottom:1px solid #111;}
.pane-file-select{flex:1;background:transparent;border:none;color:var(--text);font-size:11.5px;outline:none;}
.pane-close{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);border-radius:3px;flex-shrink:0;}
.pane-close:hover{background:rgba(255,255,255,.15);color:var(--text);}
.editor-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:12.5px;}
.image-viewer-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:repeating-conic-gradient(#222 0% 25%, #262626 0% 50%) 50% / 20px 20px;}
.image-viewer{max-width:90%;max-height:90%;object-fit:contain;box-shadow:0 4px 24px rgba(0,0,0,.5);}

/* ── Editor body: gutter + scroll region ── */
.editor-body{flex:1;display:flex;overflow:hidden;min-height:0;position:relative;}
.gutter{flex-shrink:0;width:52px;background:var(--bg);overflow:hidden;position:relative;padding:16px 0 16px 0;text-align:right;color:var(--muted);user-select:none;}
.gutter-inner{position:relative;}
.gutter-line{height:21px;padding-right:12px;font-size:14px;line-height:21px;}
.gutter-err-col{position:absolute;left:0;top:0;bottom:0;width:3px;}
.gutter-err-mark{position:absolute;left:0;width:3px;}
.gutter-err-mark.sev-error{background:var(--err);}
.gutter-err-mark.sev-warning{background:var(--warn);}
.gutter-err-mark.sev-info{background:var(--info);}
.editor-scroll{flex:1;overflow:auto;position:relative;}
.editor-inner{position:relative;width:max-content;min-width:100%;min-height:100%;}
.hl-layer{white-space:pre;padding:16px;font-family:var(--font);color:var(--text);pointer-events:none;min-width:100%;min-height:100%;box-sizing:border-box;}
.ed-textarea{position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:var(--accent);border:none;outline:none;resize:none;white-space:pre;padding:16px;font-family:var(--font);box-sizing:border-box;overflow:hidden;}
.ed-textarea::selection{background:var(--sel);}
.dec-layer{position:absolute;inset:0;pointer-events:none;}
.dec-squiggle{position:absolute;height:3px;background-repeat:repeat-x;background-size:6px 3px;pointer-events:auto;cursor:pointer;}
.dec-squiggle.sev-error{background-image:linear-gradient(135deg,transparent 40%,var(--err) 40%,var(--err) 60%,transparent 60%);}
.dec-squiggle.sev-warning{background-image:linear-gradient(135deg,transparent 40%,var(--warn) 40%,var(--warn) 60%,transparent 60%);}
.dec-squiggle.sev-info{background-image:linear-gradient(135deg,transparent 40%,var(--info) 40%,var(--info) 60%,transparent 60%);}
.bracket-match-layer{position:absolute;inset:0;pointer-events:none;}
.bracket-match-box{position:absolute;border:1px solid var(--muted);border-radius:2px;box-sizing:border-box;background:rgba(255,255,255,.05);}

/* ── Syntax token colors ── */
.tk-kw{color:var(--kw);}
.tk-str{color:var(--str);}
.tk-cmt{color:var(--cmt);font-style:italic;}
.tk-fn{color:var(--fn);}
.tk-num{color:var(--num);}
.tk-type{color:var(--type);}
.tk-prop{color:var(--prop);}
.tk-sel{color:#d7ba7d;}
.tk-regex{color:var(--regex);}
.tk-interp{color:var(--interp);}
.tk-plain{color:var(--text);}
.ghost-text{color:var(--ghost);opacity:.75;}
.ghost-hint{color:var(--ghost);opacity:.5;font-size:10px;font-style:italic;margin-left:4px;}

/* ── Error tooltip ── */
.err-tooltip{display:none;position:fixed;z-index:200;background:#252526;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;max-width:340px;box-shadow:0 4px 16px rgba(0,0,0,.5);line-height:1.5;}
.err-tooltip-head{font-weight:700;font-size:10.5px;letter-spacing:.5px;margin-bottom:3px;text-transform:uppercase;}
.err-tooltip.sev-error .err-tooltip-head{color:var(--err);}
.err-tooltip.sev-warning .err-tooltip-head{color:var(--warn);}
.err-tooltip.sev-info .err-tooltip-head{color:var(--info);}

/* ── Find & Replace widget ── */
.find-widget{position:absolute;top:8px;right:24px;z-index:20;background:#252526;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.5);padding:6px;display:flex;flex-direction:column;gap:4px;}
.find-row{display:flex;align-items:center;gap:4px;}
.find-input{width:180px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12px;padding:5px 7px;border-radius:4px;outline:none;}
.find-input:focus{border-color:var(--accent);}
.find-count{font-size:11px;color:var(--muted);min-width:64px;text-align:center;}
.find-row button{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);border-radius:4px;font-size:11px;font-weight:600;}
.find-row button:hover{background:rgba(255,255,255,.08);color:var(--text);}
.find-row button.active{color:var(--accent);background:var(--accent-dim);}

/* ── Quick fix panel ── */
.quick-fix-panel{flex-shrink:0;background:#252526;border-top:1px solid var(--border);padding:10px 14px;font-size:12.5px;}
.quick-fix-head{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px;}
.quick-fix-head button{margin-left:auto;background:transparent;border:none;color:var(--muted);width:20px;height:20px;border-radius:3px;}
.quick-fix-head button:hover{color:var(--text);background:rgba(255,255,255,.1);}
.quick-fix-loading{color:var(--muted);font-style:italic;}
.quick-fix-explanation{color:var(--muted);margin-bottom:6px;}
.quick-fix-code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px;font-size:12px;overflow-x:auto;margin-bottom:8px;}
.quick-fix-actions{display:flex;gap:8px;}
.btn-primary{background:var(--accent);color:#000;border:none;font-weight:700;padding:6px 14px;border-radius:4px;font-size:12px;}
.btn-primary:hover{filter:brightness(1.1);}
.quick-fix-actions button:not(.btn-primary){background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:4px;font-size:12px;}

/* ── Bottom panel ── */
.bottom-collapsed{flex-shrink:0;border-top:1px solid var(--border);}
.bottom-collapsed button{width:100%;background:transparent;border:none;color:var(--muted);font-size:11.5px;padding:6px;display:flex;align-items:center;justify-content:center;gap:6px;}
.bottom-collapsed button:hover{color:var(--text);}
.bottom-panel{flex-shrink:0;display:flex;flex-direction:column;border-top:1px solid var(--border);background:var(--bg2);position:relative;min-height:100px;}
.bottom-resize-handle{position:absolute;top:-3px;left:0;right:0;height:6px;cursor:row-resize;z-index:5;}
.bottom-resize-handle:hover{background:var(--accent-dim);}
.bottom-tabs{flex-shrink:0;display:flex;align-items:center;height:30px;padding:0 8px;gap:2px;border-bottom:1px solid var(--border);}
.bottom-tab{background:transparent;border:none;color:var(--muted);font-size:11.5px;padding:5px 10px;border-radius:4px;}
.bottom-tab:hover{color:var(--text);}
.bottom-tab.active{color:var(--accent);background:var(--accent-dim);}
.bottom-tabs-spacer{flex:1;}
.bottom-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);border-radius:4px;}
.bottom-icon:hover{color:var(--text);background:rgba(255,255,255,.08);}
.bottom-content{flex:1;overflow:hidden;min-height:0;}

/* ── Terminal ── */
.terminal-panel{height:100%;display:flex;flex-direction:column;font-size:12.5px;}
.terminal-body{flex:1;overflow-y:auto;padding:8px 12px;}
.term-line{white-space:pre-wrap;word-break:break-word;line-height:1.6;color:var(--text);}
.term-line.term-cmd{color:var(--accent);}
.term-line.term-err{color:var(--err);}
.term-line.term-warn{color:var(--warn);}
.terminal-input-row{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:6px 12px 10px;}
.terminal-prompt{color:var(--accent);font-weight:700;flex-shrink:0;}
.terminal-input{flex:1;background:transparent;border:none;color:var(--text);outline:none;font-family:inherit;font-size:12.5px;}

/* ── Status bar ── */
.statusbar{flex-shrink:0;height:24px;background:var(--status-bg);color:#fff;display:flex;align-items:center;padding:0 10px;font-size:11.5px;gap:2px;overflow:hidden;}
.ss-item{padding:0 8px;white-space:nowrap;opacity:.95;}
.ss-clickable{cursor:pointer;border-radius:3px;}
.ss-clickable:hover{background:rgba(255,255,255,.18);}
.ss-err{color:#ffb3b3;}
.ss-warn{color:#ffe4a3;}
.ss-spacer{flex:1;}

/* ── Context menu ── */
.ctx-menu{position:fixed;z-index:300;background:#252526;border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.5);padding:4px;min-width:170px;}
.ctx-item{padding:7px 12px;font-size:12.5px;border-radius:4px;cursor:pointer;}
.ctx-item:hover{background:var(--accent-dim);color:var(--accent);}
.ctx-item.danger:hover{background:rgba(244,71,71,.15);color:var(--err);}

/* ── Modal backdrop (Quick Open / Language picker) ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
.quick-open{width:560px;max-width:90vw;background:#252526;border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.6);overflow:hidden;}
.quick-open-input{width:100%;background:var(--bg);border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;padding:12px 14px;outline:none;}
.quick-open-results{max-height:50vh;overflow-y:auto;padding:4px;}
.quick-open-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:12.5px;}
.quick-open-item.active,.quick-open-item:hover{background:var(--accent-dim);}
.quick-open-item span:first-of-type{flex-shrink:0;}
.quick-open-dir{margin-left:auto;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.lang-picker{width:220px;max-height:50vh;overflow-y:auto;background:#252526;border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.6);padding:4px;}
.lang-picker-item{padding:8px 12px;font-size:12.5px;border-radius:5px;cursor:pointer;text-transform:capitalize;}
.lang-picker-item:hover{background:rgba(255,255,255,.08);}
.lang-picker-item.active{color:var(--accent);background:var(--accent-dim);}

/* ── Draw mode ── */
.draw-canvas{position:absolute;inset:0;z-index:15;cursor:crosshair;}
.draw-toolbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:16;background:#252526;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:12px;}
.draw-act{background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:5px;font-size:11.5px;display:flex;align-items:center;gap:5px;}
.draw-act:hover{background:rgba(255,255,255,.08);}
.draw-act.active-tool{color:var(--accent);border-color:var(--accent);background:var(--accent-dim);}
.draw-exit{border-color:var(--err);color:var(--err);}
.draw-toolbar input[type=color]{width:26px;height:26px;border:none;background:none;padding:0;border-radius:4px;overflow:hidden;}
.draw-toolbar input[type=range]{width:80px;}

/* ── Toast ── */
.xc-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:500;background:#252526;border:1px solid var(--border);color:var(--text);font-size:12.5px;padding:10px 18px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.55);}
.xc-toast-success{border-color:var(--accent);color:var(--accent);}
.xc-toast-error{border-color:var(--err);color:var(--err);}

@media (max-width:760px){
  .sidebar{position:absolute;top:38px;bottom:0;left:46px;z-index:50;box-shadow:8px 0 24px rgba(0,0,0,.5);}
  .tb-menu .tb-btn:not(:first-child){display:none;}
  .tb-conn{max-width:80px;}
}

<body>
<div id="app"></div>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════════════════ */
const AI_EP = 'https://xcode.ahmedelgoharymessi.workers.dev/';
const DB_NAME = 'xcode-db';
const DB_STORE = 'kv';
const DB_VERSION = 1;
const MAX_SPLIT_PANES = 3; // + primary = up to 4-way split

/* ════════════════════════════════════════════════════════════
   INDEXEDDB KEY/VALUE STORE
   Replaces localStorage (5-10MB ceiling, synchronous, silently
   drops writes on quota errors) with IndexedDB, which comfortably
   holds large multi-file workspaces (including embedded images)
   and can store real FileSystemHandle objects for reconnecting to
   an on-disk folder between sessions.
════════════════════════════════════════════════════════════ */
let _dbPromise = null;
function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('no-indexeddb')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}

async function idbGet(key) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const rq = tx.objectStore(DB_STORE).get(key);
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  } catch (e) { return undefined; }
}

async function idbSet(key, value) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}

async function idbDel(key) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}

/* ════════════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════════════ */
const DEFAULT_STATE = {
  files: {},
  openTabs: [],
  activeTab: null,
  fileTree: [],
  expandedFolders: [],
  autoSave: true,
  activePanel: 'explorer',
  showSidebar: true,
  showBottom: true,
  bottomHeight: 220,
  activeBottomPanel: 'terminal',
  searchQuery: '',
  searchResults: [],
  searchIdx: 0,
  drawMode: false,
  drawTool: 'pen',
  drawColor: '#39ff14',
  drawSize: 3,
  editorZoom: 1,
  splitPanes: [],          // [{path}] — up to MAX_SPLIT_PANES extra panes beside the primary editor
  splitOrientation: 'row',  // 'row' (side-by-side) | 'column' (stacked)
  mainPaneFlex: 1,
  sidebarWidth: 250,
  terminalHistory: [{text: 'X Code Terminal — type "help" for commands', cmd: false}],
  terminalCwd: '',
  terminalCmdHistory: [],
  modified: {},
  theme: {bg: '#1e1e1e', accent: '#39ff14', status: '#007acc'},
  aiChatHistory: [],
  diagnostics: {},
  diagCollapsed: {},
  problemsFilter: '',
  diagRunning: {},
  workspaceName: ''
};
// getDefaultState() returns a brand-new object graph every call. DEFAULT_STATE
// itself must never be spread directly — {...DEFAULT_STATE} only copies the top
// level, so every "fresh" state would still share the SAME nested files/history/
// theme objects by reference, and mutating one (e.g. terminalCmdHistory.push(...))
// would silently corrupt every other "fresh" state, including DEFAULT_STATE itself.
function getDefaultState() {
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

let state = getDefaultState();
let stateLoaded = false;

function freshRuntimeState() {
  // Runtime-only fields, never persisted, reset every load.
  state.contextMenu = null;
  state.aiSuggestions = {};      // path -> {text, pos}
  state.aiLoadingPaths = {};     // path -> bool
  state.drawings = state.drawings || [];
  state.previewWin = null;
  state.terminalInput = '';
  state.terminalHistIdx = null;
  state.creatingIn = null;
  state.renamingPath = null;
  state.newItemName = '';
  state.quickFixPanel = null;
  state.aiChatLoading = false;
  state.aiChatInput = '';
  state.aiPopup = null;
  state.quickOpen = null;        // {query, results, idx}
  state.findWidget = null;       // {paneId, query, replace, showReplace, matchCase, wholeWord, matches, idx}
  state.focusedPaneId = 'main';
  state.langPicker = false;
  state.toast = null;
  state.pyodideStatus = 'idle';  // idle | loading | ready | error
  state.connectedDirName = state.connectedDirName || null;
}

async function loadState() {
  let loaded = null;
  try {
    loaded = await idbGet('workspace');
  } catch (e) {}
  if (!loaded) {
    // migrate legacy localStorage save, if present, then drop it
    try {
      const legacy = localStorage.getItem('xcode-v4');
      if (legacy) {
        loaded = JSON.parse(legacy);
        localStorage.removeItem('xcode-v4');
      }
    } catch (e) {}
  }
  if (loaded) {
    state = {
      ...getDefaultState(),
      ...loaded,
      expandedFolders: loaded.expandedFolders || [],
      diagnostics: loaded.diagnostics || {},
      aiChatHistory: (loaded.aiChatHistory || []).slice(-30),
      diagCollapsed: loaded.diagCollapsed || {},
      splitPanes: (loaded.splitPanes || []).slice(0, MAX_SPLIT_PANES),
      terminalCmdHistory: (loaded.terminalCmdHistory || []).slice(-100),
      diagRunning: {}
    };
  } else {
    state = getDefaultState();
  }
  freshRuntimeState();
  stateLoaded = true;
}

let _saveQueued = false;
async function saveState() {
  // Debounce bursts of saves (typing, dragging) into one write per animation-ish tick.
  if (_saveQueued) return;
  _saveQueued = true;
  setTimeout(async () => {
    _saveQueued = false;
    try {
      const s = {
        files: state.files,
        openTabs: state.openTabs,
        activeTab: state.activeTab,
        fileTree: state.fileTree,
        expandedFolders: Array.from(state.expandedFolders || []),
        autoSave: state.autoSave,
        activePanel: state.activePanel,
        showSidebar: state.showSidebar,
        showBottom: state.showBottom,
        bottomHeight: state.bottomHeight,
        activeBottomPanel: state.activeBottomPanel,
        editorZoom: state.editorZoom,
        splitPanes: state.splitPanes,
        splitOrientation: state.splitOrientation,
        mainPaneFlex: state.mainPaneFlex,
        sidebarWidth: state.sidebarWidth,
        modified: state.modified,
        theme: state.theme,
        aiChatHistory: (state.aiChatHistory || []).slice(-30),
        diagnostics: state.diagnostics,
        diagCollapsed: state.diagCollapsed,
        problemsFilter: state.problemsFilter || '',
        terminalCmdHistory: (state.terminalCmdHistory || []).slice(-100),
        connectedDirName: state.connectedDirName || null,
        workspaceName: state.workspaceName || ''
      };
      const ok = await idbSet('workspace', s);
      if (!ok) showToast('Could not save workspace (storage unavailable)', 'error');
    } catch (e) {
      showToast('Save failed: ' + e.message, 'error');
    }
  }, 400);
}

window.addEventListener('beforeunload', () => { try { saveState(); } catch (e) {} });

/* ════════════════════════════════════════════════════════════
   TOASTS (lightweight, replaces silent failure on save errors)
════════════════════════════════════════════════════════════ */
let _toastTimer = null;
function showToast(msg, kind) {
  state.toast = {msg, kind: kind || 'info'};
  renderToast();
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    state.toast = null;
    renderToast();
  }, 4000);
}
function renderToast() {
  let el = document.getElementById('xc-toast');
  if (!state.toast) {
    if (el) el.remove();
    return;
  }
  if (!el) {
    el = document.createElement('div');
    el.id = 'xc-toast';
    document.body.appendChild(el);
  }
  el.className = 'xc-toast xc-toast-' + state.toast.kind;
  el.textContent = state.toast.msg;
}

/* ════════════════════════════════════════════════════════════
   GENERAL UTILITIES
════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return esc(s).replace(/"/g, '&quot;');
}
function sp(cls, txt) {
  return `<span class="tk-${cls}">${txt}</span>`;
}
function debounce(fn, ms) {
  let t = null;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

/* Insert text at the textarea's caret while preserving native undo/redo
   history where the browser supports it (execCommand is deprecated but
   remains the only way to splice text into a textarea without wiping
   its undo stack — a plain `.value =` assignment clears it outright). */
let _execInsertSupported = null;
function insertAtCaret(ta, text) {
  if (_execInsertSupported === null) {
    try {
      _execInsertSupported = document.queryCommandSupported &&
        document.queryCommandSupported('insertText');
    } catch (e) { _execInsertSupported = false; }
  }
  ta.focus();
  if (_execInsertSupported) {
    try {
      const ok = document.execCommand('insertText', false, text);
      if (ok) return;
    } catch (e) { /* fall through to manual splice */ }
  }
  const s = ta.selectionStart, en = ta.selectionEnd;
  const v = ta.value;
  ta.value = v.slice(0, s) + text + v.slice(en);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.dispatchEvent(new Event('input', {bubbles: true}));
}

/* Replace an explicit range [from,to) with text, preserving undo where possible. */
function replaceRange(ta, from, to, text) {
  ta.focus();
  ta.setSelectionRange(from, to);
  insertAtCaret(ta, text);
}

function pathJoin(dir, name) {
  return dir ? `${dir}/${name}` : name;
}
function pathDir(p) {
  const i = p.lastIndexOf('/');
  return i < 0 ? '' : p.slice(0, i);
}
function pathBase(p) {
  const i = p.lastIndexOf('/');
  return i < 0 ? p : p.slice(i + 1);
}
function normalizeSegments(parts) {
  const out = [];
  for (const seg of parts) {
    if (seg === '' || seg === '.') continue;
    if (seg === '..') { out.pop(); continue; }
    out.push(seg);
  }
  return out;
}
/* Resolve a (possibly relative, possibly absolute) path against cwd, unix-style. */
function resolvePath(cwd, input) {
  if (!input) return cwd;
  const abs = input.startsWith('/');
  const base = abs ? [] : cwd.split('/').filter(Boolean);
  const parts = normalizeSegments(base.concat(input.split('/')));
  return parts.join('/');
}
/* ════════════════════════════════════════════════════════════
   SYNTAX HIGHLIGHTERS
   All tokenizers below do a single left-to-right pass and escape+
   wrap each token as they go — nothing is ever re-scanned with a
   second regex over already-injected HTML. (The previous CSS
   highlighter chained five global regexes, each operating on the
   HTML the last one produced; the moment a selector contained a
   colon — `a:hover`, `@media (max-width:) `, any pseudo-class —
   the "grab everything after this colon" value-regex would swallow
   real <span> markup left by earlier steps and emit mismatched
   tags. Scanning once, left to right, with explicit state
   (in-block vs in-selector, current bracket depth) makes that whole
   bug class structurally impossible instead of patching symptoms.)
════════════════════════════════════════════════════════════ */

const KEYWORDS_JS = new Set('const let var function class if else for while do switch case break continue return import export default from as new this super extends typeof instanceof in of async await try catch finally throw delete void null undefined true false static get set yield interface type enum implements abstract declare readonly namespace module keyof infer satisfies'.split(' '));
const TYPES_JS = new Set('string number boolean object any void never unknown symbol bigint Array Promise Map Set WeakMap WeakSet Object Function Date RegExp Error Symbol BigInt console window document Math JSON parseInt parseFloat isNaN isFinite NaN Infinity fetch setTimeout setInterval clearTimeout clearInterval queueMicrotask globalThis process Buffer URL URLSearchParams FormData Headers Request Response Event EventTarget'.split(' '));

/* ── JavaScript / TypeScript / JSX / TSX — single-pass lexer ── */
function hlJS(raw) {
  let out = '', i = 0;
  const N = raw.length;
  let lastSignificant = ''; // last non-trivial token text, used for regex/division disambiguation

  function isIdentStart(c) { return /[A-Za-z_$]/.test(c); }
  function isIdentPart(c) { return /[\w$]/.test(c); }

  function readIdent(s) {
    let j = s;
    while (j < N && isIdentPart(raw[j])) j++;
    return j;
  }

  function regexAllowedHere() {
    if (!lastSignificant) return true;
    if (/[\w$\])\]]$/.test(lastSignificant)) {
      const kwMatch = lastSignificant.match(/([A-Za-z_$][\w$]*)$/);
      if (kwMatch && KEYWORDS_JS.has(kwMatch[1]) && !['this', 'super', 'true', 'false', 'null', 'undefined'].includes(kwMatch[1])) return true;
      return false;
    }
    return true;
  }

  while (i < N) {
    const c = raw[i];

    if (/\s/.test(c)) { out += c; i++; continue; }

    if (c === '/' && raw[i + 1] === '/') {
      let j = raw.indexOf('\n', i);
      if (j < 0) j = N;
      out += sp('cmt', raw.slice(i, j));
      i = j;
      continue;
    }
    if (c === '/' && raw[i + 1] === '*') {
      let j = raw.indexOf('*/', i + 2);
      j = j < 0 ? N : j + 2;
      out += sp('cmt', raw.slice(i, j));
      i = j;
      continue;
    }
    if (c === '`') {
      const r = readTemplate(raw, i);
      out += r.html;
      i = r.end;
      lastSignificant = '`';
      continue;
    }
    if (c === '"' || c === "'") {
      const q = c;
      let j = i + 1;
      while (j < N && raw[j] !== q) {
        if (raw[j] === '\\') j += 2; else j++;
      }
      j = Math.min(j + 1, N);
      out += sp('str', raw.slice(i, j));
      i = j;
      lastSignificant = q;
      continue;
    }
    if (c === '/' && regexAllowedHere()) {
      let j = i + 1, inClass = false, ok = false;
      while (j < N) {
        const cc = raw[j];
        if (cc === '\\') { j += 2; continue; }
        if (cc === '\n') break;
        if (cc === '[') inClass = true;
        else if (cc === ']') inClass = false;
        else if (cc === '/' && !inClass) { ok = true; j++; break; }
        j++;
      }
      if (ok) {
        let k = j;
        while (k < N && /[a-z]/i.test(raw[k])) k++;
        out += sp('regex', raw.slice(i, k));
        i = k;
        lastSignificant = '/regex/';
        continue;
      }
    }
    if (/\d/.test(c) || (c === '.' && /\d/.test(raw[i + 1] || ''))) {
      let j = i;
      if (raw[j] === '0' && /[xX]/.test(raw[j + 1] || '')) {
        j += 2;
        while (j < N && /[\da-fA-F_]/.test(raw[j])) j++;
      } else if (raw[j] === '0' && /[bB]/.test(raw[j + 1] || '')) {
        j += 2;
        while (j < N && /[01_]/.test(raw[j])) j++;
      } else if (raw[j] === '0' && /[oO]/.test(raw[j + 1] || '')) {
        j += 2;
        while (j < N && /[0-7_]/.test(raw[j])) j++;
      } else {
        while (j < N && /[\d_]/.test(raw[j])) j++;
        if (raw[j] === '.') { j++; while (j < N && /[\d_]/.test(raw[j])) j++; }
        if (/[eE]/.test(raw[j] || '')) {
          j++;
          if (/[+-]/.test(raw[j] || '')) j++;
          while (j < N && /\d/.test(raw[j])) j++;
        }
      }
      if (raw[j] === 'n') j++;
      out += sp('num', raw.slice(i, j));
      i = j;
      lastSignificant = '0';
      continue;
    }
    if (c === '@' && isIdentStart(raw[i + 1] || '')) {
      let j = readIdent(i + 1);
      while (raw[j] === '.') { j = readIdent(j + 1); }
      out += sp('fn', raw.slice(i, j)); // raw is already-escaped input (see highlight()'s dispatcher) — do not re-escape
      i = j;
      lastSignificant = 'x';
      continue;
    }
    if (isIdentStart(c)) {
      const j = readIdent(i);
      const word = raw.slice(i, j);
      let k = j;
      while (k < N && /\s/.test(raw[k])) k++;
      const prevNonWs = (() => {
        let p = i - 1;
        while (p >= 0 && /\s/.test(raw[p])) p--;
        return p >= 0 ? raw[p] : '';
      })();
      if (KEYWORDS_JS.has(word)) {
        out += sp('kw', word);
      } else if (raw[k] === '(') {
        out += sp('fn', esc(word));
      } else if (prevNonWs === '.') {
        out += sp('prop', esc(word));
      } else if (TYPES_JS.has(word)) {
        out += sp('type', word);
      } else {
        out += esc(word);
      }
      i = j;
      lastSignificant = word;
      continue;
    }
    out += c; // raw is already-escaped input; a bare character here is safe as-is (escaping again would double-escape &/</>)
    if (!/\s/.test(c)) lastSignificant = c;
    i++;
  }
  return out;

  function readTemplate(src, start) {
    let j = start + 1, html = spOpen('str') + '`';
    while (j < src.length) {
      const c = src[j];
      if (c === '\\') { html += src.slice(j, j + 2); j += 2; continue; }
      if (c === '`') { html += '`' + spClose(); j++; return {html, end: j}; }
      if (c === '$' && src[j + 1] === '{') {
        html += spClose();
        const start2 = j;
        let depth = 1, k = j + 2;
        while (k < src.length && depth > 0) {
          const cc = src[k];
          if (cc === '{') depth++;
          else if (cc === '}') depth--;
          else if (cc === '`') { const r = readTemplateRaw(src, k); k = r.end - 1; }
          else if (cc === '"' || cc === "'") {
            const q = cc; let m = k + 1;
            while (m < src.length && src[m] !== q) { if (src[m] === '\\') m += 2; else m++; }
            k = m;
          }
          k++;
        }
        const exprSrc = src.slice(start2 + 2, k - 1);
        html += '<span class="tk-interp">${' + hlJS(exprSrc) + '}</span>';
        html += spOpen('str');
        j = k;
        continue;
      }
      html += c;
      j++;
    }
    html += spClose();
    return {html, end: j};
  }
  function readTemplateRaw(src, start) {
    let j = start + 1;
    while (j < src.length) {
      if (src[j] === '\\') { j += 2; continue; }
      if (src[j] === '`') { j++; break; }
      if (src[j] === '$' && src[j + 1] === '{') {
        let depth = 1; j += 2;
        while (j < src.length && depth > 0) {
          if (src[j] === '{') depth++;
          else if (src[j] === '}') depth--;
          j++;
        }
        continue;
      }
      j++;
    }
    return {end: j};
  }
  function spOpen(cls) { return `<span class="tk-${cls}">`; }
  function spClose() { return `</span>`; }
}

/* ── HTML — single-pass tag/text scanner ── */
function hlHTML(raw) {
  if (!raw) return '';
  let out = '', i = 0, N = raw.length;
  while (i < N) {

════════════════════════════════════════════════════════════ */
function buildHighlight(content, language, aiSuggestion, cursorPos) {
  if (!aiSuggestion) return highlight(content, language);

  const after = content.substring(cursorPos);
  const lines = before.split('\n');
  const curLine = lines.length - 1;
  const curCol = lines[curLine].length;
  const allLines = content.split('\n');
  if (curCol < allLines[curLine].length) return highlight(content, language);
  const suggLines = aiSuggestion.split('\n');
  const hlBefore = highlight(before, language);
  const hlAfter = highlight(after, language);
  const firstLine = `<span class="ghost-text">${esc(suggLines[0])}</span>`;
  const restLines = suggLines.length > 1
    ? `<span class="ghost-text">${esc('\n' + suggLines.slice(1, 4).join('\n'))}</span>`
    : '';
  const hint = `<span class="ghost-hint">Tab to accept</span>`;
  return hlBefore + firstLine + restLines + hint + hlAfter;
}

    state.activeTab = path;
    state.focusedPaneId = 'main';

    return;
  }
  if (!state.openTabs.find(t => t.path === path)) {
    state.openTabs.push({path, name: state.files[path].name});
  }

/* ════════════════════════════════════════════════════════════

function startCreate(type, parent) {

  state.newItemName = '';

  render();
  document.getElementById('new-item-input')?.focus();
}

async function confirmCreate() {
  const info = state.creatingIn;
  if (!info) return; // already handled — e.g. a blur event landing after Enter already confirmed it
  const name = (state.newItemName || '').trim();
  if (!name) { state.creatingIn = null; render(); return; }
  const fp = pathJoin(info.parent, name);
  if (info.type === 'folder') {
    const keep = pathJoin(fp, '.keep');
    state.files[keep] = {name: '.keep', path: keep, content: '', language: 'plaintext'};
    if (state.dirHandle) await fsMkdir(fp).catch(() => {});
  } else {
    if (state.files[fp]) { showToast('A file with that name already exists', 'error'); return; }
    state.files[fp] = {name, path: fp, content: '', language: getLang(name)};
    if (state.dirHandle) await fsWriteFile(fp, '').catch(() => {});
  }
  state.fileTree = rebuildTree(state.files);
  state.creatingIn = null;
  if (info.type === 'file') openFile(fp);
  else render();
  saveState();
}

function startRename(path) {
  state.renamingPath = path;
  state.newItemName = pathBase(path);
  render();
  const renameEl = document.getElementById('rename-input');
  if (renameEl) { renameEl.focus(); renameEl.select(); }
}
function cancelRename() { state.renamingPath = null; render(); }

async function confirmRename() {
  const oldPath = state.renamingPath;
  if (!oldPath) return; // already handled — e.g. a blur event landing after Enter already confirmed it
  const newName = (state.newItemName || '').trim();
  if (!newName || newName === pathBase(oldPath)) { state.renamingPath = null; render(); return; }
  const parent = pathDir(oldPath);
  const newPath = pathJoin(parent, newName);

  if (state.files[newPath]) { showToast('A file with that name already exists', 'error'); return; }

  if (isFolderPath(oldPath)) {
    const members = allPathsUnder(oldPath);
    for (const p of members) {
      const rest = p === oldPath ? '' : p.slice(oldPath.length + 1);
      const np = rest ? pathJoin(newPath, rest) : newPath;
      state.files[np] = {...state.files[p], name: pathBase(np), path: np};
      delete state.files[p];
    }
    state.openTabs = state.openTabs.map(t => {
      if (t.path === oldPath || t.path.startsWith(oldPath + '/')) {
        const np = t.path === oldPath ? newPath : newPath + t.path.slice(oldPath.length);
        return {path: np, name: pathBase(np)};
      }
      return t;
    });
    if (state.activeTab && (state.activeTab === oldPath || state.activeTab.startsWith(oldPath + '/'))) {
      state.activeTab = state.activeTab === oldPath ? newPath : newPath + state.activeTab.slice(oldPath.length);
    }
    state.expandedFolders = state.expandedFolders.map(f => f === oldPath || f.startsWith(oldPath + '/') ? (f === oldPath ? newPath : newPath + f.slice(oldPath.length)) : f);
    if (state.dirHandle) await fsRenameFolder(oldPath, newPath).catch(() => {});
  } else {
    if (!state.files[oldPath]) { state.renamingPath = null; render(); return; }
    state.files[newPath] = {...state.files[oldPath], name: newName, path: newPath, language: getLang(newName)};
    delete state.files[oldPath];
    state.openTabs = state.openTabs.map(t => t.path === oldPath ? {path: newPath, name: newName} : t);
    if (state.activeTab === oldPath) state.activeTab = newPath;
    state.splitPanes = state.splitPanes.map(p => p.path === oldPath ? {path: newPath} : p);
    if (state.diagnostics[oldPath]) { state.diagnostics[newPath] = state.diagnostics[oldPath]; delete state.diagnostics[oldPath]; }
    if (state.dirHandle) await fsRenameFile(oldPath, newPath).catch(() => {});
  }
  state.fileTree = rebuildTree(state.files);
  state.renamingPath = null;
  render();
  saveState();
}

async function deleteFilePath(path) {
  const folder = isFolderPath(path);
  const targets = folder ? allPathsUnder(path) : [path];
  if (!folder && !state.files[path]) return;
  const label = folder ? `folder "${pathBase(path)}" and everything in it` : `"${pathBase(path)}"`;
  if (!confirm(`Delete ${label}? This can't be undone.`)) return;

  for (const p of targets) {
    delete state.files[p];
    delete state.diagnostics[p];
    delete state.aiSuggestions[p];
    const idx = state.openTabs.findIndex(t => t.path === p);
    if (idx >= 0) state.openTabs.splice(idx, 1);
    if (state.activeTab === p) state.activeTab = state.openTabs[0]?.path || null;
  }
  state.splitPanes = state.splitPanes.filter(sp => !targets.includes(sp.path));
  state.expandedFolders = state.expandedFolders.filter(f => f !== path);
  state.fileTree = rebuildTree(state.files);
  state.contextMenu = null;

  if (state.dirHandle) {
    if (folder) await fsRemove(path, true).catch(() => {});
    else await fsRemove(path, false).catch(() => {});
  }
  render();
  saveState();
}

function toggleFolder(path) {
  const set = new Set(state.expandedFolders);
  if (set.has(path)) set.delete(path); else set.add(path);
  state.expandedFolders = Array.from(set);
  render();
}

/* ════════════════════════════════════════════════════════════
   FILE SYSTEM ACCESS API — real "Open Folder" / silent Save
   Falls back cleanly (feature-detected, never throws unhandled)
   on browsers without support (Firefox / Safari today).
════════════════════════════════════════════════════════════ */
const FS_ACCESS_SUPPORTED = typeof window !== 'undefined' && 'showDirectoryPicker' in window;

async function fsGetDirHandle(path, opts) {
  if (!state.dirHandle) return null;
  const segs = path.split('/').filter(Boolean);
  let dh = state.dirHandle;
  for (const seg of segs) {
    dh = await dh.getDirectoryHandle(seg, opts);
  }
  return dh;
}
async function fsMkdir(folderPath) {
  await fsGetDirHandle(folderPath, {create: true});
}
async function fsWriteFile(path, content) {
  const dir = pathDir(path);
  const dh = dir ? await fsGetDirHandle(dir, {create: true}) : state.dirHandle;
  const fh = await dh.getFileHandle(pathBase(path), {create: true});
  const writable = await fh.createWritable();
  await writable.write(content);
  await writable.close();
}
async function fsRemove(path, isDir) {
  const dir = pathDir(path);
  const dh = dir ? await fsGetDirHandle(dir, {}) : state.dirHandle;
  await dh.removeEntry(pathBase(path), {recursive: isDir});
}
async function fsRenameFile(oldPath, newPath) {
  const content = state.files[newPath]?.content ?? '';
  await fsWriteFile(newPath, content);
  await fsRemove(oldPath, false).catch(() => {});
}
async function fsRenameFolder(oldPath, newPath) {
  const members = allPathsUnder(newPath); // already renamed in state.files by the caller
  for (const p of members) {
    if (pathBase(p) === '.keep' && !state.files[p].content) continue;
    await fsWriteFile(p, state.files[p].content || '').catch(() => {});
  }
  await fsRemove(oldPath, true).catch(() => {});
}

async function openFolder() {
  if (!FS_ACCESS_SUPPORTED) {
    document.getElementById('folder-input-fallback')?.click();
    return;
  }
  let handle;
  try {
    handle = await window.showDirectoryPicker();
  } catch (e) { return; } // user cancelled
  await importDirectoryHandle(handle);
}

async function importDirectoryHandle(handle) {
  state.dirHandle = handle;
  state.connectedDirName = handle.name;
  const files = {};
  async function walk(dh, prefix) {
    for await (const [name, entry] of dh.entries()) {
      if (name.startsWith('.git') || name === 'node_modules') continue;
      const p = pathJoin(prefix, name);
      if (entry.kind === 'file') {
        const file = await entry.getFile();
        let content;
        if (isImg(name)) content = await blobToDataURL(file);
        else content = await file.text().catch(() => '');
        files[p] = {name, path: p, content, language: getLang(name)};
      } else if (entry.kind === 'directory') {
        await walk(entry, p);
      }
    }
  }
  showToast('Reading folder…', 'info');
  try {
    await walk(handle, '');
  } catch (e) {
    showToast('Could not fully read the folder: ' + e.message, 'error');
  }
  state.files = files;
  state.fileTree = rebuildTree(state.files);
  state.openTabs = [];
  state.activeTab = null;
  state.splitPanes = [];
  const idx = Object.keys(files).find(p => pathBase(p).toLowerCase() === 'index.html') || Object.keys(files)[0];
  try { await idbSet('dirHandle', handle); } catch (e) {}
  if (idx) openFile(idx); else render();
  showToast(`Opened "${handle.name}"`, 'success');
  saveState();
}

async function reconnectWorkspace() {
  let handle;
  try { handle = await idbGet('dirHandle'); } catch (e) {}
  if (!handle) { showToast('No previous folder to reconnect to', 'error'); return; }
  try {
    const perm = await handle.requestPermission({mode: 'readwrite'});
    if (perm !== 'granted') { showToast('Permission denied', 'error'); return; }
  } catch (e) { showToast('Could not reconnect: ' + e.message, 'error'); return; }
  await importDirectoryHandle(handle);
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

/* Fallback for browsers without File System Access API: <input webkitdirectory>. Import-only, one-way. */
async function uploadFolderFallback(fileList) {
  const files = {...state.files};
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split('/');
    const p = parts.slice(1).join('/') || parts[0];
    let content;
    if (isImg(f.name)) content = await blobToDataURL(f);
    else content = await f.text().catch(() => '');
    files[p] = {name: pathBase(p), path: p, content, language: getLang(f.name)};
  }
  state.files = files;
  state.fileTree = rebuildTree(state.files);
  state.dirHandle = null;
  state.connectedDirName = null;
  showToast('Imported (this browser can\'t save straight back to the folder — Ctrl+S will prompt for a location)', 'info');
  render();
  saveState();
}
async function uploadFilesFallback(fileList) {
  const files = {...state.files};
  for (const f of fileList) {
    let content;
    if (isImg(f.name)) content = await blobToDataURL(f);
    else content = await f.text().catch(() => '');
    files[f.name] = {name: f.name, path: f.name, content, language: getLang(f.name)};
  }
  state.files = files;
  state.fileTree = rebuildTree(state.files);
  render();
  saveState();
}

/* ════════════════════════════════════════════════════════════
   SAVE — writes straight back to disk when a handle is known
   (folder connection, or a remembered one-off picker handle);
   never re-prompts for a file it already has a handle for.
════════════════════════════════════════════════════════════ */
function saveActiveFile() {
  const path = activePanePath();
  if (path) saveFile(path);
}
async function saveFile(path) {
  const file = state.files[path];
  if (!file) return;
  if (state.dirHandle) {
    try {
      await fsWriteFile(path, file.content);
      state.modified[path] = false;
      showToast('Saved ' + file.name, 'success');
      renderStatusBarOnly();
      return;
    } catch (e) {
      showToast('Could not save to disk: ' + e.message, 'error');
      return;
    }
  }
  state.looseFileHandles = state.looseFileHandles || {};
  if (FS_ACCESS_SUPPORTED) {
    try {
      let handle = state.looseFileHandles[path];
      if (!handle) {
        handle = await window.showSaveFilePicker({suggestedName: file.name});
        state.looseFileHandles[path] = handle;
      }
      const writable = await handle.createWritable();
      await writable.write(file.content);
      await writable.close();
      state.modified[path] = false;
      showToast('Saved ' + file.name, 'success');
      renderStatusBarOnly();
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      // fall through to blob download as a last resort
    }
  }
  downloadBlob(file.name, file.content);
  state.modified[path] = false;
  showToast('Downloaded ' + file.name + ' (this browser can\'t write directly to disk)', 'info');
  renderStatusBarOnly();
}
function downloadBlob(filename, content) {
  const blob = new Blob([content], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function saveAllFiles() {
  const paths = Object.keys(state.modified).filter(p => state.modified[p] && state.files[p]);
  if (!paths.length) { showToast('Nothing to save', 'info'); return; }
  (async () => { for (const p of paths) await saveFile(p); })();
}

/* ════════════════════════════════════════════════════════════
   PREVIEW — inlines same-workspace CSS/JS/image references so
   multi-file projects (index.html + style.css + script.js) render
   correctly in the popup instead of 404ing on relative paths that
   only exist virtually inside the workspace.
════════════════════════════════════════════════════════════ */
function resolveRelative(baseDir, ref) {
  if (/^(https?:)?\/\//.test(ref) || ref.startsWith('data:')) return null; // external, leave alone
  return resolvePath(baseDir, ref.split('#')[0].split('?')[0]);
}
function buildPreviewHTML(htmlPath) {
  const file = state.files[htmlPath];
  if (!file) return '';
  const baseDir = pathDir(htmlPath);
  let html = file.content;

  html = html.replace(/<link\s+[^>]*rel=["']stylesheet["'][^>]*>/gi, tag => {
    const m = tag.match(/href=["']([^"']+)["']/i);
    if (!m) return tag;
    const resolved = resolveRelative(baseDir, m[1]);
    if (resolved === null) return tag;
    const cssFile = state.files[resolved];
    return cssFile ? `<style>\n${cssFile.content}\n</style>` : tag;
  });

  html = html.replace(/<script\s+([^>]*)src=["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (tag, pre, src, post) => {
    const resolved = resolveRelative(baseDir, src);
    if (resolved === null) return tag;
    const jsFile = state.files[resolved];
    if (!jsFile) return tag;
    const typeAttr = /type=["']module["']/i.test(pre + post) ? ' type="module"' : '';
    return `<script${typeAttr}>\n${jsFile.content}\n<\/script>`;
  });

  html = html.replace(/(<img\s+[^>]*src=)["']([^"']+)["']/gi, (m0, pre, src) => {
    const resolved = resolveRelative(baseDir, src);
    if (resolved === null) return m0;
    const imgFile = state.files[resolved];
    if (!imgFile) return m0;
    return `${pre}"${imgFile.content}"`;
  });

  return html;
}
function pickPreviewPath() {
  if (state.activeTab && state.files[state.activeTab]?.language === 'html') return state.activeTab;
  const rootIndex = Object.keys(state.files).find(p => p.toLowerCase() === 'index.html');
  if (rootIndex) return rootIndex;
  return Object.keys(state.files).find(p => state.files[p].language === 'html') || null;
}
function openPreview() {
  const path = pickPreviewPath();
  if (!path) { showToast('No HTML file to preview', 'error'); return; }
  const html = buildPreviewHTML(path);
  if (state.previewWin && !state.previewWin.closed) {
    state.previewWin.document.open();
    state.previewWin.document.write(html);
    state.previewWin.document.close();
    state.previewWin.focus();
  } else {
    state.previewWin = window.open('', 'xcode-preview', 'width=1000,height=720');
    if (!state.previewWin) { showToast('Preview popup was blocked by the browser', 'error'); return; }
    state.previewWin.document.open();
    state.previewWin.document.write(html);
    state.previewWin.document.close();
  }
}
function updatePreview() {
  if (!state.previewWin || state.previewWin.closed) return;
  const path = pickPreviewPath();
  if (!path) return;
  const html = buildPreviewHTML(path);
  try {
    state.previewWin.document.open();
    state.previewWin.document.write(html);
    state.previewWin.document.close();
  } catch (e) { /* popup navigated away or closed mid-write */ }
}

/* ════════════════════════════════════════════════════════════
   QUICK OPEN (Ctrl+P) — fuzzy file finder
════════════════════════════════════════════════════════════ */
function fuzzyScore(query, target) {
  query = query.toLowerCase(); target = target.toLowerCase();
  if (!query) return 1;
  let qi = 0, score = 0, streak = 0;
  for (let ti = 0; ti < target.length && qi < query.length; ti++) {
    if (target[ti] === query[qi]) {
      score += 1 + streak;
      streak++;
      qi++;
    } else {
      streak = 0;
    }
  }
  return qi === query.length ? score : -1;
}
function openQuickOpen() {
  state.quickOpen = {query: '', results: Object.keys(state.files).filter(p => pathBase(p) !== '.keep').slice(0, 50), idx: 0};
  render();
  document.getElementById('quick-open-input')?.focus();
}
function closeQuickOpen() { state.quickOpen = null; render(); }
function updateQuickOpenQuery(q) {
  if (!state.quickOpen) return;
  state.quickOpen.query = q;
  const all = Object.keys(state.files).filter(p => pathBase(p) !== '.keep');
  const scored = all.map(p => ({p, s: fuzzyScore(q, p)})).filter(x => x.s >= 0);
  scored.sort((a, b) => b.s - a.s);
  state.quickOpen.results = scored.slice(0, 50).map(x => x.p);
  state.quickOpen.idx = 0;
  renderQuickOpenResultsOnly();
}
function confirmQuickOpen() {
  if (!state.quickOpen || !state.quickOpen.results.length) return;
  const path = state.quickOpen.results[state.quickOpen.idx];
  state.quickOpen = null;
  openFile(path);
}
/* ════════════════════════════════════════════════════════════
   TERMINAL — a genuine virtual shell over the workspace, plus
   real code execution: JS runs through the actual JS engine
   (new Function + captured console), and Python runs through a
   real Python interpreter (Pyodide, compiled CPython via WASM)
   loaded on first use. Nothing here is simulated output text —
   both `run script.js` and `python script.py` execute the file's
   actual current content and print what really happened.
════════════════════════════════════════════════════════════ */
const PYODIDE_CDN = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
let _pyodideInstance = null;
let _pyodideLoadPromise = null;

function termLine(text, cls) {
  return {text, cls: cls || ''};
}
function addTermLines(lines) {
  const box = document.getElementById('terminal-body');
  state.terminalHistory.push(...lines);
  if (state.terminalHistory.length > 500) state.terminalHistory = state.terminalHistory.slice(-500);
  if (box) {
    for (const l of lines) {
      const div = document.createElement('div');
      div.className = 'term-line' + (l.cls ? ' term-' + l.cls : '');
      div.textContent = l.text;
      box.appendChild(div);
    }
    box.scrollTop = box.scrollHeight;
  }
}
function termPrompt() {
  const cwd = state.terminalCwd || '';
  return `~/${cwd}`.replace(/\/$/, '') + ' $';
}

function resolveFileOrDir(cwd, input) {
  return resolvePath(cwd, input);
}
function lsAt(dirPath) {
  const prefix = dirPath ? dirPath + '/' : '';
  const seen = new Set();
  const out = [];
  for (const p of Object.keys(state.files)) {
    if (!p.startsWith(prefix)) continue;
    const rest = p.slice(prefix.length);
    if (!rest) continue;
    const seg = rest.split('/')[0];
    if (seg === '.keep') continue;
    if (seen.has(seg)) continue;
    seen.add(seg);
    const isDir = rest.includes('/') || (rest === seg && isFolderPath(pathJoin(dirPath, seg)));
    out.push({name: seg, isDir});
  }
  return out.sort((a, b) => (a.isDir === b.isDir) ? a.name.localeCompare(b.name) : (a.isDir ? -1 : 1));
}

async function runCommand(raw) {
  const cmdline = raw.trim();
  addTermLines([termLine(termPrompt() + ' ' + raw, 'cmd')]);
  state.terminalInput = '';
  if (!cmdline) { render(); return; }
  state.terminalCmdHistory.push(cmdline);
  if (state.terminalCmdHistory.length > 100) state.terminalCmdHistory.shift();
  state.terminalHistIdx = null;

  const parts = cmdline.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
  const cmd = (parts[0] || '').toLowerCase();
  const args = parts.slice(1).map(a => a.replace(/^"|"$/g, ''));
  const cwd = state.terminalCwd || '';

  try {
    switch (cmd) {
      case 'help':
        addTermLines([
          termLine('Files        ls [dir] · cd <dir> · pwd · cat <file> · tree [dir]'),
          termLine('Edit         touch <f> · mkdir <d> · rm [-r] <f> · mv <a> <b> · cp <a> <b> · echo <text> [> file]'),
          termLine('Search       find <name> · grep <text> <file>'),
          termLine('Run          run/node <f.js>  ·  python/py <f.py>   — actually executes the file'),
          termLine('Workspace    open <f> · save [f] · stats · theme <name> · diag'),
          termLine('Shell        clear · history · help')
        ]);
        break;
      case 'clear':
        state.terminalHistory = [];
        break;
      case 'pwd':
        addTermLines([termLine('/' + cwd)]);
        break;
      case 'history':
        addTermLines(state.terminalCmdHistory.map((c, i) => termLine(`${i + 1}  ${c}`)));
        break;
      case 'cd': {
        const target = args[0] === undefined ? '' : resolveFileOrDir(cwd, args[0]);
        if (target === '' || target === '.' || isFolderPath(target) || (target && lsAt(pathDir(target)).some(e => e.name === pathBase(target) && e.isDir))) {
          state.terminalCwd = target;
        } else {
          addTermLines([termLine(`cd: no such directory: ${args[0]}`, 'err')]);
        }
        break;
      }
      case 'ls': {
        const target = args.find(a => !a.startsWith('-')) !== undefined ? resolveFileOrDir(cwd, args.find(a => !a.startsWith('-'))) : cwd;
        const entries = lsAt(target);
        if (!entries.length) addTermLines([termLine('(empty)')]);
        else addTermLines([termLine(entries.map(e => e.isDir ? e.name + '/' : e.name).join('  '))]);
        break;
      }
      case 'tree': {
        const target = args[0] ? resolveFileOrDir(cwd, args[0]) : cwd;
        const lines = [];
        (function walk(dir, depth) {
          for (const e of lsAt(dir)) {
            lines.push(termLine('  '.repeat(depth) + (e.isDir ? '📁 ' : '📄 ') + e.name));
            if (e.isDir && depth < 6) walk(pathJoin(dir, e.name), depth + 1);
          }
        })(target, 0);
        addTermLines(lines.length ? lines : [termLine('(empty)')]);
        break;
      }
      case 'cat': {
        if (!args[0]) { addTermLines([termLine('usage: cat <file>', 'err')]); break; }
        const p = resolveFileOrDir(cwd, args[0]);
        const f = state.files[p];
        if (!f) { addTermLines([termLine(`cat: ${args[0]}: no such file`, 'err')]); break; }
        addTermLines(f.content.split('\n').map(l => termLine(l)));
        break;
      }
      case 'touch': {
        if (!args[0]) { addTermLines([termLine('usage: touch <file>', 'err')]); break; }
        const p = resolveFileOrDir(cwd, args[0]);
        if (!state.files[p]) {
          state.files[p] = {name: pathBase(p), path: p, content: '', language: getLang(p)};
          state.fileTree = rebuildTree(state.files);
          if (state.dirHandle) await fsWriteFile(p, '').catch(() => {});
          saveState();
        }
        break;
      }
      case 'mkdir': {
        if (!args[0]) { addTermLines([termLine('usage: mkdir <dir>', 'err')]); break; }
        const p = resolveFileOrDir(cwd, args[0]);
        const keep = pathJoin(p, '.keep');
        state.files[keep] = {name: '.keep', path: keep, content: '', language: 'plaintext'};
        state.fileTree = rebuildTree(state.files);
        if (state.dirHandle) await fsMkdir(p).catch(() => {});
        saveState();
        break;
      }
      case 'rm': {
        const recursive = args.includes('-r') || args.includes('-rf');
        const target = args.find(a => !a.startsWith('-'));
        if (!target) { addTermLines([termLine('usage: rm [-r] <file>', 'err')]); break; }
        const p = resolveFileOrDir(cwd, target);
        if (isFolderPath(p)) {
          if (!recursive) { addTermLines([termLine(`rm: ${target} is a directory (use -r)`, 'err')]); break; }
          for (const sub of allPathsUnder(p)) { delete state.files[sub]; delete state.diagnostics[sub]; }
          if (state.dirHandle) await fsRemove(p, true).catch(() => {});
        } else if (state.files[p]) {
          delete state.files[p]; delete state.diagnostics[p];
          if (state.dirHandle) await fsRemove(p, false).catch(() => {});
        } else {
          addTermLines([termLine(`rm: ${target}: no such file`, 'err')]);
          break;
        }
        state.fileTree = rebuildTree(state.files);
        state.openTabs = state.openTabs.filter(t => state.files[t.path]);
        if (state.activeTab && !state.files[state.activeTab]) state.activeTab = state.openTabs[0]?.path || null;
        saveState();
        break;
      }
      case 'mv': case 'cp': {
        if (!args[0] || !args[1]) { addTermLines([termLine(`usage: ${cmd} <src> <dest>`, 'err')]); break; }
        const src = resolveFileOrDir(cwd, args[0]);
        const dest = resolveFileOrDir(cwd, args[1]);
        const f = state.files[src];
        if (!f) { addTermLines([termLine(`${cmd}: ${args[0]}: no such file`, 'err')]); break; }
        state.files[dest] = {...f, name: pathBase(dest), path: dest};
        if (cmd === 'mv') delete state.files[src];
        state.fileTree = rebuildTree(state.files);
        saveState();
        break;
      }
      case 'echo': {
        const gtIdx = args.indexOf('>');
        if (gtIdx >= 0 && args[gtIdx + 1]) {
          const text = args.slice(0, gtIdx).join(' ');
          const p = resolveFileOrDir(cwd, args[gtIdx + 1]);
          state.files[p] = state.files[p] || {name: pathBase(p), path: p, content: '', language: getLang(p)};
          state.files[p].content = text + '\n';
          state.fileTree = rebuildTree(state.files);
          if (state.dirHandle) await fsWriteFile(p, state.files[p].content).catch(() => {});
          saveState();
        } else {
          addTermLines([termLine(args.join(' '))]);
        }
        break;
      }
      case 'find': {
        if (!args[0]) { addTermLines([termLine('usage: find <name>', 'err')]); break; }
        const matches = Object.keys(state.files).filter(p => pathBase(p).toLowerCase().includes(args[0].toLowerCase()) && pathBase(p) !== '.keep');
        addTermLines(matches.length ? matches.map(m => termLine('/' + m)) : [termLine('no matches')]);
        break;
      }
      case 'grep': {
        if (!args[0]) { addTermLines([termLine('usage: grep <text> [file]', 'err')]); break; }
        const needle = args[0].toLowerCase();
        const targets = args[1] ? [resolveFileOrDir(cwd, args[1])] : Object.keys(state.files);
        const out = [];
        for (const p of targets) {
          const f = state.files[p];
          if (!f || pathBase(p) === '.keep') continue;
          f.content.split('\n').forEach((l, i) => {
            if (l.toLowerCase().includes(needle)) out.push(termLine(`${p}:${i + 1}: ${l.trim()}`));
          });
        }
        addTermLines(out.length ? out.slice(0, 200) : [termLine('no matches')]);
        break;
      }
      case 'open': {
        if (!args[0]) { addTermLines([termLine('usage: open <file>', 'err')]); break; }
        const p = resolveFileOrDir(cwd, args[0]);
        if (!state.files[p]) { addTermLines([termLine(`open: ${args[0]}: no such file`, 'err')]); break; }
        openFile(p);
        break;
      }
      case 'save': {
        if (args[0]) { await saveFile(resolveFileOrDir(cwd, args[0])); }
        else saveAllFiles();
        break;
      }
      case 'stats': {
        const n = Object.keys(state.files).filter(p => pathBase(p) !== '.keep').length;
        const lines = Object.values(state.files).reduce((a, f) => a + (f.content ? f.content.split('\n').length : 0), 0);
        addTermLines([termLine(`${n} files, ${lines} lines total`)]);
        break;
      }
      case 'theme': {
        addTermLines([termLine('Themes are set from the status bar language/theme picker.')]);
        break;
      }
      case 'diag': {
        const n = Object.values(state.diagnostics).reduce((a, d) => a + d.length, 0);
        addTermLines([termLine(`${n} problem(s) across the workspace — see the Problems panel.`)]);
        break;
      }
      case 'run': case 'node': {
        if (!args[0]) { addTermLines([termLine(`usage: ${cmd} <file.js>`, 'err')]); break; }
        await execJSFile(resolveFileOrDir(cwd, args[0]));
        break;
      }
      case 'python': case 'py': {
        if (!args[0]) { addTermLines([termLine(`usage: ${cmd} <file.py>`, 'err')]); break; }
        await execPythonFile(resolveFileOrDir(cwd, args[0]));
        break;
      }
      case 'whoami':
        addTermLines([termLine('xcode-user')]);
        break;
      case 'date':
        addTermLines([termLine(new Date().toString())]);
        break;
      default:
        addTermLines([termLine(`command not found: ${cmd} (type "help")`, 'err')]);
    }
  } catch (e) {
    addTermLines([termLine('error: ' + e.message, 'err')]);
  }
  render();
}

/* ── Real JS execution: runs the actual file content through the JS engine ── */
async function execJSFile(path) {
  const f = state.files[path];
  if (!f) { addTermLines([termLine(`no such file: ${path}`, 'err')]); return; }
  const lines = [];
  const fmt = a => a.map(v => {
    if (typeof v === 'string') return v;
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }).join(' ');
  const fakeConsole = {
    log: (...a) => lines.push(termLine(fmt(a))),
    error: (...a) => lines.push(termLine(fmt(a), 'err')),
    warn: (...a) => lines.push(termLine(fmt(a), 'warn')),
    info: (...a) => lines.push(termLine(fmt(a)))
  };
  try {
    const fn = new Function('console', '"use strict";\n' + f.content);
    const result = fn(fakeConsole);
    if (result !== undefined) lines.push(termLine('=> ' + fmt([result])));
  } catch (e) {
    lines.push(termLine((e.name || 'Error') + ': ' + e.message, 'err'));
  }
  addTermLines(lines.length ? lines : [termLine('(no output)')]);
}

/* ── Real Python execution via Pyodide (actual CPython compiled to WASM) ── */
function loadPyodideOnce() {
  if (_pyodideLoadPromise) return _pyodideLoadPromise;
  _pyodideLoadPromise = new Promise((resolve, reject) => {
    state.pyodideStatus = 'loading';
    const script = document.createElement('script');
    script.src = PYODIDE_CDN;
    script.onload = async () => {
      try {
        const pyodide = await window.loadPyodide();
        _pyodideInstance = pyodide;
        state.pyodideStatus = 'ready';
        resolve(pyodide);
      } catch (e) { state.pyodideStatus = 'error'; reject(e); }
    };
    script.onerror = () => { state.pyodideStatus = 'error'; reject(new Error('Failed to load the Python runtime — check your internet connection.')); };
    document.head.appendChild(script);
  });
  return _pyodideLoadPromise;
}
async function execPythonFile(path) {
  const f = state.files[path];
  if (!f) { addTermLines([termLine(`no such file: ${path}`, 'err')]); return; }
  if (!_pyodideInstance) {
    addTermLines([termLine('Loading Python runtime (first run only, needs internet)…')]);
    render();
    try {
      await loadPyodideOnce();
    } catch (e) {
      addTermLines([termLine(e.message, 'err')]);
      render();
      return;
    }
  }
  const py = _pyodideInstance;
  const out = [];
  py.setStdout({batched: s => out.push(termLine(s))});
  py.setStderr({batched: s => out.push(termLine(s, 'err'))});
  try {
    await py.runPythonAsync(f.content);
  } catch (e) {
    out.push(termLine(String(e.message || e), 'err'));
  }
  addTermLines(out.length ? out : [termLine('(no output)')]);
}

/* ── Command-line + file-path tab completion ── */
function completeTerminalInput(current) {
  const parts = current.split(' ');
  const last = parts[parts.length - 1];
  if (parts.length === 1) {
    const cmds = ['help', 'clear', 'pwd', 'ls', 'cd', 'cat', 'touch', 'mkdir', 'rm', 'mv', 'cp', 'echo', 'find', 'grep', 'open', 'save', 'stats', 'theme', 'diag', 'run', 'node', 'python', 'py', 'tree', 'history', 'whoami', 'date'];
    const matches = cmds.filter(c => c.startsWith(last));
    if (matches.length === 1) { parts[parts.length - 1] = matches[0] + ' '; return parts.join(' '); }
    if (matches.length > 1) addTermLines([termLine(matches.join('  '))]);
    return current;
  }
  const cwd = state.terminalCwd || '';
  const dirOfLast = pathDir(last);
  const base = pathBase(last);
  const searchDir = resolveFileOrDir(cwd, dirOfLast);
  const entries = lsAt(searchDir).filter(e => e.name.startsWith(base));
  if (entries.length === 1) {
    parts[parts.length - 1] = (dirOfLast ? dirOfLast + '/' : '') + entries[0].name + (entries[0].isDir ? '/' : ' ');
    return parts.join(' ');
  }
  if (entries.length > 1) addTermLines([termLine(entries.map(e => e.name + (e.isDir ? '/' : '')).join('  '))]);
  return current;
}
/* ════════════════════════════════════════════════════════════
   PANE IDENTITY
   'main' is the primary editor; 0..N-1 index into state.splitPanes.
   Every pane-aware feature (AI ghost text, diagnostics decoration,
   Ctrl+S, Ctrl+., find/replace, zoom) resolves through these so it
   works the same regardless of which pane the user is in — this is
   what makes split panes full citizens instead of a stripped-down
   second editor.
════════════════════════════════════════════════════════════ */
function getAllPaneIds() {
  return ['main', ...state.splitPanes.map((_, i) => i)];
}
function paneIdToPath(paneId) {

}
function paneTextareaId(paneId) {

}
function paneTextareaEl(paneId) {

}
function paneScrollId(paneId) {
