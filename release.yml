name: Build installers

# Runs when you push a version tag (e.g. v1.0.0), or manually from the Actions tab.
# Each installer is built on its own real operating system, which is the only way to get a
# proper macOS .dmg and a fully branded Windows installer.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the installers to the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # One source of truth: the desktop app loads the same XCode.html that powers the website.
      - name: Copy the editor into the desktop app
        shell: bash
        run: |
          mkdir -p desktop/src
          cp XCode.html desktop/src/XCode.html

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # macOS: build both Apple Silicon and Intel. Windows/Linux: x64.
      - name: Build installer (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build installer (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no signing certificate yet — see README
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never

      - name: Build installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
